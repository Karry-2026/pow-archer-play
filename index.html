    bossBar.style.display = 'none';
  }
}

/* ═══════════ 波次 ═══════════ */
var spawnAcc = 0;
var bossSpawned = false;

function aliveCount(){
  var n = 0;
  for(var k=0;k<4;k++) n += E[EKEYS[k]].length;
  return n;
}

function waveUnlocks(){
  /* 每种怪在数组里出现几次，就是几份刷新权重。
     原来第 3 波又 push 了一遍 blob 和 spiker，导致它们权重是肥球的 2 倍，
     肥球本来就稀，再被压一半，很难遇到。现在每波只列一次，权重明确。 */
  var w = S.wave, out = ['blob'];
  if(w >= 2) out.push('spiker');
  if(w >= 4) out.push('chunk');
  if(w >= 6) out.push('thrower');
  /* 第 8 波起肥球成群：再给一份权重，这是唯一允许的加权 */
  if(w >= 8) out.push('chunk');
  return out;
}

function spawnRing(){
  var a = Math.random()*TAU;
  var base = rnd(17, 27);
  var x = hero.x + Math.cos(a)*base;
  var z = hero.z + Math.sin(a)*base;
  var dd = Math.hypot(x, z), lim = ARENA_R - 1.8;
  if(dd > lim){ x = x/dd*lim; z = z/dd*lim; }
  var types = waveUnlocks();
  var t = pick(types);
  var ec = S.wave >= 8 ? 0.13 : (S.wave >= 4 ? 0.07 : (S.wave >= 3 ? 0.035 : 0));
  spawnEnemy(t, x, z, {elite: Math.random() < ec});
}

function updateSpawn(dt){
  /* BOSS 在场（且已经升起）时不刷小兵。
     这是「单挑」成立的前提：玩家只需要读 BOSS 的招式，不用同时躲杂兵。 */
  if(boss && !boss.dead) return;
  var wc = waveCurve(S.wave, S.waveLen ? S.waveT/S.waveLen : 0);
  /* 基础密度也跟着降：原来 1.35 + 0.5×波次，第 10 波光基础值就到 6.35/秒，
     叠加倍率后 11.5/秒，而满配玩家的实测清怪上限只有 5.3/秒。 */
  var rate = (1.30 + S.wave*0.42) * wc.rate * S.spawnMul;
  var cap = Math.min(MAX_ENEMY, 24 + S.wave*13) * (S.spawnMul > 1.4 ? 1.25 : 1);
  spawnAcc += dt * rate;
  var alive = aliveCount();
  var guard = 0;
  while(spawnAcc >= 1 && alive < cap && guard < 12){
    spawnAcc -= 1; alive++; guard++;
    spawnRing();
  }
  if(spawnAcc > 6) spawnAcc = 6;
}

function nextWave(){
  S.wave++;
  S.waveT = 0;
  if(S.wave > S.waveTotal){ victory(); return; }
  bossSpawned = false;
  toast('WAVE ' + S.wave, '#00e5ff');
  flash(0.18);
  if(S.wave === 5 || S.wave === 10){ spawnBoss(); }
}

/* 各波次「标准配装」的预期 DPS，与 docs/爆裂弓箭手_数值分析表.xlsx 的
   「玩家成长 · 建议DPS」列一一对应。BOSS 血量由它反推，
   这样 BOSS 战时长稳定在 12-18 秒，不会因为写死一个常数而崩。
   现在它只用于「标准配装参考」和数值自洽校验（docs/tools/calc_curve.py），
   不再决定 BOSS 血量——那已经改成按实时 DPS 派生。改武器参数后仍要重跑工具同步。 */
var EXPECTED_DPS = [13, 32, 119, 180, 517, 737, 789, 1174, 1419, 1797];

/* 清场：BOSS 登场时小兵全部震散。
   以前是小兵和 BOSS 混在一起打，玩家分不清该躲谁，
   BOSS 的招式也全被杂兵挡住。现在先清场再单挑。 */
function clearMinionsForBoss(){
  var total = 0;
  EKEYS.forEach(function(k){
    var list = E[k];
    total += list.length;
    for(var i=0;i<list.length;i++){
      var e = list[i];
      burst(e.x, 0.7, e.z, ETYPES[k].color, 4, 6, 0.55);
      /* 原来每只小兵掉一颗经验球，一清场就是满地绿点，把 BOSS 的
         弹幕和冲锋预警全遮住了。改成只有 1/4 概率掉，够补一点经验就行。 */
      if(Math.random() < 0.25) spawnGem(e.x, e.z, 1);
    }
    list.length = 0;
  });
  return total;
}

function spawnBoss(){
  if(boss){ scene.remove(boss.obj); boss = null; }

  var kind = S.wave >= 10 ? 'hands' : 'maw';

  /* ── 血量按「玩家此刻真实 DPS × 目标有效输出秒数」派生 ──
     原来用的是 EXPECTED_DPS 查表：那是「典型配装」的期望值，
     跟玩家实际拿到的牌完全脱节。实测四个构筑策略打第 5 波：
     弱配装（只有一把弓）90 秒都打不完，强配装（三把武器带满级激光）
     42 秒收工 —— 同一个 7216 血，体验差三倍。
     现在改成开战那一刻读玩家自己的 DPS，谁打都是同一个时长。

     为什么不是 DPS × 16，而是 × 12 / 20：
     理论 DPS 假设「每一发都命中」。实战里玩家要躲冲锋、躲弹幕，
     有效输出时间约占 60-75%，所以目标秒数按这个折损定。 */
  var liveDps = currentBossDPS();
  /* 目标「墙钟」时长：第 5 波 32 秒、第 10 波 45 秒。
     依据：TapTap《游戏数值设计规范》给前期 Boss 30-60 秒；
     我们这局总共 5-6 分钟，两场 Boss 合计约 77 秒，占 22%，不会拖。
     注意这两个数是墙钟，血量要扣掉「无效输出窗口」的部分。 */
  var targetTtk = kind === 'hands' ? 45 : 32;
  /* 转阶段 4.5 秒 + 狂暴 2.5 秒共 7 秒无敌，这段时间打不出伤害。
     所以「有效输出窗口」= 目标墙钟 - 7。
     sHit 已经按实测校准过（近距离 BOSS 会贴上来），
     estimateDPS(single) 和真实输出基本对齐，所以这里直接扣时间。 */
  var dmgWindow = targetTtk - 7;
  /* 不设血量下限。上一版给了 2600 的下限「防止 BOSS 变纸」，
     结果弱配装（DPS 30）要打 87 秒 —— 下限本意是保护体验，
     实际保护的是「BOSS 的尊严」，牺牲的是玩家的时间。
     完全跟随 DPS 反而最公平：谁打都是 ttk 秒。 */
  var hp = Math.max(260, Math.round(liveDps * dmgWindow));

  /* ── 出场序列：清场 → 白闪震屏 → 从地下升起 ── */
  var cleared = clearMinionsForBoss();
  if(cleared > 0) SFX.kill();
  flash(0.42); shake(1.2);
  shock(hero.x, hero.z, COS.cyn, 18, 0.8);
  speedLines(0.85, 260);

  /* 生成在玩家「正前方 9 单位」而不是地图随机点：
     随机点常常落在视野边缘，玩家听到 BOSS 音乐却找不到它。
     取玩家当前朝向（hero.ang），保证一登场就在镜头里。 */
  var fa = hero.ang || 0;
  var bx = clamp(hero.x + Math.sin(fa) * 9, -ARENA_R+6, ARENA_R-6);
  var bz = clamp(hero.z + Math.cos(fa) * 9, -ARENA_R+6, ARENA_R-6);

  boss = buildBoss(bx, bz, hp, kind);
  bossSpawned = true;

  setBossBar(kind);
  bossBar.style.display = 'block';
  /* 把「按你的 DPS 算，这场大概要打多久」写在血条上。
     玩家能看懂为什么血条这么长，也方便回看时判断数值是否合理。 */
  boss.dpsAtSpawn = liveDps;
  boss.planTtk = targetTtk;
  boss.dmgWindow = dmgWindow;
  boss.dmgTaken = 0; boss.calibT = 0; boss.calibrated = false;

  SFX.boss();
  BGM.setMode('boss');
  popWord(kind === 'hands' ? '千手墨神' : '裂口巨兽', innerWidth/2, innerHeight*0.3,
          kind === 'hands' ? '#00e5ff' : '#ff2e88', 58);
  toast('小兵已被震散 · 单挑开始', '#ffe600');
  shock(bx, bz, COS.mag, 13, 0.9);
}

function setBossBar(kind){
  var name = kind === 'hands' ? '千手墨神' : '裂口巨兽';
  var sub  = kind === 'hands' ? '第 10 波 · 八臂弹幕 · 会瞬移' : '第 5 波 · 巨颚冲锋 · 震地';
  var col  = kind === 'hands' ? '#00e5ff' : '#ff2e88';
  var grad = kind === 'hands'
    ? 'linear-gradient(90deg,#141033,#00e5ff,#ffe600)'
    : 'linear-gradient(90deg,#7b2ff7,#ff2e88,#ffe600)';
  bossBar.innerHTML =
    '<div style="font-family:var(--disp);font-size:14px;letter-spacing:.22em;' +
      'color:' + col + ';text-align:center;text-shadow:2px 2px 0 #0a0a12">' + name + '</div>' +
    '<div style="font-size:9px;letter-spacing:.12em;color:#cfd6e4;text-align:center;' +
      'margin-bottom:3px;text-shadow:1px 1px 0 #0a0a12">' + sub + '</div>' +
    '<div style="height:13px;background:rgba(10,10,18,.85);border:3px solid #0a0a12">' +
      '<i id="bosshp" style="display:block;height:100%;width:100%;background:' + grad +
      ';transition:width .1s"></i></div>';
}


function angLerp(a, b, t){
  var d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
  return a + d*t;
}

function hurtHero(dmg){
  if(hero.invuln > 0 || !hero.alive) return;
  hero.hp -= dmg;
  hero.invuln = 0.70;
  SFX.hurt(); shake(0.45); hurtTint(); flash(0.1);
  speedLines(0.55, 180);
  burst(hero.x, 1.0, hero.z, COS.red, 8, 7, 1.1);
  if(hero.hp <= 0){ hero.hp = 0; gameOver(false); }
  updateHUD();
}

function updateHero(dt){
  var mx = 0, mz = 0;
  if(keys['a'] || keys['arrowleft'])  mx -= 1;
  if(keys['d'] || keys['arrowright']) mx += 1;
  if(keys['w'] || keys['arrowup'])    mz -= 1;
  if(keys['s'] || keys['arrowdown'])  mz += 1;
  if(stick.on){ mx += stick.nx; mz += stick.nz; }

  var len = Math.hypot(mx, mz);
  if(len > 1){ mx /= len; mz /= len; }

  hero.mx = mx; hero.mz = mz;
  var spd = hero.stat.spd;
  hero.x += mx * spd * dt;
  hero.z += mz * spd * dt;

  var lim = ARENA_R - 1.8;
  var dd = Math.hypot(hero.x, hero.z);
  if(dd > lim){ hero.x = hero.x/dd*lim; hero.z = hero.z/dd*lim; }

  hero.invuln = Math.max(0, hero.invuln - dt);

  // 朝向最近敌人
  var tgt = nearestEnemy(hero.x, hero.z, 26);
  if(tgt){
    var want = Math.atan2(tgt.x - hero.x, tgt.z - hero.z);
    hero.ang = angLerp(hero.ang, want, 1-Math.pow(0.0001, dt));
  }

  var moving = len > 0.08;
  var bob = moving ? Math.sin(S.t*15)*0.07 : Math.sin(S.t*3)*0.03;
  hero.obj.position.set(hero.x, bob, hero.z);
  hero.obj.rotation.y = hero.ang;
  hero.obj.rotation.z = moving ? Math.sin(S.t*15)*0.05 : 0;
  hero.obj.visible = true;

  heroRing.position.set(hero.x, 0.07, hero.z);
  heroRing.userData.inner.rotation.z = S.t * 0.9;
  heroRing.userData.outer.rotation.z = -S.t * 1.6;
  heroRing.userData.outer.material.opacity = hero.invuln > 0
    ? (0.4 + 0.6 * Math.abs(Math.sin(S.t * 16)))
    : 0.75;
  heroRing.visible = hero.alive;

  /* 连刃：半径不是常数，跟着呼吸相位在内外圈之间走。
     bdir=+1 正在向外张（内→外），bdir=-1 正在收回（外→内）。
     结算点就落在两端的极值上 —— 视觉上刀刃到哪个圈，伤害就打到哪个圈。 */
  var sc = hasWeapon('blade');
  var cnt = sc ? (sc.evo ? 6 : [2,3,4,5,6][sc.lv-1]) : 0;
  var R = 0, ext = 0, bank = 0;
  if(sc){
    var rg = bladeRange(sc, hero.stat);
    var half = WDEF.blade.cd[sc.lv-1] / hero.stat.as / 2;
    var prog = Math.min(1, (sc.bt || 0) / (half || 1));
    /* ext = 「已经张开到几分」，0 在内圈、1 在外圈。两个方向共用同一个量，
       环的亮度、刀身的倾斜都从它推，避免各写一套导致不同步。 */
    ext = (sc.bdir === 1) ? prog : 1 - prog;
    R = rg.min + (rg.max - rg.min) * ext;
    /* 倾斜在两端归零、中间最大 —— 极值处方（刀正打在怪身上）保持平直，
       中段才微微立起来，读起来像在划而不是在抖。 */
    bank = Math.sin(ext * Math.PI) * 0.34;
    bladeRings[0].visible = bladeRings[1].visible = true;
    bladeRings[0].scale.setScalar(rg.min);
    bladeRings[1].scale.setScalar(rg.max);
    bladeRings[0].position.set(hero.x, 0.06, hero.z);
    bladeRings[1].position.set(hero.x, 0.06, hero.z);
    bladeRings[0].material.opacity = 0.05 + 0.16 * (1 - ext);
    bladeRings[1].material.opacity = 0.05 + 0.16 * ext;
  } else {
    bladeRings[0].visible = bladeRings[1].visible = false;
  }
  for(var i=0;i<6;i++){
    var m = bladeParts[i];
    if(i < cnt){
      m.visible = true;
      var a = S.t * (3.0 + (sc?sc.lv*0.42:0)) + i/cnt*TAU;
      /* 刀身沿切线摆，才是「转」；沿半径摆是「朝外戳」，六个方向看着像太阳。
         高度随 ext 微抬：张开的刀高一点，收回时压低，俯视能看出前后层次。 */
      m.position.set(hero.x + Math.cos(a)*R, 0.80 + 0.10*ext, hero.z + Math.sin(a)*R);
      m.rotation.set(bank, -a, 0);
      /* 张开时刀略微放大：远景机位（相机高 24）下刀身只有二十几像素，
         再加一点体量才能认出是刃。三个百分点跟随呼吸，不是恒定放大。 */
      m.scale.setScalar(1.12 + 0.06*ext);
    } else {
      m.visible = false;
    }
  }
}

/* ═══════════ 敌人更新 ═══════════ */
function updateEnemies(dt){
  for(var k=0;k<4;k++){
    var key = EKEYS[k], list = E[key];
    for(var i=list.length-1;i>=0;i--){
      var e = list[i];
      if(e.dead){ list.splice(i,1); continue; }
      e.hit = Math.max(0, e.hit - dt*4.5);
      e.phase += dt;
      var dx = hero.x - e.x, dz = hero.z - e.z;
      var d = Math.hypot(dx, dz) || 1;
      var nx = dx/d, nz = dz/d;

      if(e.offs === undefined) e.offs = rnd(-0.55, 0.55);
      var spread = e.offs * clamp(1 - d/20, 0, 1);
      var ang = Math.atan2(nx, nz) + spread;
      nx = Math.sin(ang); nz = Math.cos(ang);
      e.ang = Math.atan2(dx, dz);

      var slowK = (e.slowT > 0) ? e.slowMul : 1;
      var spd = e.spd * slowK;
      if(key === 'spiker'){
        e.cd -= dt;
        if(e.cd <= 0){ e.cd = 2.4; e.dash = 0.5; }
        if(e.dash > 0){ e.dash -= dt; spd *= 2.0; }
      } else if(key === 'thrower'){
        e.cd -= dt;
        if(d > 13){ /* 靠近 */ }
        else if(d < 8){ spd = -e.spd*0.85*slowK; }
        else { spd = 0; }

        /* 抬手 0.45 秒再开火。
           原来是冷却一到子弹凭空出现，玩家只能等它飞到眼前才知道被瞄了。
           0.45 秒是「来得及反应、又不至于慢到没威胁」的折中：
           论文测出预警普遍在 800ms，但玩家实际只在最后 200-300ms 才注意到，
           所以预警必须带一个「越来越亮/越来越小」的收束过程。 */
        if(e.wind > 0){
          e.wind -= dt;
          if(spd === 0){ /* 蓄力时站定，不飘 */ }
          if(e.wind <= 0){
            spawnEBullet(e.x, e.z, nx*11, nz*11, e.dmg);
            burst(e.x + nx*0.6, 1.15, e.z + nz*0.6, 0xff2e88, 6, 6.5, 0.7);
            shock(e.x, e.z, 0xff2e88, 2.4, 0.32);
            SFX.eshoot();
            e.cd = 2.8;
          }
        } else if(e.cd <= 0 && d < 17){
          e.wind = 0.45;
          e.windMax = 0.45;
        }
      }

      e.x += nx * spd * dt;
      e.z += nz * spd * dt;
      if(e.slowT > 0) e.slowT -= dt;

      if(d < e.r + 0.55) hurtHero(e.dmg);
    }
  }
  // 边界
  for(var k2=0;k2<4;k2++){
    var l2 = E[EKEYS[k2]];
    for(var i2=0;i2<l2.length;i2++){
      var e2 = l2[i2];
      var dd2 = Math.hypot(e2.x, e2.z), lm = ARENA_R - 1.2;
      if(dd2 > lm){ e2.x = e2.x/dd2*lm; e2.z = e2.z/dd2*lm; }
    }
  }
}

/* ═══════════ BOSS 更新 ═══════════ */
/* BOSS 的减速用「位移回拉」实现，不在每处移动代码里乘系数。
   BOSS 的位移分散在冲锋 / 贴近 / 瞬移 / 弹幕漂移等六七处，
   逐个加系数必漏；这里在整帧结束后按比例把位移缩回来，一处覆盖全部。 */
function updateBossWithSlow(dt){
  if(!boss) return;
  var px = boss.x, pz = boss.z;
  updateBoss(dt);
  var b = boss;
  if(!b || b.dead) return;
  if(b.slowT > 0){
    b.x = px + (b.x - px) * b.slowMul;
    b.z = pz + (b.z - pz) * b.slowMul;
    b.slowT -= dt;
  }
}

function updateBoss(dt){
  if(!boss) return;
  var b = boss;
  b.t += dt;

  /* ── 出场：从地下升起来 ──
     升的这 1.5 秒里既不动也不攻击，玩家有时间看清它长什么样。 */
  if(b.rise > 0){
    b.rise -= dt;
    var k = 1 - Math.max(0, b.rise) / b.riseMax;
    var e = k < 0.82 ? (k/0.82) : 1;
    b.obj.position.set(b.x, lerp(b.baseY - 6, b.baseY, e), b.z);
    b.obj.rotation.y = b.ang + (1 - e) * 5.5;
    if(b.rise <= 0){
      b.obj.position.y = b.baseY;
      shake(1.0); flash(0.28);
      shock(b.x, b.z, COS.yel, 15, 0.85);
      burst(b.x, 0.6, b.z, COS.mag, 22, 11, 1.3);
      SFX.boss();
    }
    return;
  }

  /* ── 开战 3.5 秒后按「真实输出」重新校准血量 ──
     为什么不能只靠估算：estimateDPS 是理论值，扇形武器的命中率随距离、
     目标移动大幅变化（实测同一套配装从 373 到 1211 DPS 都出现过）。
     估算偏差会让 BOSS 时而秒杀、时而打不动 —— 这正是最初的问题。
     做法：先按估算配血，打 3.5 秒后量一次真实 DPS，
     把血量按比例改成「真实 DPS × 目标窗口」，然后血条重置为满。
     这样无论什么配装，墙钟时长都落在目标附近；玩家不会看到血条倒退。 */
  if(!b.calibrated){
    b.calibT += dt;
    if(b.calibT >= 3.5 && b.dmgTaken > 0){
      var realDps = b.dmgTaken / b.calibT;
      if(realDps > 1){
        var want = Math.max(300, realDps * (b.dmgWindow || 25));
        b.maxhp = Math.round(want);
        b.hp = b.maxhp;
        b.dpsAtSpawn = Math.round(realDps);
      }
      b.calibrated = true;
    }
  }

  /* ── 阶段：用「打不到的时间」拉长战斗，而不是把血条堆成海绵 ──
     62% 转阶段：4.5 秒无敌 + 召唤 6 只小兵 + 震屏，玩家必须先清场或拉开距离；
     30% 狂暴：2.5 秒无敌 + 招式提速 35%，战斗节奏换挡。
     无敌期间 hurtEnemy 直接返回，屏幕提示「免疫」。 */
  if(b.invulnT > 0){
    b.invulnT -= dt;
    if(b.shield){
      b.shield.visible = true;
      b.shield.rotation.y += dt * 1.6;
      b.shield.rotation.x += dt * 0.9;
      b.shield.material.opacity = 0.20 + 0.18 * Math.abs(Math.sin(b.t * 6));
    }
    /* 无敌时缓慢后撤，逼玩家追，同时把场地让出来 */
    var bdx = b.x - hero.x, bdz = b.z - hero.z;
    var bd = Math.hypot(bdx, bdz) || 1;
    if(bd < 8){ b.x += bdx/bd * 2.4 * dt; b.z += bdz/bd * 2.4 * dt; }
    b.obj.position.set(b.x, b.baseY + Math.sin(b.t*4)*0.12, b.z);
    if(b.invulnT <= 0 && b.shield){ b.shield.visible = false; }
    return;
  }

  if(!b.phase2 && b.hp < b.maxhp * 0.62){
    b.phase2 = true;
    b.invulnT = 4.5;
    if(b.shield) b.shield.visible = true;
    flash(0.34); shake(0.55);
    shock(b.x, b.z, COS.cyn, 16, 0.9);
    burst(b.x, 1.0, b.z, 0xff2e88, 26, 12, 1.4);
    /* 召唤 6 只小兵，逼玩家一边躲一边清 */
    for(var mi=0;mi<6;mi++){
      var ma = mi/6*TAU;
      spawnEnemy(mi % 2 ? 'spiker' : 'blob', b.x + Math.cos(ma)*3.4, b.z + Math.sin(ma)*3.4, {});
    }
    toast(b.kind === 'hands' ? '第二阶段 · 护体墨甲' : '第二阶段 · 硬化外壳', '#00e5ff');
    SFX.boss();
  }

  /* 狂暴阶段必须排在二阶段之后。两段阈值各自独立判断时，一发暴击同时
     跨过 62% 和 30% 会让两个阶段在同一帧触发：4.5 秒无敌被 2.5 秒覆盖，
     两条 toast 一起弹，玩家少了一次喘息。实测第 5 波 BOSS 就出现过
     「P2 与 P3 同一帧、invulnT 只剩 2.5」。所以这里要求二阶段的无敌已经走完。 */
  if(!b.phase3 && b.phase2 && b.invulnT <= 0 && b.hp < b.maxhp * 0.30){
    b.phase3 = true;
    b.rage = true;
    b.invulnT = 2.5;
    if(b.shield) b.shield.visible = true;
    flash(0.4); shake(0.7);
    shock(b.x, b.z, COS.red, 12, 0.7);
    toast(b.kind === 'hands' ? '千手墨神 · 狂怒' : '裂口巨兽 · 狂怒', '#ff2e88');
    SFX.boss();
  }

  var rageK = b.rage ? 1.35 : 1;

  if(b.kind === 'hands') updateHandsBoss(b, dt, rageK);
  else updateMawBoss(b, dt, rageK);
}

/* ── 裂口巨兽：贴地追击 + 蓄力冲锋 + 震地环 ── */
function updateMawBoss(b, dt, rageK){
  var dx = hero.x - b.x, dz = hero.z - b.z;
  var d = Math.hypot(dx, dz) || 1;
  b.ang = Math.atan2(dx, dz);
  b.obj.rotation.y = b.ang;
  b.obj.position.set(b.x, b.baseY + Math.sin(b.t * 3.2) * 0.06, b.z);

  b.dashCd -= dt * rageK;
  b.slamCd -= dt * rageK;

  if(b.state === 'windup'){
    b.stateT -= dt;
    var q = 1 - Math.max(0, b.stateT) / 0.62;
    /* 蓄力时身体后坐、压扁，让玩家看得出「要冲了」 */
    b.obj.scale.set(1 + q*0.14, 1 - q*0.16, 1 + q*0.22);
    if(b.stateT <= 0){
      b.state = 'dash'; b.stateT = 0.78;
      b.dashDir = {x: dx/d, z: dz/d};
      b.obj.scale.set(1, 1, 1);
      SFX.boss(); shake(0.55);
    }
  } else if(b.state === 'dash'){
    b.stateT -= dt;
    b.x += b.dashDir.x * 36 * dt;
    b.z += b.dashDir.z * 36 * dt;
    burst(b.x - b.dashDir.x*1.6, 0.7, b.z - b.dashDir.z*1.6, COS.mag, 2, 5, 0.55);
    if(b.stateT <= 0){ b.state = 'idle'; b.stateT = 0.75; }
  } else {
    b.stateT -= dt;
    b.x += (dx/d) * 3.4 * dt;
    b.z += (dz/d) * 3.4 * dt;
    if(b.dashCd <= 0 && d > 4.5){
      b.dashCd = 4.6;
      b.state = 'windup'; b.stateT = 0.62;
      shock(b.x, b.z, COS.red, 3.4, 0.5);
    }
  }

  /* 震地：十八方向冲击弹，逼玩家离开近身 */
  if(b.slamCd <= 0){
    b.slamCd = 6.6;
    for(var i=0;i<18;i++){
      var a = i/18*TAU;
      spawnEBullet(b.x, b.z, Math.cos(a)*12, Math.sin(a)*12, 18);
    }
    shock(b.x, b.z, COS.yel, 11, 0.7);
    shake(1.0); SFX.boss();
  }

  /* 身体接触伤害 */
  if(d < b.r + 0.7) hurtHero(b.dmg);

  var lim = ARENA_R - 4;
  var dd = Math.hypot(b.x, b.z);
  if(dd > lim){ b.x = b.x/dd*lim; b.z = b.z/dd*lim; }
}

/* ── 千手墨神：悬浮保持距离 + 环形弹幕 + 追踪弹 + 瞬移 ── */
function updateHandsBoss(b, dt, rageK){
  var dx = hero.x - b.x, dz = hero.z - b.z;
  var d = Math.hypot(dx, dz) || 1;
  b.ang = Math.atan2(dx, dz);
  b.obj.rotation.y = b.ang;
  b.obj.position.set(b.x, b.baseY + Math.sin(b.t * 1.8) * 0.38, b.z);

  /* 八臂摆动 */
  var arms = b.obj.userData.arms;
  if(arms){
    for(var i2=0;i2<arms.length;i2++){
      var ud = arms[i2].userData;
      if(ud.baseAng === undefined) continue;   // 防御：没有基准角就不动，绝不算 NaN
      /* 只叠加「绕 Y 轴的小幅摆动」和「上下起伏」，不改 Z 轴，
         这样八条手臂始终平铺在水平面上，俯视一直是放射状。 */
      arms[i2].rotation.y = ud.baseAng + Math.sin(b.t * 2.4 + ud.phase) * 0.18;
      arms[i2].rotation.x = Math.sin(b.t * 3.1 + ud.phase) * 0.13;
    }
  }
  /* 双环反向转 */
  if(b.obj.userData.ring1) b.obj.userData.ring1.rotation.z += dt * 1.6;
  if(b.obj.userData.ring2) b.obj.userData.ring2.rotation.z -= dt * 2.4;
  /* 瞳孔追玩家 */
  if(b.obj.userData.pupil){
    b.obj.userData.pupil.position.x = clamp(dx/d * 0.16, -0.2, 0.2);
    b.obj.userData.pupil.position.z = 0.85;
  }

  b.cd -= dt * rageK;
  b.orbCd -= dt * rageK;
  b.tpCd -= dt;

  /* 保持 9.5 单位距离：太近后退，太远靠近。
     血量过半进狂暴后改为贴身 4.5 —— 否则纯近战构筑（镰刀/地刺）
     整场都够不到它，实测有一半构筑会把 90 秒打满还没打死。
     狂暴 = 放弃远程优势，开始压制，机制上也更容易读。 */
  var want = b.rage ? 4.5 : 9.5;
  var mv = d < want - 2.2 ? -3.6 : (d > want + 2.2 ? 3.0 : 0);
  b.x += (dx/d) * mv * dt;
  b.z += (dz/d) * mv * dt;

  /* 环形弹幕：十六发，带旋转偏移，两层交替 */
  if(b.cd <= 0){
    b.cd = 3.4;
    var cnt = b.rage ? 22 : 16;
    for(var i3=0;i3<cnt;i3++){
      var a2 = i3/cnt*TAU + b.t * 0.55;
      spawnEBullet(b.x, b.z, Math.cos(a2)*11, Math.sin(a2)*11, 15);
    }
    shock(b.x, b.z, COS.cyn, 4.8, 0.4);
    SFX.laser();
  }

  /* 追踪弹：朝玩家 ±0.26 弧度三连 */
  if(b.orbCd <= 0){
    b.orbCd = 6.0;
    var base = Math.atan2(dx, dz);
    for(var k3=-1;k3<=1;k3++){
      var a3 = base + k3 * 0.26;
      spawnEBullet(b.x, b.z, Math.sin(a3)*14.5, Math.cos(a3)*14.5, 17);
    }
    SFX.boss();
  }

  /* 瞬移：消失在青色粒子中，出现在玩家周身 8 单位处 */
  if(b.tpCd <= 0){
    b.tpCd = 7.5;
    burst(b.x, 1.6, b.z, COS.cyn, 18, 9, 1.0);
    var a4 = Math.random()*TAU;
    b.x = clamp(hero.x + Math.cos(a4)*8.5, -ARENA_R+5, ARENA_R-5);
    b.z = clamp(hero.z + Math.sin(a4)*8.5, -ARENA_R+5, ARENA_R-5);
    burst(b.x, 1.6, b.z, COS.mag, 20, 10, 1.0);
    shock(b.x, b.z, COS.cyn, 5, 0.5);
    SFX.whooshDown();
  }

  if(d < b.r + 0.6) hurtHero(b.dmg);

  var lim2 = ARENA_R - 4;
  var dd2 = Math.hypot(b.x, b.z);
  if(dd2 > lim2){ b.x = b.x/dd2*lim2; b.z = b.z/dd2*lim2; }
}


function bulletHit(b, listArr, isEnemyList){}

function updateBulletArr(arr, dt){
  for(var i=arr.length-1;i>=0;i--){
    var b = arr[i];
    b.life -= dt;

    if(b.kind === 'shuriken'){
      /* 真实的回旋镖：直着甩出去 → 到最远点掉头 → 飞回「玩家此刻的位置」。
         旧写法用 sin(πu) 做前向位移、sin(2πu) 做侧摆，看起来是画一片叶子，
         而且终点固定是「扔出去时脚下的那个点」—— 玩家一边跑一边扔，
         镖就落在他身后原地消失，完全不像「收回手里」。
         现在回程一项直接朝 hero 的实时坐标插值，人往哪跑镖就往哪追。 */
      b.u += dt / b.dur;
      if(b.u >= 1){
        b.laps = (b.laps || 1) - 1;
        if(b.laps > 0){
          /* 超旋：回到手上不停，从当前站位再甩一圈 */
          b.u -= 1;
          b.done = (b.done || 0) + 1;
          b.ox = hero.x; b.oz = hero.z;
        } else {
          shock(hero.x, hero.z, SHU_COL, 1.5, 0.2);
          burst(hero.x, 1.2, hero.z, SHU_COL, 3, 4, 0.4);
          arr.splice(i, 1);
          continue;
        }
      }
      var su = b.u;
      var outPhase = su < 0.5;
      /* 去程 k: 0→1；回程 k 必须也是 0→1（从最远点回到手上），
         写成 (1-su)*2 会让它在回程起点瞬移到玩家身上再飞出去。 */
      var k = outPhase ? su * 2 : (su - 0.5) * 2;
      var fx = b.ox + b.dirx * b.maxD;                    // 最远点
      var fz = b.oz + b.dirz * b.maxD;
      var lat = Math.sin(Math.PI * k) * b.amp * (outPhase ? 1 : -1);
      var px, pz;
      if(outPhase){
        px = b.ox + b.dirx * b.maxD * k + b.sidex * lat;
        pz = b.oz + b.dirz * b.maxD * k + b.sidez * lat;
      } else {
        px = fx + (hero.x - fx) * k + b.sidex * lat;
        pz = fz + (hero.z - fz) * k + b.sidez * lat;
      }
      var pvx = px - b.x, pvz = pz - b.z;
      b.x = px; b.z = pz;
      if(Math.hypot(pvx, pvz) > 0.0005) b.ang = Math.atan2(pvx, pvz);
      b.spinA += dt * 24;
      b.tx = px - pvx * 1.6; b.tz = pz - pvz * 1.6;       // 拖尾落点

      var lim2 = ARENA_R - 1, dd2 = Math.hypot(b.x, b.z);
      if(dd2 > lim2){ b.x = b.x/dd2*lim2; b.z = b.z/dd2*lim2; }

      /* 每一「段」单独记账：每一圈的去程、回程各能打同一个敌人一次。 */
      var seg = (b.done || 0) * 2 + (outPhase ? 0 : 1);
      var hm = b.segs[seg] || (b.segs[seg] = []);
      var legDmg = b.dmg * (outPhase ? 1 : b.backMul);
      for(var k2=0;k2<4;k2++){
        var list2 = E[EKEYS[k2]];
        for(var j2=0;j2<list2.length;j2++){
          var e2 = list2[j2];
          if(e2.dead || hm.indexOf(e2) >= 0) continue;
          var rr2 = b.r + e2.r;
          if(dist2(b.x, b.z, e2.x, e2.z) < rr2*rr2){
            hm.push(e2);
            hurtEnemy(e2, legDmg, false);
            burst(b.x, b.y, b.z, SHU_COL, 3, 5, 0.55);
          }
        }
      }
      if(boss && !boss.dead && b.bossSegs.indexOf(seg) < 0){
        var br2 = b.r + boss.r;
        if(dist2(b.x, b.z, boss.x, boss.z) < br2*br2){
          b.bossSegs.push(seg);
          hurtEnemy(boss, legDmg, false);
          burst(b.x, b.y, b.z, SHU_COL, 3, 5, 0.6);
        }
      }
      continue;
    }

    b.x += b.vx*dt;
    b.z += b.vz*dt;
    b.ang = Math.atan2(b.vx, b.vz);

    if(b.life <= 0){
      if(b.kind === 'bomb') explode(b.x, b.z, b.dmg, 2.6 + (b.grow||1)*0.35, b.grow||1);
      arr.splice(i,1);
      continue;
    }

    // 出界
    if(Math.hypot(b.x,b.z) > ARENA_R + 3){ arr.splice(i,1); continue; }

    // 碰撞
    var gone = false;
    for(var k=0;k<4 && !gone;k++){
      var list = E[EKEYS[k]];
      for(var j=list.length-1;j>=0;j--){
        var e = list[j];
        if(e.dead) continue;
        if(b.hitList && b.hitList.indexOf(e) >= 0) continue;
        var rr = b.r + e.r;
        if(dist2(b.x,b.z,e.x,e.z) < rr*rr){
          if(b.kind === 'bomb'){ b.life = 0; }
          else hurtEnemy(e, b.dmg, false);
          if(b.pierce > 0 && b.hitList){
            b.pierce--; b.hitList.push(e);
            if(b.pierce <= 0) gone = true;
          } else if(b.kind !== 'bomb'){
            gone = true;
          }
          break;
        }
      }
    }
    /* BOSS 是一体目标，一颗子弹只能打它一次。
       原来这里没有「已命中」标记：穿透弹停在 BOSS 体内时会逐帧结算，
       60 帧/秒都在掉血 —— 实测单把五级弓打出 1211 DPS，而理论只有 213。
       这是「BOSS 被秒杀」的真正原因，跟血量公式无关。
       hitList 是给多个小怪用的，对 BOSS 用单独的 bossHit 标记。 */
    if(!gone && boss && !boss.dead && !b.bossHit){
      var br = b.r + boss.r;
      if(dist2(b.x,b.z,boss.x,boss.z) < br*br){
        if(b.kind === 'bomb'){ b.life = 0; }
        else{
          b.bossHit = true;
          hurtEnemy(boss, b.dmg, false);
          if(b.pierce > 0 && b.hitList) b.pierce--;
          else gone = true;
        }
      }
    }
    if(gone) arr.splice(i,1);
  }
}

function updateEBullets(dt){
  for(var i=eBullets.length-1;i>=0;i--){
    var b = eBullets[i];
    b.life -= dt;
    b.phase += dt;
    b.x += b.vx*dt; b.z += b.vz*dt;
    if(b.life <= 0 || Math.hypot(b.x,b.z) > ARENA_R + 3){ eBullets.splice(i,1); continue; }
    if(dist2(b.x,b.z,hero.x,hero.z) < 0.95*0.95){
      hurtHero(b.dmg);
      burst(b.x, 1, b.z, 0xff2e88, 6, 6, 0.85);
      eBullets.splice(i,1);
    }
  }
}

/* ═══════════ 减速（地刺专用） ═══════════
   只改「有效速度」，不动 e.spd 本身 ——
   e.spd 是所有移动计算的源头，直接改它会永久留下痕迹，
   等减速时间到了也恢复不回来。 */
function slowEnemy(e, mul, dur){
  if(!e || e.dead) return;
  e.slowT = Math.max(e.slowT || 0, dur);
  e.slowMul = Math.min(e.slowMul || 1, mul);
}

/* ═══════════ 地刺 / 宝石 / 宝箱 ═══════════ */
function updateSpikes(dt){
  for(var i=spikes.length-1;i>=0;i--){
    var s = spikes[i];
    s.life -= dt; s.tick -= dt;
    if(s.life <= 0){ spikes.splice(i,1); continue; }
    if(s.tick <= 0){
      s.tick = 0.34;
      var R = (1.25 + s.lv*0.12) * (s.evo ? 1.5 : 1) * (s.rng || 1);
      /* 扎中就减速 35%、持续 2 秒 —— 地刺的定位从「输出」变成「控场」，
         BOSS 被拖慢之后近身也不会瞬间被贴死。 */
      forEachEnemy(function(e){
        if(dist2(s.x,s.z,e.x,e.z) < (R+e.r)*(R+e.r)){
          hurtEnemy(e, s.dmg, false);
          slowEnemy(e, 0.65, 2.0);
        }
      });
      if(boss && !boss.dead && dist2(s.x,s.z,boss.x,boss.z) < (R+boss.r)*(R+boss.r)){
        hurtEnemy(boss, s.dmg, false);
        slowEnemy(boss, 0.65, 2.0);
      }
    }
  }
}

function updateGems(dt){
  var pickR = hero.stat.pick;
  for(var i=gems.length-1;i>=0;i--){
    var g = gems[i];
    g.t += dt;
    var dd = dist2(hero.x, hero.z, g.x, g.z);
    if(!g.pull && dd < pickR*pickR) g.pull = true;
    if(g.pull){
      var dx = hero.x - g.x, dz = hero.z - g.z;
      var d = Math.hypot(dx,dz)||1;
      var sp = 14 + g.t*16;
      g.x += dx/d*sp*dt;
      g.z += dz/d*sp*dt;
      g.y = lerp(g.y, 1.0, dt*6);
    } else {
      g.x += g.vx*dt; g.z += g.vz*dt;
      g.vx *= Math.pow(0.02, dt); g.vz *= Math.pow(0.02, dt);
      g.y = 0.45 + Math.sin(S.t*5 + g.x)*0.1;
    }
    if(dd < 1.0){
      /* 经验球是自动飞过来的（拾取半径 4.6），玩家常常没意识到自己「捡了东西」，
         所以大球吸收时给一个 +N 飘字，让「打怪 → 涨经验 → 升级」这条链看得见。 */
      gainXP(g.val);
      burst(g.x, 0.6, g.z, COS.gold, 3, 4, 0.6);
      if(g.val >= 4){
        var gsp = toScreen(g.x, 1.3, g.z);
        popDmg('+' + g.val, gsp.x, gsp.y, '#ffc233');
      }
      SFX.hit();
      gems.splice(i,1); continue;
    }
  }
}

function updateChests(dt){
  for(var i=chests.length-1;i>=0;i--){
    var c = chests[i];
    c.t += dt;
    c.halo.rotation.z += dt*1.4;
    var pulse = 1 + Math.sin(c.t*3)*0.07;
    c.obj.scale.setScalar(pulse);
    c.obj.position.y = Math.sin(c.t*2.2)*0.06;
    if(dist2(c.x, c.z, hero.x, hero.z) < 2.4*2.4) openChest(c);
  }
}

/* ═══════════ 渲染同步 ═══════════ */
function renderUltBeam(){
  if(!ultBeam.visible) return;
  var ang = hero.ult.ang || 0;
  var L = 58;
  var cx = hero.x + Math.sin(ang) * L/2;
  var cz = hero.z + Math.cos(ang) * L/2;
  ultBeam.position.set(cx, 1.0, cz);
  ultBeam.rotation.set(0, ang, 0);
  ultBeam.scale.set(4.4, 1, L);
  ultBeamCore.position.set(cx, 1.0, cz);
  ultBeamCore.rotation.set(0, ang, 0);
  ultBeamCore.scale.set(1.9, 1, L);
  var k = clamp(hero.ult.active / 0.55, 0, 1);
  ultBeam.material.opacity = 0.55 + 0.4 * k;
  ultBeamCore.material.opacity = 0.85 * k + 0.1;
}

function renderBullets(){
  var n = 0;
  for(var i=0;i<bullets.length;i++){
    var b = bullets[i];
    _dm.position.set(b.x, b.y, b.z);
    _dm.rotation.set(0, b.ang, 0);
    if(b.kind === 'laser'){
      _dm.scale.set(0.75, 0.75, 3.4);
    } else {
      _dm.scale.set(1,1, b.kind === 'arrow' ? 1.15 : 1);
    }
    _dm.updateMatrix();
    bulA.setMatrixAt(n++, _dm.matrix);
    if(n >= 300) break;
  }
  bulA.count = n; bulA.instanceMatrix.needsUpdate = true;

  /* 激光：单独一份红色实例池，几何和缩放与箭一样是细长条 */
  var nD = 0;
  for(var iD=0;iD<bulletsD.length;iD++){
    var bD = bulletsD[iD];
    _dm.position.set(bD.x, bD.y, bD.z);
    _dm.rotation.set(0, bD.ang, 0);
    _dm.scale.set(0.78, 0.78, 3.4);
    _dm.updateMatrix();
    bulD.setMatrixAt(nD++, _dm.matrix);
    if(nD >= 240) break;
  }
  bulD.count = nD; bulD.instanceMatrix.needsUpdate = true;

  var m = 0;
  for(var j=0;j<bulletsB.length;j++){
    var b2 = bulletsB[j];
    _dm.position.set(b2.x, b2.y, b2.z);
    _dm.rotation.set(b2.phase||0, b2.ang + (b2.phase||0), 0);
    _dm.scale.setScalar(b2.kind === 'bomb' ? (1.5 + (b2.grow||1)*0.16) : 1);
    _dm.updateMatrix();
    bulB.setMatrixAt(m++, _dm.matrix);
    if(m >= 240) break;
  }
  bulB.count = m; bulB.instanceMatrix.needsUpdate = true;

  /* 飞镖：轨迹线 + 黑描边 + 橙体 + 白心。
     轨迹是按参数方程反算的，不记录历史点 —— 所以无论 15 帧还是 60 帧，
     那条「扔出去再绕回来」的叶形弧都完整、连续。 */
  var cN = 0, trN = 0, pkN = 0, tilt = 0.38;
  for(var ci=0; ci<bulletsC.length && cN < 120; ci++){
    var b4 = bulletsC[ci];
    var rot = b4.ang + b4.spinA;

    for(var pk=1; pk<=14; pk++){
      if(pkN >= 320) break;
      var uu = b4.u - pk * 0.016;
      if(uu < 0) break;
      var ss = Math.sin(Math.PI * uu), ll = Math.sin(TAU * uu) * b4.amp;
      _dm.position.set(b4.ox + b4.dirx * b4.maxD * ss + b4.sidex * ll, b4.y,
                       b4.oz + b4.dirz * b4.maxD * ss + b4.sidez * ll);
      _dm.rotation.set(0, uu * 7, 0);
      _dm.scale.setScalar((1 - pk/18) * 1.2);
      _dm.updateMatrix();
      shuPathPool.setMatrixAt(pkN++, _dm.matrix);
    }

    for(var t4=1; t4<=2; t4++){
      if(trN >= 260) break;
      _dm.position.set(lerp(b4.x, b4.tx, t4*0.42), b4.y, lerp(b4.z, b4.tz, t4*0.42));
      _dm.rotation.set(tilt, rot - t4*0.5, 0);
      _dm.scale.setScalar(1.0 - t4*0.2);
      _dm.updateMatrix();
      shuTrailPool.setMatrixAt(trN++, _dm.matrix);
    }
    _dm.position.set(b4.x, b4.y - 0.05, b4.z);   // 描边压到下面一层，否则和本体共面互相吃掉
    _dm.rotation.set(tilt, rot, 0);
    _dm.scale.setScalar(1.0);
    _dm.updateMatrix();
    shuOutlinePool.setMatrixAt(cN, _dm.matrix);

    _dm.position.set(b4.x, b4.y, b4.z);
    _dm.scale.setScalar(1.0);               // 橙体
    _dm.updateMatrix();
    shuBodyPool.setMatrixAt(cN, _dm.matrix);

    _dm.position.set(b4.x, b4.y + 0.05, b4.z);
    _dm.scale.setScalar(1.0);               // 白心
    _dm.updateMatrix();
    shuCorePool.setMatrixAt(cN, _dm.matrix);
    cN++;
  }
  shuOutlinePool.count = cN; shuOutlinePool.instanceMatrix.needsUpdate = true;
  shuBodyPool.count = cN; shuBodyPool.instanceMatrix.needsUpdate = true;
  shuCorePool.count = cN; shuCorePool.instanceMatrix.needsUpdate = true;
  shuTrailPool.count = trN; shuTrailPool.instanceMatrix.needsUpdate = true;
  shuPathPool.count = pkN; shuPathPool.instanceMatrix.needsUpdate = true;

  /* 敌弹四层 + 两段拖尾。拖尾位置按速度反推，不需要额外状态。 */
  var q = 0, tr = 0;
  for(var k=0;k<eBullets.length;k++){
    var b3 = eBullets[k];
    var ux = b3.vx / b3.sp, uz = b3.vz / b3.sp;
    var pulse = 1 + Math.sin(b3.phase * 9) * 0.07;   // 轻微脉动，比静止更抓眼

    /* 拖尾：越往后越小越淡（用两段模拟） */
    for(var t2=1;t2<=2;t2++){
      if(tr >= 400) break;
      _dm.position.set(b3.x - ux*t2*0.42, b3.y, b3.z - uz*t2*0.42);
      _dm.rotation.set(b3.phase + t2, b3.phase*0.5, 0);
      _dm.scale.setScalar((1.05 - t2*0.22) * pulse);
      _dm.updateMatrix();
      eBulTrail.setMatrixAt(tr++, _dm.matrix);
    }

    _dm.position.set(b3.x, b3.y, b3.z);
    _dm.rotation.set(b3.phase, b3.phase*0.5, 0);

    _dm.scale.setScalar(1.55 * pulse);          // 黑壳
    _dm.updateMatrix();
    if(q < 200) eBulShell.setMatrixAt(q, _dm.matrix);

    _dm.scale.setScalar(1.32 * pulse);          // 洋红本体
    _dm.updateMatrix();
    if(q < 200) eBulBody.setMatrixAt(q, _dm.matrix);

    _dm.scale.setScalar(1.32 * pulse);          // 粉白内核（略前移，像弹头）
    _dm.position.set(b3.x + ux*0.10, b3.y + 0.02, b3.z + uz*0.10);
    _dm.updateMatrix();
    if(q < 200) eBulCore.setMatrixAt(q++, _dm.matrix);
  }
  eBulShell.count = q; eBulShell.instanceMatrix.needsUpdate = true;
  eBulBody.count = q; eBulBody.instanceMatrix.needsUpdate = true;
  eBulCore.count = q; eBulCore.instanceMatrix.needsUpdate = true;
  eBulTrail.count = tr; eBulTrail.instanceMatrix.needsUpdate = true;
}

function renderGems(){
  var n = 0;
  for(var i=0;i<gems.length;i++){
    var g = gems[i];
    /* 呼吸脉动：静止的小物件容易被当成场景装饰，
       有节奏地放大缩小才会被识别成「可以拿的东西」。 */
    var pulse = 1 + Math.sin(S.t * 5.2 + g.x * 1.7 + g.z) * 0.13;
    var base = (g.val >= 4 ? 1.75 : 1) * pulse;

    _dm.position.set(g.x, g.y, g.z);
    _dm.rotation.set(0, S.t*3.4 + g.x, 0.4);

    /* 黑壳：放大 1.34 倍 + 只渲染背面，形成一圈墨线 */
    _dm.scale.setScalar(base * 1.34);
    _dm.updateMatrix();
    gemOutPool.setMatrixAt(n, _dm.matrix);

    /* 金体 */
    _dm.scale.setScalar(base);
    _dm.updateMatrix();
    gemPool.setMatrixAt(n, _dm.matrix);

    /* 内核实心白点，反向旋转，像是在球体内部跳动 */
    _dm.rotation.set(S.t*2.1, -S.t*2.8, 0);
    _dm.scale.setScalar(base * 1.02);
    _dm.updateMatrix();
    gemCorePool.setMatrixAt(n, _dm.matrix);

    n++;
    if(n >= 260) break;
  }
  gemOutPool.count = n; gemOutPool.instanceMatrix.needsUpdate = true;
  gemPool.count = n; gemPool.instanceMatrix.needsUpdate = true;
  gemCorePool.count = n; gemCorePool.instanceMatrix.needsUpdate = true;
}

function renderSpikes(){
  var n = 0;
  for(var i=0;i<spikes.length;i++){
    var s = spikes[i];
    var k = s.life/s.max;
    var sc = k > 0.82 ? lerp(0.2, 1, (1-k)/0.18) : (k < 0.25 ? k/0.25 : 1);
    _dm.position.set(s.x, 0.52*(sc||0.2), s.z);
    _dm.rotation.set(0, s.x*2.1, 0);
    _dm.scale.set(1, sc||0.2, 1);
    _dm.updateMatrix();
    spikePool.setMatrixAt(n++, _dm.matrix);
    if(n >= 90) break;
  }
  spikePool.count = n; spikePool.instanceMatrix.needsUpdate = true;
}

/* ═══════════ 主更新 ═══════════ */
var hudAcc = 0;

function update(dt){
  /* ── 顿帧的正确做法：只冻结世界，不冻结玩家 ──
     原来是 if(hitstop>0) dt *= 0.22，把整个 update 的时间都压扁了，
     包括 updateHero。炸弹一爆玩家移动就顿一下，Lv5 连锁连爆时叠成明显卡顿
     —— 就是玩家报的「震屏时脚被卡住」。
     现在拆成两份时间：
       dt      = 真实时间，玩家移动 / 开火 / 拾取都按它走，手感永远顺
       worldDt = 被压缩的时间，只给敌人、敌人子弹、粒子用
     顿帧的打击感来自「敌人凝固」，跟玩家的手没关系，这样两头都保住。 */
  var worldDt = dt;
  if(S.hitstop > 0){ S.hitstop -= dt; worldDt = dt * 0.18; }

  shadowIdx = 0;
  updateHero(dt);
  updateUlt(dt);
  updateWeapons(dt);
  updateEnemies(worldDt);
  updateBossWithSlow(worldDt);
  updateBulletArr(bullets, worldDt);
  updateBulletArr(bulletsB, worldDt);
  updateBulletArr(bulletsC, worldDt);
  updateBulletArr(bulletsD, worldDt);
  updateEBullets(worldDt);
  updateSpikes(worldDt);
  updateSkyArrows(worldDt);
  updateGems(dt);
  updateChests(worldDt);
  updateSpawn(worldDt);

  /* BOSS 在场时波次计时暂停，否则第 5 波 34 秒一到就直接跳第 6 波，
     BOSS 还在场上，两波叠在一起打。 */
  if(!(boss && !boss.dead)){
    S.waveT += dt;
    if(S.waveT >= S.waveLen && S.wave < 10) nextWave();
  }

  // 渲染同步
  renderEnemies();
  renderUltBeam();
  renderBullets();
  renderGems();
  renderSpikes();
  renderSkyArrows();
  pushShadow(hero.x, hero.z, 0.7, 0.4);
  if(boss && !boss.dead) pushShadow(boss.x, boss.z, 2.3, 0.5);
  shadowPool.count = shadowIdx;
  shadowPool.instanceMatrix.needsUpdate = true;

  hudAcc += dt;
  if(hudAcc > 0.08){ hudAcc = 0; updateHUD(); }
}

/* ═══════════ 流程 ═══════════ */
var chosenHero = 'swift';
var chosenRate = 1.0;

/* 起手配置只在这里定义一次。
   原来 resetGame 和 backToTitle 各写了一份，改流派时必然漏掉一处 ——
   这个项目已经因为同样的问题踩过三次（宝箱塞武器、刷新权重、描边参数）。 */
function initHeroLoadout(){
  hero.speed = 9.2;
  hero.evoId = null;
  /* 超武保底计数是「这一局连续几级没见到超武卡」，属于局内状态。
     原来没有重置，上一局攒到 4 会带进下一局，开局第一次升级就保底。 */
  hero.evoDry = 0;
  hero.ult = {charge: 0, active: 0, pullT: 0, ang: 0, beamTick: undefined,
              rainT: undefined, rainDmg: 0};
  ultQueue.length = 0;
  skyArrows.length = 0;
  ultBeam.visible = false; ultBeamCore.visible = false; ultRingFx.visible = false;
  /* 起手武器与被动全部由职业决定，这里不再写死「弓开局」。 */
  var cls = heroClass(chosenHero);
  hero.speed = cls.speed;
  hero.weapons = [{id:cls.weapon, lv:1, cd:0, tick:0}];
  hero.passives = {};
  for(var k in cls.passives) hero.passives[k] = cls.passives[k];
}

/* 清空世界里的全部实体。
   「再来一局」和「回到主菜单」都要用它，所以单独抽出来。
   这个项目已经因为「同一段逻辑两处各写一份」踩过三次坑
   （宝箱塞武器、刷新权重、描边参数），不再重复第四次。 */
function clearWorld(){
  EKEYS.forEach(function(k){ E[k].length = 0; });
  bullets.length = 0; bulletsB.length = 0; bulletsC.length = 0; bulletsD.length = 0; eBullets.length = 0;
  gems.length = 0; spikes.length = 0;
  skyArrows.length = 0; ultQueue.length = 0;
  ultPunch = 0;
  chests.slice().forEach(function(c){ scene.remove(c.obj); });
  chests.length = 0;
  for(var i=0;i<MAXP;i++) parts[i].on = false;
  if(boss){ scene.remove(boss.obj); boss = null; }
  if(bossBar) bossBar.style.display = 'none';
  bossSpawned = false;
  spawnAcc = 0;
  pendingLevels = 0;
  camShake = 0;
  S.hitstop = 0;
}

function resetGame(){
  clearWorld();

  hero.x = 0; hero.z = 0; hero.ang = 0;
  hero.hp = 100; hero.maxhp = 100;
  hero.lv = 1; hero.xp = 0; hero.xpNext = 9;
  hero.alive = true; hero.invuln = 0;
  initHeroLoadout();

  S.t = 0; S.wave = 1; S.waveT = 0; S.kills = 0;
  S.mode = 'play'; S.over = false; S.victory = false; S.hitstop = 0;
  S.spawnMul = chosenRate;
  /* 每局 3 次重掷。原来只在 S 初始化里写了一次，重开一局不会回到 3 ——
     第一局用完之后，之后每局开局就是「没有重掷次数了」。 */
  S.rerolls = 3;

  refreshStats();
  hero.hp = hero.maxhp;
  hero.obj.position.set(0,0,0);
  hero.obj.rotation.set(0,0,0);
  hero.obj.visible = true;
  updateHUD();

  $('scr-title').classList.add('hide');
  $('scr-over').classList.add('hide');
  $('scr-level').classList.add('hide');
  $('scr-bag').classList.add('hide');
  $('scr-pause').classList.add('hide');
  $('hud').classList.remove('hide');
  $('slots').innerHTML = '';

  camShake = 0;
  toast('WAVE 1', '#00e5ff');
  flash(0.25);
  updateCamera(0.016, 0, 0);
}
/* 回到主菜单：清场 + 把对局进度退回初始 + 切回标题界面。
   注意这里不复用 resetGame()，因为那个函数的最后一行会进入 play 状态。
   复用的是它前半段的 clearWorld()。 */
function backToTitle(){
  clearWorld();

  /* 进度归零。不归零的话，下次开始会带着上一局的等级和武器。 */
  S.t = 0; S.wave = 1; S.waveT = 0; S.kills = 0;
  S.mode = 'title'; S.over = false; S.victory = false;

  hero.hp = 100; hero.maxhp = 100;
  hero.lv = 1; hero.xp = 0; hero.xpNext = 9;
  hero.invuln = 0; hero.alive = true;
  initHeroLoadout();
  refreshStats();
  hero.hp = hero.maxhp;

  hero.obj.position.set(0, 0, 0);
  hero.obj.rotation.set(0, 0, 0);
  hero.obj.visible = true;

  $('hud').classList.add('hide');
  $('scr-over').classList.add('hide');
  $('scr-pause').classList.add('hide');
  $('scr-bag').classList.add('hide');
  $('scr-level').classList.add('hide');
  $('slots').innerHTML = '';
  $('scr-title').classList.remove('hide');
  document.body.classList.add('is-title');   /* 背景虚化，和首次进标题一致 */

  BGM.setMode('menu');
  SFX.whooshUp();
  titleT = 0;
  updateCamera(0.016, 0, 0);
}

function startGame(){
  unlockAudio();
  document.body.classList.remove('is-title');
  tryLockLandscape();   /* 用户点击这一下里去请求全屏横屏 */
  SFX.whoosh();
  BGM.setMode('battle');
  resetGame();
}

function gameOver(win){
  if(S.mode === 'over') return;
  S.mode = 'over'; S.over = true; S.victory = win;
  hero.alive = false;
  hero.obj.visible = true;
  if(!win){ hero.obj.rotation.z = -1.25; hero.obj.position.y = 0.35; }
  if(!win){ SFX.die(); shake(0.9); flash(0.3); }
  else { SFX.chest(); flash(0.6); shake(0.8); }

  var score = S.kills + hero.lv*10 + (S.wave-1)*40 + (win?180:0);
  var grade = win ? 'S' : (score >= 260 ? 'A' : (score >= 160 ? 'B' : 'C'));

  $('grade').textContent = grade;
  $('overtitle').textContent = win ? '全 场 清 理 完 毕' : '你 被 墨 潮 吞 没 了';

  var wnames = hero.weapons.map(function(w){ return WDEF[w.id].name + ' Lv.' + w.lv; }).join(' · ');
  $('reslist').innerHTML =
    '<div class="resrow"><span>存活时间</span><b>' + fmtTime(S.t) + '</b></div>' +
    '<div class="resrow"><span>抵达波次</span><b>第 ' + S.wave + ' 波</b></div>' +
    '<div class="resrow"><span>击杀总数</span><b>' + S.kills + '</b></div>' +
    '<div class="resrow"><span>最终等级</span><b>' + hero.lv + ' 级</b></div>' +
    '<div class="resrow"><span>综合评分</span><b>' + score + '</b></div>' +
    '<div class="resrow" style="border:none;flex-direction:column;align-items:flex-start;gap:4px"><span>武器流派</span><b style="font-size:13px;text-align:left;line-height:1.7">' + wnames + '</b></div>';

  $('scr-over').classList.remove('hide');
  $('hud').classList.add('hide');
  BGM.setMode('menu');
}

function victory(){ gameOver(true); }

function toggleBag(){
  if(S.mode === 'play'){
    S.mode = 'bag';
    BGM.pause();
    renderBag();
    $('scr-bag').classList.remove('hide');
  } else if(S.mode === 'bag'){

/* 底色深浅决定字色：石蓝这类中低明度的底配黑字会糊，
   用相对亮度算一下，两种墨水挑一种。 */
function inkOn(hex){
  var h = String(hex).replace('#','');
  if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var r = parseInt(h.substr(0,2),16)/255, g2 = parseInt(h.substr(2,2),16)/255, b = parseInt(h.substr(4,2),16)/255;
  var L = 0.2126*r + 0.7152*g2 + 0.0722*b;
  return L > 0.5 ? '#0a0a12' : '#fff6e9';
}

         光靠文字选是感受不到的。 */

/* ═══════════ 主循环 ═══════════ */
var lastT = performance.now();
var titleT = 0;

function loop(now){
  requestAnimationFrame(loop);
  var dt = (now - lastT) / 1000;
  lastT = now;
  if(dt > 0.05) dt = 0.05;
  if(dt < 0) dt = 0;

  if(S.mode === 'title'){
    titleT += dt;
    S.t += dt;
    camera.position.set(Math.cos(titleT*0.16)*30, 21, Math.sin(titleT*0.16)*30 + 6);
    camera.lookAt(0, 1.6, 0);
    hero.obj.rotation.y = titleT*0.5;
    hero.obj.position.y = Math.sin(titleT*2)*0.05;
    bladeParts.forEach(function(m){ m.visible = false; });
    bladeRings.forEach(function(m){ m.visible = false; });
  } else {
    if(S.mode === 'play'){
      S.t += dt;
      update(dt);
    }
    updateCamera(dt, hero.x, hero.z);
  }

  decayOverlays(dt);
  updateParticles(dt);
  updateShocks(dt);
  renderer.render(scene, camera);
}

/* ═══════════ 屏幕方向 ═══════════
   判断「现在是不是竖着」有三层依据，从权威到保守：

   1. screen.orientation.type —— 系统直给的屏幕方向。
      这就是正解，不需要陀螺仪：陀螺仪给的是设备物理姿态，
      躺着玩、斜着靠都会干扰；screen.orientation 给的就是
      「屏幕当前朝哪」，正是我们需要的那个值。
   2. 没有这个 API 才退回宽高比，且要求 高 > 宽 × 1.34。
      只高一点点不算竖屏，避开手机地址栏和桌面窄窗口的误判。
   3. 必须是真正的触屏设备（pointer: coarse）。
      桌面触屏笔记本的指针是 fine，不会误触发，
      所以电脑上永远不会弹这个遮罩。

   转屏事件的坑：orientationchange 在部分安卓浏览器上要 300-800ms
   才把新的 width/height 写进去。之前只等 220ms，读到的是旧值，
   所以已经转过去了遮罩还挂着。现在改成 4 段重试。 */

var ORIENT = { userSkip: false, pausedByRotate: false };

function isTouchDevice(){
  if(navigator.maxTouchPoints <= 0) return false;
  if(window.matchMedia){
    if(window.matchMedia('(hover: none)').matches) return true;   /* 手机平板：没有悬停 */
    if(window.matchMedia('(pointer: coarse)').matches) return true;
    return false;                                                 /* 桌面，含触屏笔记本 */
  }
  return 'ontouchstart' in window;
}

function isPortraitNow(){
  var so = window.screen && window.screen.orientation;
  if(so && so.type) return so.type.indexOf('portrait') === 0;
  return window.innerHeight > window.innerWidth * 1.34;
}

var orientTimers = [];
var orientAutoTimer = null;
function scheduleOrientCheck(){
  for(var i = 0; i < orientTimers.length; i++) clearTimeout(orientTimers[i]);
  orientTimers = [60, 180, 420, 850].map(function(ms){
    return setTimeout(checkOrient, ms);
  });
}

function checkOrient(){
  var el = document.getElementById('rotate');
  if(!el) return;
  var want = isTouchDevice() && !ORIENT.userSkip && isPortraitNow();
  if(want){
    if(!el.classList.contains('on')){
      el.classList.add('on');
      /* 竖屏时不只停音乐，游戏也要真停，
         否则玩家转个屏回来发现血掉了一半 */
      if(S.mode === 'play'){ ORIENT.pausedByRotate = true; S.mode = 'pause'; }
      if(BGM && BGM.isPlaying && BGM.isPlaying()) BGM.pause();
      /* 最后一道保险：5 秒后自动放行。
         即使按钮绑定、内联 onclick、遮罩点击全部失效，
         玩家也不会被困在这个层里。 */
      if(orientAutoTimer) clearTimeout(orientAutoTimer);
      orientAutoTimer = setTimeout(function(){
        var box = document.getElementById('rotate');
        if(box && box.classList.contains('on')) skipOrient();
      }, 5000);
    }
  } else {
    if(orientAutoTimer){ clearTimeout(orientAutoTimer); orientAutoTimer = null; }
    if(el.classList.contains('on')){
      el.classList.remove('on');
      if(ORIENT.pausedByRotate){
        ORIENT.pausedByRotate = false;
        if(S.mode === 'pause') S.mode = 'play';
        if(BGM && BGM.resume) BGM.resume();
      }
    }
  }
}

/* 主动请求全屏 + 锁定横屏。
   这个 API 有两个硬约束：必须由用户手势触发、
   必须在全屏状态下才生效。所以放在点「开始对战」时请求。
   安卓 Chrome 会真正锁死，之后物理上转成竖屏也不会变。
   iOS Safari 不支持 lock，只能靠遮罩兜底。 */
function tryLockLandscape(){
  if(!isTouchDevice()) return;
  var de = document.documentElement;
  var req = de.requestFullscreen || de.webkitRequestFullscreen || de.mozRequestFullScreen;
  var p;
  try{
    p = req ? Promise.resolve(req.call(de)) : Promise.resolve();
  }catch(e){
    p = Promise.resolve();
  }
  p.then(function(){
    if(window.screen && screen.orientation && screen.orientation.lock){
      return screen.orientation.lock('landscape');
    }
  }).catch(function(){
    /* 锁不住（iOS 或浏览器拒绝），让遮罩去兜底 */
  }).then(function(){
    scheduleOrientCheck();
  });
}

function skipOrient(){
  ORIENT.userSkip = true;
  checkOrient();
}

function bindOrientUI(){
  var rb = document.getElementById('rotbtn');
  var rs = document.getElementById('rotskip');
  var el = document.getElementById('rotate');

  if(rb) rb.onclick = function(ev){ if(ev) ev.stopPropagation(); tryLockLandscape(); };
  if(rs) rs.onclick = function(ev){ if(ev) ev.stopPropagation(); skipOrient(); };

  /* 兜底一：遮罩任意位置都能点掉。
     按钮万一失效，玩家点一下屏幕也能进去，不会卡死。 */
  if(el) el.onclick = function(ev){
    if(ev && ev.target && ev.target.tagName === 'BUTTON') return;
    skipOrient();
  };

  /* 兜底二：挂到 window，HTML 内联 onclick 直接可用，
     不依赖这段 JS 有没有执行到。 */
  window.__POW_LOCK = tryLockLandscape;
  window.__POW_SKIP = skipOrient;
}

addEventListener('resize', scheduleOrientCheck);

if(window.screen && screen.orientation && screen.orientation.addEventListener){

}

/* ═══════════ BGM 离线导出（试听用，不影响游戏） ═══════════ */
function bufferToWavBlob(buf){
  var ch = buf.numberOfChannels, len = buf.length, sr = buf.sampleRate;
  var bytes = 44 + len * ch * 2;
  var ab = new ArrayBuffer(bytes), dv = new DataView(ab);
  function ws(o, str){ for(var i=0;i<str.length;i++) dv.setUint8(o+i, str.charCodeAt(i)); }
  ws(0,'RIFF'); dv.setUint32(4, bytes-8, true); ws(8,'WAVE');
  ws(12,'fmt '); dv.setUint32(16,16,true); dv.setUint16(20,1,true);
  dv.setUint16(22,ch,true); dv.setUint32(24,sr,true);
  dv.setUint32(28,sr*ch*2,true); dv.setUint16(32,ch*2,true); dv.setUint16(34,16,true);
  ws(36,'data'); dv.setUint32(40,len*ch*2,true);
  var chans = [];
  for(var c=0;c<ch;c++) chans.push(buf.getChannelData(c));
  var off = 44;
  for(var i=0;i<len;i++){
    for(var c2=0;c2<ch;c2++){
      var v = chans[c2][i];
      if(v > 1) v = 1; else if(v < -1) v = -1;
      dv.setInt16(off, v < 0 ? v*0x8000 : v*0x7FFF, true);
      off += 2;
    }
  }
  return new Blob([ab], {type:'audio/wav'});
}

/* 渲染整首，把 WAV 以 base64 挂在 window.__wavB64 上，交给外部脚本取走。
   不直接用 <a download>：无头浏览器会静默拦掉 blob 下载。 */
window.renderBGMToBase64 = function(mode, loops){
  loops = loops || 1;
  var dur = BGM.durationOf(mode, loops);
  var sr = 44100;
  var ctx = new OfflineAudioContext(2, Math.ceil(dur * sr), sr);
  return BGM.renderOffline(ctx, mode, loops).then(function(buf){
    var ab = bufferToWavBlob(buf).arrayBuffer();
    return ab.then(function(arr){
      var u8 = new Uint8Array(arr), str = '', CH = 0x8000;
      for(var p=0;p<u8.length;p+=CH){
        str += String.fromCharCode.apply(null, u8.subarray(p, p+CH));
      }
      window.__wavB64 = btoa(str);
      return {dur: +dur.toFixed(1), bytes: u8.length, b64len: window.__wavB64.length};
    });
  });
};

/* ─────────── 进入加载页 ───────────
   之前是「等 260 毫秒自动消失」，代价全推到玩家身上：点「开始对战」那一刻要
   现建 AudioContext、现编着色器、现铺首批敌人，主线程卡住，音乐就晚几秒才响。
   现在把这三件事搬到加载页里做，而且必须在**用户手势**里做 ——
   浏览器的自动播放策略要求点击之后才能出声。 */
var bootEl = $('boot'), bootBar = $('bootbar'), bootGo = $('bootgo');
var bootDone = false;

/* 只推进度条，不写文字。原来每一步都写一行「起播音乐 / 编译着色器 / 铺开战场」——
   那是给开发者看的，玩家只需要知道「在动」。 */
function bootStep(pct){
  if(bootBar) bootBar.style.width = pct + '%';
}

function bootRun(){
  if(bootDone) return;
  bootDone = true;
  bootEl.classList.add('go');

  var steps = [
    [24, function(){
      unlockAudio();                 /* 在手势里建 AC */
      BGM.setMode('menu');
      BGM.resume();
    }],
    [58, function(){
      /* 真编译一遍：这一步做完，进对局时不会再因为新建材质而卡帧 */
      try{ renderer.compile(scene, camera); }catch(e){}
    }],
    [86, function(){
      updateCamera(0.016, 0, 0);
      renderEnemies(); renderBullets(); renderGems();
    }]
  ];

  var i = 0;
  (function next(){
    if(i >= steps.length){
      bootStep(100);
      setTimeout(function(){
        bootEl.classList.add('out');
        setTimeout(function(){ bootEl.style.display = 'none'; }, 460);
        SFX.whooshUp();
      }, 200);
      return;
    }
    var st = steps[i++];
    bootStep(st[0]);
    /* 40ms 让浏览器把进度条画出来，再干活 —— 否则三步在同一帧里跑完，
       进度条一次都刷不到，看起来像没加载。 */
    setTimeout(function(){ st[1](); next(); }, 40);
  })();
}
if(bootGo) bootGo.onclick = bootRun;
if(bootEl) bootEl.onclick = function(){ bootRun(); };
window.__POW_BOOT = bootRun;
/* 8 秒没人点就自己进（自动化截图 / 键盘党兜底）。此时可能没有声音，
   第一次点击游戏内任意位置会补上。 */
setTimeout(function(){ if(!bootDone) bootRun(); }, 8000);

function onResize(){
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', onResize);

if(typeof window.__POW_READY__ === 'function') window.__POW_READY__();
})();
