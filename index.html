<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#9ed4f5">
<meta name="app-version" content="v0.19">
<meta name="app-built" content="2026-10-29">
<title>爆裂弓箭手</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a12'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23ff2e88'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23ffe600'/%3E%3C/svg%3E">
<script src="https://unpkg.com/three@0.150.1/build/three.min.js"></script>
<script>window.THREE||document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"><\/script>');</script>
<style>
:root{
  --ink:#0a0a12; --paper:#fff6e9; --mag:#ff2e88; --cyn:#00e5ff;
  --yel:#ffe600; --pur:#7b2ff7; --lime:#b6ff3c; --red:#ff3b30;
  --disp:"Impact","Arial Black","Haettenschweiler","Noto Sans SC","Microsoft YaHei",sans-serif;
  --ui:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--ink);font-family:var(--ui);color:var(--paper);
  user-select:none;-webkit-user-select:none;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}

/* ── 全屏后处理：印刷网点 + 暗角 + 速度线 ── */
#poster{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:.42;
  background-image:radial-gradient(circle at 50% 50%,rgba(20,70,120,0) 46%,rgba(20,70,120,.42) 100%),
                   radial-gradient(circle,rgba(40,90,140,.30) 1px,rgba(40,90,140,0) 1.4px);
  background-size:100% 100%,5px 5px;mix-blend-mode:multiply}
#flash{position:fixed;inset:0;pointer-events:none;z-index:9;background:#fff;opacity:0;
  transition:opacity .09s linear}
#speedlines{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;
  background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,246,233,.65) 0deg .6deg,rgba(255,246,233,0) .6deg 9deg);
  transition:opacity .12s}
#damagetint{position:fixed;inset:0;pointer-events:none;z-index:7;opacity:0;
  background:radial-gradient(circle at 50% 50%,rgba(255,46,136,0) 42%,rgba(255,46,136,.85) 100%);
  transition:opacity .16s}
/* 超武染色层：按流派色把整个屏幕浸一遍。
   之前超武只有「局部爆炸 + 一闪」，屏幕上 90% 的面积没有任何变化，
   所以玩家按完空格觉得「好像什么都没发生」。这一层解决的就是这件事：
   释放瞬间整块画面换色（screen 混合只会提亮，不会压暗画面）。 */
#ultwash{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;
  background:radial-gradient(circle at 50% 56%,rgba(255,255,255,0) 18%,var(--uc,#00e5ff) 128%);
  mix-blend-mode:screen;transition:opacity .16s ease-out}
/* 超武名大字：比普通拟声词大一倍，从屏幕上方砸下来 */
.ultname{position:absolute;font-family:var(--disp);font-weight:900;line-height:1;white-space:nowrap;
  letter-spacing:.04em;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;
  text-shadow:0 0 28px currentColor,7px 7px 0 var(--ink);transform-origin:50% 50%;
  animation:ultNameIn .95s cubic-bezier(.16,1.5,.36,1) forwards}
@keyframes ultNameIn{
  0%{opacity:0;transform:translate(-50%,-50%) scale(2.2) rotate(-8deg)}
  14%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-2deg)}
  74%{opacity:1;transform:translate(-50%,-52%) scale(1.04) rotate(-2deg)}
  100%{opacity:0;transform:translate(-50%,-64%) scale(1.06) rotate(-2deg)}
}
#fx{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.word{position:absolute;font-family:var(--disp);font-weight:900;line-height:1;white-space:nowrap;
  color:var(--yel);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;
  text-shadow:6px 6px 0 var(--ink);transform-origin:50% 50%;will-change:transform,opacity;
  animation:wordPop .72s cubic-bezier(.16,1.4,.4,1) forwards}
@keyframes wordPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(var(--rot))}
  22%{opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(var(--rot))}
  46%{transform:translate(-50%,-52%) scale(1) rotate(var(--rot))}
  100%{opacity:0;transform:translate(-50%,-135%) scale(.82) rotate(var(--rot))}
}
.dmg{position:absolute;font-family:var(--disp);font-weight:900;font-size:20px;color:#fff;
  -webkit-text-stroke:4px var(--ink);paint-order:stroke fill;animation:dmgUp .55s ease-out forwards;
  transform:translate(-50%,-50%)}
@keyframes dmgUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}
  25%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-190%) scale(.9)}}

/* ── 通用面板 ── */
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;padding:18px 18px 26px;gap:14px;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch}
.screen:before,.screen:after{content:"";flex:0 0 auto;margin:auto}
.screen.hide{display:none}
.panel{position:relative;background:var(--paper);color:var(--ink);border:5px solid var(--ink);
  border-radius:6px;box-shadow:10px 10px 0 var(--ink);padding:22px 26px;max-width:min(880px,94vw);
  width:100%;transform:skewX(-1deg)}
.panel:before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(circle,rgba(10,10,18,.14) 1px,transparent 1.3px);
  background-size:6px 6px;opacity:.7}
.panel>*{position:relative}
.tiny{font-size:12px;line-height:1.7;color:#5b5b6b}

/* ══════════════════════════════════════════════════════════════════
   开始界面 v2 · 一刀破开
   ──────────────────────────────────────────────────────────────────
   构图：整屏被一条斜切光带分成两块 ——
     左上「纸面」放标题与射手，右下「墨面」放密度与开始。
   为什么不做卡片了：卡片是「把东西装进盒子」，两个盒子并排，
   屏幕一矮就只能一起缩，缩到最后每个字都在挤。
   整屏切开是另一种思路 —— 把画面分成两个世界，各自有一整块地可用。

   斜切角度 13°（相对竖直方向）。角度只负责视觉，不参与布局：
   内容走正交网格，靠内边距让开切线，所以 1440×900 和 844×390
   共用同一套栅格，不会再出现「按桌面排完、手机上全错位」。
   ══════════════════════════════════════════════════════════════════ */

#scr-title{
  display:block; padding:0; gap:0; overflow:hidden;
  background:var(--ink);
  /* 标题页不需要滚动：所有内容都按视口高度收敛 */
}
/* 这里的 display:block 是 ID 选择器，优先级高于 .screen.hide 的 display:none。
   不补这一条，进游戏之后标题页还盖在 HUD 上面 —— 看上去像卡死。 */
#scr-title.hide{display:none}
#scr-title:before,#scr-title:after{display:none}

/* ── 切分：两块底色 + 一条黄色光带 ──
   切线过 (52%, 50%)，上下两端各横移 11.5vh（tan13° × 半屏高）。
   两块底色各退让 30px，正好让出光带的宽度，接缝被光带压死。 */
.tt-split{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tt-split i{position:absolute;display:block}

.sp-paper{
  inset:0;
  background-color:var(--paper);
  background-image:
    radial-gradient(ellipse 66% 58% at 20% 14%,rgba(255,255,255,.96),rgba(255,255,255,0) 72%),
    radial-gradient(circle,rgba(10,10,18,.10) 1px,rgba(10,10,18,0) 1.4px);
  background-size:100% 100%,6px 6px;
  clip-path:polygon(0 0,
    calc(52% - 11.5vh - 30px) 0,
    calc(52% + 11.5vh - 30px) 100%,
    0 100%);
}
.sp-ink{
  inset:0;
  background-color:var(--ink);
  background-image:
    radial-gradient(ellipse 82% 72% at 78% 20%,rgba(48,34,92,.92),rgba(8,9,18,0) 70%),
    radial-gradient(circle,rgba(255,246,233,.07) 1px,rgba(255,246,233,0) 1.4px);
  background-size:100% 100%,7px 7px;
  clip-path:polygon(calc(52% - 11.5vh + 30px) 0,
    100% 0,100% 100%,
    calc(52% + 11.5vh + 30px) 100%);
}
/* 光带本体：7px 墨边 + 46px 黄芯 */
.sp-slash{
  left:calc(52% - 30px); top:-40%; bottom:-40%; width:60px;
  background:linear-gradient(180deg,#fffbe0,var(--yel) 18%,var(--yel) 82%,#fffbe0);
  border:7px solid var(--ink);
  transform:rotate(-13deg);
  box-shadow:0 0 30px rgba(255,230,0,.45);
}
/* 第二道细光：刀锋残影。让「切开」像一个动作，而不是一条分割线 */
.sp-echo{
  left:calc(52% + 16px); top:-40%; bottom:-40%; width:4px;
  background:rgba(255,230,0,.5);
  transform:rotate(-13deg);
}

/* ── 栅格 ── */
.tt-grid{
  position:relative; z-index:1; height:100%;
  display:grid;
  grid-template-columns:minmax(0,48fr) minmax(0,52fr);
  grid-template-rows:auto 1fr auto;
  gap:clamp(6px,1.4vh,16px) 0;
  padding:clamp(12px,2.4vh,26px) clamp(16px,2.6vw,44px) clamp(10px,2vh,22px);
}
.tt-head{grid-column:1; grid-row:1; padding-right:clamp(40px,7vh,90px)}
.tt-hero{
  grid-column:1; grid-row:2; min-height:0;
  padding-right:clamp(24px,5vh,70px);
  display:flex; flex-direction:column; justify-content:center;
}
.tt-rate{
  grid-column:2; grid-row:2; min-height:0;
  /* 右列必须避开斜切线。切线越往下越往右，
     所以内容贴顶排（那一段墨面最宽），内边距按最下面那个控件的安全距离取。
     90px 是 844×390 实测的下限，10vw 是 1440×900 的下限，取两者覆盖的包络。 */
  padding-left:clamp(104px,10vw,170px);
  /* 去掉「玩法速览」那段说明之后，右列只剩密度一组控件，贴顶会留下半屏空白。
     垂直居中让它落在墨面中段；能不能居中要看切线 —— 越往下切线越往右，
     title.test 会按底边算安全距离，压线就报错。 */
  display:flex; flex-direction:column; justify-content:center;
}
.tt-foot{
  grid-column:2; grid-row:3;
  padding-left:calc(4% + 34px);
  display:flex; gap:clamp(8px,1vh,14px);
  justify-content:flex-end; align-items:stretch;
}
.tt-ticker{
  grid-column:1; grid-row:3; align-self:end;
  padding-right:clamp(24px,5vh,70px);
  display:flex; flex-wrap:wrap; align-items:center;
  font-family:var(--disp); font-size:clamp(8.5px,.82vw,11px);
  letter-spacing:.16em; color:#55555f;
}
.tt-ticker span+span:before{content:"／"; margin:0 8px; color:#b9bcc6}

/* ── 标题 ── */
.tt-logo{margin:0; font-family:var(--disp); line-height:.8; color:var(--ink); letter-spacing:.01em}
.tt-logo s{
  display:block; text-decoration:none;
  font-size:clamp(10px,1.25vw,17px); letter-spacing:.46em; color:var(--mag);
  margin-bottom:.5em;
}
.tt-logo b{
  display:block; font-size:clamp(34px,6.6vw,96px);
  text-shadow:5px 5px 0 var(--yel), 9px 9px 0 var(--ink);
}

/* ── 步骤标签 ── */
.tt-lab{
  display:flex; align-items:center; gap:9px;
  margin:0 0 clamp(6px,1.2vh,12px);
  font-family:var(--disp); font-size:clamp(13px,1.35vw,18px);
  letter-spacing:.22em; color:var(--ink);
}
.tt-lab i{
  font-style:normal; padding:1px 7px;
  background:var(--mag); color:#fff; border:3px solid var(--ink);
  font-size:.82em; letter-spacing:.06em; transform:skewX(-10deg);
}
.tt-rate .tt-lab{color:var(--paper)}
.tt-rate .tt-lab i{border-color:var(--paper)}
/* 标签尾部的小注：靠右，把「这一块是干什么的」一次说清 */
.tt-lab s{
  margin-left:auto; text-decoration:none;
  font-family:var(--ui); font-weight:700;
  font-size:clamp(9px,.78vw,10.5px); letter-spacing:.1em;
  color:#8c88a4; white-space:nowrap;
}

/* ── 职业磁贴：6 个职业排 3×2。
   原来是两张竖排大卡（名字 + 一句长描述 + 标签），塞 6 个会顶出纸面；
   改成磁贴只留「字 + 定位」，长描述挪到网格下面一行固定说明。 ── */
/* 四个职业排 2×2。三列会把第四张挤到单独一行，左边留一块空白 —— 
   六职业时代是三列，改成四职业后必须一起改。 */
#scr-title .pickrow{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(6px,1vh,10px)}
#scr-title .pick{
  position:relative; display:grid;
  grid-template-columns:auto minmax(0,1fr);
  grid-template-areas:"ico nm" "ico tg";
  align-items:center; column-gap:clamp(5px,.6vw,8px); row-gap:1px;
  min-height:clamp(52px,8.4vh,84px);
  background:#fff; color:var(--ink); border:3px solid var(--ink); border-radius:0;
  padding:clamp(4px,.8vh,8px) clamp(5px,.7vw,10px) clamp(4px,.8vh,8px) clamp(7px,.8vw,11px);
  box-shadow:4px 4px 0 var(--ink); cursor:pointer; overflow:hidden;
  transition:transform .12s cubic-bezier(.2,1.4,.4,1), box-shadow .12s, background .12s;
}
#scr-title .pick:before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:5px;
  background:var(--pcol,#7b2ff7);
}
#scr-title .pick:hover{transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink)}
#scr-title .pick.on{background:var(--yel); box-shadow:5px 5px 0 var(--mag),0 0 0 3px var(--ink)}
#scr-title .pico{
  grid-area:ico; display:flex; align-items:center; justify-content:center;
  width:clamp(24px,3vw,36px); height:clamp(24px,3vw,36px);
  border:2px solid var(--ink); color:#0a0a12;
  font-family:var(--disp); font-size:clamp(13px,1.6vw,20px); line-height:1;
  transform:skewX(-8deg);
}
#scr-title .pick b{
  grid-area:nm; font-family:var(--disp);
  font-size:clamp(12px,1.3vw,17px); letter-spacing:.06em; line-height:1.1;
}
#scr-title .pick s{
  grid-area:tg; text-decoration:none; margin:0; color:#4a4a58;
  font-size:clamp(8px,.8vw,11px); line-height:1.2; letter-spacing:.02em;
}
#scr-title .herodesc{
  margin-top:clamp(5px,.9vh,9px); min-height:clamp(20px,3vh,28px);
  display:flex; align-items:center; flex-wrap:wrap; gap:5px 7px;
  font-size:clamp(9px,.92vw,12.5px); line-height:1.35; color:#3a3a46;
}
#scr-title .herodesc b{font-family:var(--disp); letter-spacing:.08em; font-size:1.06em; color:var(--ink)}
#scr-title .herodesc i{
  font-style:normal; padding:1px 6px; background:var(--ink); color:var(--yel);
  font-family:var(--disp); font-size:.86em; letter-spacing:.1em;
}

/* ── 密度：墨面上的 2×2 描边按钮 ── */
#scr-title .rate{
  display:grid; grid-template-columns:1fr 1fr; gap:clamp(6px,1vh,10px);
  background:none; border:0; border-radius:0; padding:0; overflow:visible;
}
#scr-title .rate button{
  flex:none; padding:clamp(8px,1.8vh,16px) 4px;
  background:transparent; color:var(--paper);
  border:3px solid rgba(255,246,233,.5); border-radius:0;
  font-family:var(--disp); font-size:clamp(12px,1.25vw,17px); letter-spacing:.18em;
  cursor:pointer; box-shadow:none; transition:all .12s;
}
#scr-title .rate button:hover{background:rgba(255,246,233,.12); border-color:var(--paper)}
#scr-title .rate button.on{
  background:var(--yel); color:var(--ink); border-color:var(--ink);
  box-shadow:4px 4px 0 var(--mag); transform:translate(-1px,-1px);
}

/* ── 底部动作 ── */
.tt-foot .startbig{
  flex:0 1 auto; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:2px; line-height:1.05;
  background:var(--yel); color:var(--ink);
  border:4px solid var(--ink); border-radius:0;
  padding:clamp(8px,1.5vh,14px) clamp(18px,2.6vw,40px);
  font-family:var(--disp); cursor:pointer;
  animation:pulseCut 2.6s ease-in-out infinite;
}
.tt-foot .sbt{font-size:clamp(17px,2vw,27px); letter-spacing:.2em}
@keyframes pulseCut{
  0%,100%{box-shadow:7px 7px 0 var(--mag)}
  50%{box-shadow:7px 7px 0 var(--mag),0 0 0 8px rgba(255,230,0,.16)}
}
.tt-foot .codexbtn{
  flex:0 0 auto; background:transparent; color:var(--paper);
  border:4px solid var(--paper); border-radius:0;
  font-family:var(--disp); font-size:clamp(12px,1.15vw,16px); letter-spacing:.18em;
  padding:0 clamp(12px,1.5vw,20px); cursor:pointer;
  box-shadow:5px 5px 0 rgba(255,246,233,.2); transition:all .1s;
}
.tt-foot .codexbtn:hover{background:var(--paper); color:var(--ink)}
.tt-foot .codexbtn:active{transform:translate(3px,3px); box-shadow:2px 2px 0 rgba(255,246,233,.2)}

/* 分段控件（暂停菜单的密度选择仍用这套朴素版，#scr-title 内部会覆盖） */
.rate{
  display:flex; gap:0; background:#e8e4dc; border:3px solid var(--ink);
  border-radius:9px; padding:3px; overflow:hidden;
}
.rate button{
  flex:1 1 0; border:none; background:transparent; border-radius:6px;
  padding:9px 4px; font-family:var(--ui); font-weight:800; font-size:13px;
  color:#5a5a68; cursor:pointer; letter-spacing:.04em;
  transition:background .12s,color .12s;
}
.rate button:hover{background:#d8d3c8; color:var(--ink)}
.rate button.on{background:var(--ink); color:var(--yel); box-shadow:2px 2px 0 rgba(10,10,18,.35)}

/* ── 手机横屏：整体降一档，斜切保留 ── */
@media (max-height: 520px){
  .tt-grid{padding:8px 14px 8px; gap:5px 0}
  .tt-logo b{font-size:clamp(24px,5.4vw,36px); text-shadow:3px 3px 0 var(--yel),5px 5px 0 var(--ink)}
  .tt-logo s{font-size:9px; letter-spacing:.3em; margin-bottom:.3em}
  .tt-lab{font-size:12px; margin-bottom:6px; gap:6px}
  .tt-lab i{border-width:2px; padding:0 5px}
  #scr-title .pick{padding:6px 10px 6px 14px; border-width:3px; box-shadow:4px 4px 0 var(--ink); min-height:0}
  #scr-title .pick.on{box-shadow:4px 4px 0 var(--mag),0 0 0 2px var(--ink)}
  #scr-title .pick:before{width:5px}
  #scr-title .pico{width:34px; height:34px; font-size:17px; border-width:2px}
  #scr-title .pick b{font-size:15px}
  /* 卡片只有 108px 宽，四个字的定位标签会被挤成两行（「远程散 / 射」）。
     小屏上直接不显示 —— 下面的详情行里已经有同一个词。 */
  #scr-title .pick s{display:none}
  #scr-title .pickrow{gap:7px}
  #scr-title .pick .tagline{font-size:8px; margin-top:3px; padding:0 4px}
  #scr-title .rate button{padding:6px 3px; font-size:11px; border-width:2px; letter-spacing:.1em}
  .tt-lab s{display:none}
  /* 手机上墨面只有 260px 高：贴顶会在中间留一大块黑，
     贴底又和「开始」挤成一坨。居中让空档分到上下两头，最均衡。 */
  .tt-rate{justify-content:center}
  .tt-foot .startbig{padding:6px 18px; border-width:3px}
  .tt-foot .sbt{font-size:16px; letter-spacing:.18em}
  .tt-foot .codexbtn{font-size:12px; border-width:3px; padding:0 12px}
  /* 键位提示在手机上一条都用不上，而且六条挤成两行压到「开始对战」旁边。
     小屏直接不显示，操作提示由转屏遮罩和第一局的自动射击本身交代。 */
  .tt-ticker{display:none}
}

/* ── 竖屏 / 极窄：斜切改成横向切，纸面在上、墨面在下 ── */
@media (max-width: 700px){
  .sp-paper{clip-path:polygon(0 0,100% 0,100% calc(44% - 30px),0 calc(44% - 30px))}
  .sp-ink{clip-path:polygon(0 calc(44% + 30px),100% calc(44% + 30px),100% 100%,0 100%)}
  /* 竖屏的切分是横着的，光带不能带角度 ——
     带 2° 之后两端和上下两块底色错开十几像素，接缝会漏出一条暗边。 */
  .sp-slash{
    left:0; right:0; top:calc(44% - 30px); bottom:auto; height:60px; width:auto;
    transform:none;
  }
  /* 必须写到 .tt-split .sp-echo：上面那条 .tt-split i{display:block}
     是「1 类 + 1 标签」，单写 .sp-echo 压不住它。 */
  .tt-split .sp-echo{display:none}
  .tt-grid{
    grid-template-columns:1fr;
    grid-template-rows:auto auto auto auto;
    gap:clamp(4px,1vh,10px) 0;
    overflow-y:auto;
  }
  .tt-head,.tt-hero,.tt-rate,.tt-foot,.tt-ticker{
    grid-column:1; padding-left:0; padding-right:0;
  }
  .tt-head{grid-row:1}
  .tt-hero{grid-row:2; padding-right:0}
  .tt-rate{grid-row:3; padding-left:0}
  .tt-foot{grid-row:4; justify-content:center; padding-left:0}
  .tt-ticker{display:none}
  .tt-logo b{font-size:clamp(26px,8vw,44px)}
  #scr-title .pickrow{gap:8px}
  .tt-body-fill{display:none}
}

.sechead{font-family:var(--disp);font-size:13px;letter-spacing:.22em;color:var(--ink);
  border-bottom:3px solid var(--ink);padding-bottom:4px;margin:14px 0 8px;display:flex;
  justify-content:space-between;align-items:baseline}
.sechead span{font-family:var(--ui);font-size:11px;letter-spacing:0;color:#6b6b7a}

.btn{font-family:var(--disp);font-size:clamp(20px,3.4vw,30px);letter-spacing:.1em;padding:12px 40px;
  background:var(--mag);color:var(--paper);border:5px solid var(--ink);border-radius:5px;cursor:pointer;
  box-shadow:8px 8px 0 var(--ink);transform:skewX(-4deg);transition:transform .08s,box-shadow .08s}
.btn:hover{background:#ff4d9c}
.btn:active{transform:skewX(-4deg) translate(5px,5px);box-shadow:3px 3px 0 var(--ink)}
.btn.alt{background:var(--cyn);color:var(--ink)}
.btn.sm{font-size:16px;padding:8px 22px;box-shadow:5px 5px 0 var(--ink)}

/* ── HUD ── */
#hud{position:fixed;inset:0;z-index:12;pointer-events:none;font-family:var(--ui)}
#hud.hide{display:none}
.hud-top{position:absolute;top:0;left:0;right:0;display:grid;grid-template-columns:1fr auto 1fr;
  align-items:start;padding:12px 14px;gap:10px}
.hud-mid{display:flex;flex-direction:column;align-items:center;gap:7px}
.timerbox{background:var(--ink);color:var(--paper);border:4px solid var(--paper);
  padding:5px 16px;transform:skewX(-8deg);box-shadow:5px 5px 0 rgba(10,10,18,.55)}
.timerbox b{font-family:var(--disp);font-size:26px;letter-spacing:.06em;display:block;line-height:1;
  text-align:center}
.timerbox s{display:block;text-decoration:none;font-size:10px;letter-spacing:.2em;text-align:center;
  color:var(--cyn)}
.wavebar{width:min(300px,34vw)}
.wavebar .track{height:10px;background:rgba(10,10,18,.55);border:3px solid var(--ink);
  position:relative;overflow:hidden}
.wavebar .fill{height:100%;background:repeating-linear-gradient(45deg,var(--yel) 0 6px,var(--mag) 6px 12px);
  width:0;transition:width .2s}
/* 波次标签已并入计时器副标题，这里保留节点只为兼容旧引用 */
.wavebar .lbl{display:none;font-family:var(--disp);font-size:11px;letter-spacing:.16em;color:var(--paper);
  text-align:center;margin-top:4px;text-shadow:none;background:rgba(10,10,18,.72);
  padding:2px 10px;border-radius:3px}
.wavebar{text-align:center}
.hud-left{width:min(300px,44vw);display:flex;align-items:flex-end;gap:8px}
.hpwrap{flex:1 1 auto;min-width:0;background:rgba(10,10,18,.72);border:4px solid var(--ink);padding:5px 7px;
  box-shadow:4px 4px 0 rgba(10,10,18,.45)}
.hpwrap .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.hpwrap .row b{font-family:var(--disp);font-size:15px;letter-spacing:.1em}
.hpwrap .row span{font-family:var(--disp);font-size:12px;color:var(--yel)}
.hpbar{height:13px;background:#2a2536;border:3px solid var(--ink);overflow:hidden;position:relative}
.hpbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff3b30,#ff2e88);
  transition:width .12s}
.hpbar:after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,transparent 0 12px,rgba(10,10,18,.35) 12px 14px)}
/* 静音按钮钉在右上角，击杀数往下一档，避免压在同一块 */
.hud-right{text-align:right;justify-self:end;display:flex;flex-direction:column;
  align-items:flex-end;gap:9px;padding-top:52px}
.lvbadge{display:inline-block;background:var(--yel);color:var(--ink);border:4px solid var(--ink);

  font-family:var(--disp);font-size:17px;letter-spacing:.08em}
/* 击杀数是白字，压在天上基本看不见 —— 给一块深色底，任何背景都能读 */
.kills{margin-top:0;font-family:var(--disp);font-size:12px;letter-spacing:.14em;color:var(--paper);
  text-shadow:2px 2px 0 var(--ink);background:rgba(10,10,18,.62);padding:2px 7px;border-radius:3px}
.xpwrap{position:absolute;left:0;right:0;bottom:0;padding:0 0 2px}
.xpbar{height:16px;background:rgba(10,10,18,.8);border-top:4px solid var(--ink);position:relative}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyn),var(--yel));
  box-shadow:0 0 18px var(--cyn);transition:width .18s}
.xpbar span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-family:var(--disp);font-size:10px;letter-spacing:.24em;color:var(--paper);
  text-shadow:2px 2px 0 var(--ink)}
.slots{position:absolute;right:12px;bottom:24px;display:flex;gap:7px;align-items:flex-end}
.slot{width:44px;height:44px;background:rgba(10,10,18,.82);border:3px solid var(--paper);
  border-radius:4px;position:relative;display:flex;align-items:center;justify-content:center;

.slot.empty{border-style:dashed;border-color:rgba(255,246,233,.35);color:rgba(255,246,233,.3)}
.slot .pips{position:absolute;bottom:2px;left:0;right:0;display:flex;gap:2px;justify-content:center}
.slot .pips u{width:5px;height:3px;background:var(--ink);display:block}
.slot .pips u.on{background:var(--yel)}
#bagbtn{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);pointer-events:auto;
  font-family:var(--ui);font-weight:800;font-size:12px;letter-spacing:.14em;padding:7px 16px;
  background:rgba(10,10,18,.8);color:var(--paper);border:3px solid var(--paper);border-radius:4px;
  cursor:pointer;box-shadow:3px 3px 0 rgba(10,10,18,.5)}

/* ── 升级三选一 ── */
#scr-level{background:rgba(10,10,18,.62);backdrop-filter:blur(3px);z-index:30}
.lvlhead{font-family:var(--disp);font-size:clamp(28px,5vw,46px);letter-spacing:.06em;text-align:center;
  color:var(--yel);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;
  text-shadow:6px 6px 0 var(--ink);line-height:1}
.lvlhead s{display:block;text-decoration:none;font-family:var(--ui);font-size:12px;letter-spacing:.3em;
  color:var(--cyn);-webkit-text-stroke:0;text-shadow:2px 2px 0 var(--ink);margin-top:4px}
.cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;width:100%;max-width:900px}
.card{flex:1 1 200px;max-width:260px;min-width:0;background:var(--paper);color:var(--ink);
  animation:cardIn .34s cubic-bezier(.16,1.3,.4,1) backwards;
  border:5px solid var(--ink);border-radius:5px;box-shadow:8px 8px 0 var(--ink);padding:14px;
  cursor:pointer;position:relative;transition:transform .1s,box-shadow .1s;overflow:hidden}
.card:hover{transform:translate(-3px,-3px) rotate(-.6deg);box-shadow:12px 12px 0 var(--ink)}
.card:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.card .ic{width:100%;height:64px;border:4px solid var(--ink);border-radius:4px;display:flex;
  align-items:center;justify-content:center;font-family:var(--disp);font-size:21px;letter-spacing:.06em;
  margin-bottom:9px;position:relative;overflow:hidden;isolation:isolate}
/* 斜纹是「高光」不是「覆盖」。
   原来用深色 rgba(10,10,18,.22) 画在 inset:0 上，而伪元素默认绘制在内容之上，
   正好压在同样深色的图标字上 —— 手机上卡片变小、条纹变密，字被切得看不清。
   现在两件事一起改：
     ① 颜色换成白色半透明，做成漫画的分镜高光，不再和黑字抢明度
     ② 条纹退到 z-index:0，文字用 .ic b 抬到 1，永远压不住字 */
.card .ic:after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:repeating-linear-gradient(-45deg,rgba(255,255,255,.34) 0 4px,rgba(255,255,255,0) 4px 13px)}
.card .ic b{position:relative;z-index:1;font-weight:900;
  text-shadow:1px 1px 0 rgba(255,255,255,.7)}
.card .nm{font-family:var(--disp);font-size:19px;letter-spacing:.05em;line-height:1}
.card .kd{font-family:var(--disp);font-size:10px;letter-spacing:.16em;color:#7b2ff7;margin-top:3px}
.card .gain{font-family:var(--disp);font-size:23px;letter-spacing:.02em;line-height:1.08;color:var(--ink);
  margin-top:7px;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);padding:5px 0}
.card .ds{font-size:12px;line-height:1.55;color:#3d3d4a;margin-top:7px;min-height:38px}
.card .up{font-family:var(--disp);font-size:11px;letter-spacing:.1em;color:#fff;background:var(--ink);
  display:inline-block;padding:2px 8px;margin-top:8px}
.card.evoc{border-color:#7b2ff7;box-shadow:8px 8px 0 #7b2ff7,0 0 28px rgba(255,46,136,.55)}
/* 新武器卡：用青色边框和标签跟「强化/被动」区分开，
   否则玩家在快节奏里分不出这张卡会往背包里加东西 */
.card.archc{border-color:#0f9b6c;box-shadow:8px 8px 0 #0f9b6c}
.card.archc .kd{color:#0b6b4a;font-weight:800}
.card.archc .gain{color:#0f7a55}
.card.newc{border-color:#00b8d4;box-shadow:8px 8px 0 #00b8d4,0 0 26px rgba(0,229,255,.32)}
.card.newc .kd{color:#006d7d;font-weight:800}
.card.newc .gain{color:#00808f}
.card.evoc .kd{color:#ff2e88}
.card.limitc .gain{color:#0f766e}
.card.limitc .kd{color:#0f766e}
#rerollbtn{font-family:var(--disp);font-size:15px;letter-spacing:.14em;padding:8px 26px;
  background:var(--ink);color:var(--paper);border:4px solid var(--paper);border-radius:5px;
  cursor:pointer;box-shadow:5px 5px 0 rgba(10,10,18,.7);transform:skewX(-6deg)}
#rerollbtn:hover{background:#1d1a2e}
#rerollbtn:disabled{opacity:.35;cursor:default}
.card.max{filter:saturate(.4)}

@keyframes cardIn{
  0%{opacity:0;transform:translateY(26px) rotate(-2.5deg) scale(.9)}
  100%{opacity:1;transform:translateY(0) rotate(0) scale(1)}
}
/* 结算界面的两个出口：再来一局（主）/ 回主菜单（次） */
.overbtns{
  display: flex; justify-content: center; gap: 12px;
  margin-top: 18px; flex-wrap: wrap;
}
.overbtns .btn{ min-width: 150px }

/* ── 背包 / 暂停 / 结算 ── */
#scr-bag,#scr-pause{background:rgba(10,10,18,.74);backdrop-filter:blur(4px);z-index:32}
.baghead{display:flex;justify-content:space-between;align-items:center;border-bottom:5px solid var(--ink);
  padding-bottom:8px;margin-bottom:12px}
.baghead h2{font-family:var(--disp);font-size:26px;letter-spacing:.08em}
.baghead span{font-family:var(--disp);font-size:11px;letter-spacing:.16em;color:#6b6b7a}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(182px,1fr));gap:10px}
.bitem{background:#fff;border:4px solid var(--ink);border-radius:4px;padding:9px;position:relative;
  box-shadow:4px 4px 0 var(--ink)}
.bitem .t{font-family:var(--disp);font-size:15px;letter-spacing:.04em;display:flex;justify-content:space-between;
  align-items:baseline;gap:6px;flex-wrap:nowrap}
.bitem .t span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bitem .t i{font-style:normal;font-size:11px;background:var(--ink);color:var(--yel);padding:1px 6px;
  font-family:var(--disp);letter-spacing:.1em;flex:0 0 auto}
.bitem .d{font-size:11px;line-height:1.5;color:#4a4a58;margin-top:5px}
.bitem .drop{position:absolute;top:-9px;right:-9px;width:24px;height:24px;border-radius:50%;
  background:var(--red);color:#fff;border:3px solid var(--ink);font-family:var(--disp);font-size:13px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1}
.bitem.pass{background:#eef7ff}
.bagstat{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bagstat div{flex:1 1 86px;background:var(--ink);color:var(--paper);border:3px solid var(--ink);
  padding:6px 9px;border-radius:3px}
.bagstat b{display:block;font-family:var(--disp);font-size:19px;line-height:1.1;color:var(--yel)}
.bagstat s{text-decoration:none;font-size:10px;letter-spacing:.14em;opacity:.7}
.pipsx{display:flex;gap:3px;margin-top:6px}
.pipsx i{flex:1;height:6px;background:#dcdce6;border:2px solid var(--ink)}
.pipsx i.on{background:var(--ink)}
.evoline{margin-top:7px;font-size:10px;line-height:1.45;color:#7b2ff7;font-weight:700;
  white-space:normal;word-break:break-word}
.evoline.ready{color:#0a8f55}
.swaprow{margin-top:8px;text-align:right}
.swaprow button{font-family:var(--ui);font-size:10px;font-weight:800;letter-spacing:.06em;
  padding:3px 9px;background:var(--ink);color:var(--paper);border:2px solid var(--ink);
  border-radius:3px;cursor:pointer}
.swaprow button:hover{background:var(--red);border-color:var(--red)}
.wic{width:42px;height:42px;border:3px solid var(--ink);border-radius:3px;display:flex;
  align-items:center;justify-content:center;font-family:var(--disp);font-size:12px;flex:0 0 auto;
  letter-spacing:0;line-height:1.05}
.wtop{display:flex;gap:9px;align-items:center;margin-bottom:2px}
.bagcols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:680px){.bagcols{grid-template-columns:1fr}}
.resrow{display:flex;justify-content:space-between;font-family:var(--ui);font-size:14px;
  padding:8px 2px;border-bottom:2px dashed rgba(10,10,18,.28)}
.resrow b{font-family:var(--disp);font-size:17px;letter-spacing:.05em}
.grade{font-family:var(--disp);font-size:clamp(60px,15vw,120px);line-height:.8;text-align:center;
  color:var(--yel);-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;
  text-shadow:9px 9px 0 var(--mag),16px 16px 0 var(--ink)}

/* ── 窄屏排版修正 ──
   桌面上的粗描边 + 8px 重影在手机上会糊成一片，按屏宽等比收缩 */
@media (max-width:760px){
  h1.logo{-webkit-text-stroke:4px var(--ink);
    text-shadow:4px 4px 0 var(--mag),7px 7px 0 var(--ink)}
  .sub{-webkit-text-stroke:2px var(--ink)}
  .lvlhead{-webkit-text-stroke:3px var(--ink);
    text-shadow:3px 3px 0 var(--ink);font-size:clamp(24px,6.6vw,34px)}
  .lvlhead s{font-size:11px;letter-spacing:.18em}
  .grade{-webkit-text-stroke:5px var(--ink);
    text-shadow:5px 5px 0 var(--mag),9px 9px 0 var(--ink)}
  .card .gain{font-size:20px}
  .panel{padding:16px 18px;box-shadow:7px 7px 0 var(--ink)}
  #rotate .rt{font-size:24px;-webkit-text-stroke:2px var(--ink)}
}

/* ── 摇杆：已移除 ──
   早期是固定在左下角的区域，后来改成「按下点为中心」的浮动摇杆，
   但容器还留着 position:fixed; bottom:0; height:58vh。
   里面的圆盘用 left/top = clientX/clientY 定位，坐标系原点是容器的左上角，
   也就是屏幕底部往上 58vh 的地方 —— 圆盘实际被画到手指下方 42vh，
   手指在屏幕上半部分按就直接飞出屏幕。
   移动逻辑本来就不读这两个元素（靠 canvas 的 pointer 事件），
   全屏滑动已经能正常操作，所以整套视觉直接去掉。 */

/* ── 加载 ── */
#boot{position:fixed;inset:0;z-index:99;background:var(--ink);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;transition:opacity .4s}
#boot.out{opacity:0;pointer-events:none}
#boot .b1{font-family:var(--disp);font-size:clamp(30px,6vw,54px);letter-spacing:.1em;color:var(--yel);
  -webkit-text-stroke:5px #000;paint-order:stroke fill;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
#boot .bar{width:min(300px,60vw);height:8px;background:#232030;border:3px solid var(--paper);
  overflow:hidden}
#boot .bar i{display:block;height:100%;width:0%;background:var(--mag);transition:width .28s ease-out}
#bootgo{
  font-family:var(--disp);font-size:clamp(16px,2.2vw,22px);letter-spacing:.22em;
  padding:14px 34px;margin-top:2px;cursor:pointer;
  background:var(--yel);color:var(--ink);border:4px solid var(--paper);
  box-shadow:6px 6px 0 var(--mag);transform:skewX(-6deg);
  transition:transform .1s, box-shadow .1s;
}
#bootgo:hover{transform:skewX(-6deg) translate(-2px,-2px);box-shadow:8px 8px 0 var(--mag)}
#bootgo:active{transform:skewX(-6deg) translate(2px,2px);box-shadow:3px 3px 0 var(--mag)}
#boot.go #bootgo{display:none}
@keyframes load{0%{margin-left:-30%}100%{margin-left:100%}}
.hint{font-family:var(--disp);font-size:11px;letter-spacing:.2em;color:#8a8a9a;text-align:center}
/* ── 竖屏提示 ── */
#rotate{position:fixed;inset:0;z-index:95;background:var(--ink);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:22px;
  text-align:center;padding:28px}
#rotate.on{display:flex;cursor:pointer}
#rotate .rhint{font-size:11px;color:#6d7684;letter-spacing:.08em;margin-top:2px}
#rotate .ph{width:62px;height:100px;border:5px solid var(--yel);border-radius:9px;
  position:relative;animation:tiltPhone 2.2s ease-in-out infinite}
#rotate .ph:after{content:"";position:absolute;left:50%;bottom:7px;transform:translateX(-50%);
  width:16px;height:16px;border:3px solid var(--yel);border-radius:50%}
@keyframes tiltPhone{
  0%,28%{transform:rotate(0deg)}
  58%,100%{transform:rotate(-90deg)}
}
#rotate .rt{font-family:var(--disp);font-size:30px;letter-spacing:.08em;color:var(--yel);
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
#rotate .rs{font-size:12px;letter-spacing:.1em;color:#9aa4b2;line-height:1.7}
#rotate .rbtns{display:flex;gap:10px;margin-top:4px}
#rotate .rbtns button{font-family:var(--ui);font-weight:800;font-size:13px;letter-spacing:.1em;
  padding:9px 20px;cursor:pointer;border:3px solid var(--ink);border-radius:5px;
  background:var(--yel);color:var(--ink);box-shadow:4px 4px 0 rgba(10,10,18,.7)}
#rotate .rbtns button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(10,10,18,.7)}
#rotate .rbtns #rotskip{background:transparent;color:#9aa4b2;border-color:#4a4660;
  box-shadow:4px 4px 0 rgba(10,10,18,.45)}

/* 音频控件 */
/* ── 超武蓄力环 ── */
/* 放左下角：右下角是武器槽，右上角是等级/击杀，只有左边这块是空的 */
#ultbox{position:fixed;left:20px;bottom:58px;width:100px;height:100px;z-index:24;
  pointer-events:auto;cursor:pointer;transition:opacity .25s, transform .12s}
#ultbox.off{opacity:0;pointer-events:none}
#ultbox:active{transform:scale(.95)}
#ultbox svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#ultbox .ubg{fill:none;stroke:rgba(10,10,18,.55);stroke-width:11}
#ultbox .ufg{fill:none;stroke:#ffe600;stroke-width:9;stroke-linecap:round;
  stroke-dasharray:257.6;stroke-dashoffset:257.6;transition:stroke-dashoffset .06s linear}
#ultbox .ucore{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;pointer-events:none}
#ultbox .ucore b{font-family:var(--disp);font-size:14px;letter-spacing:.04em;color:#fff6e9;
  text-shadow:2px 2px 0 #0a0a12;line-height:1;max-width:78px;text-align:center}
#ultbox .ucore s{text-decoration:none;font-size:9px;letter-spacing:.08em;color:#cfd6e4;white-space:nowrap;
  text-shadow:1px 1px 0 #0a0a12}
#ultbox.ready .ufg{stroke:#ffe600;animation:ultGlow 1.1s ease-in-out infinite}
#ultbox.ready .ucore b{color:#ffe600}
#ultbox.ready .ucore s{color:#ffe600}
@keyframes ultGlow{
  0%,100%{filter:drop-shadow(0 0 3px rgba(255,230,0,.55))}
  50%{filter:drop-shadow(0 0 12px rgba(255,230,0,.95))}
}

/* 音频控件原来在桌面是「左上角往下 72px」、手机是「右上角」，
   两套位置各自让位，结果两边都得为它留白。
   现在统一钉在右上角：标题页正好与左上角的标题形成对角，
   游戏内则把右上角的击杀数往下让，只在一处妥协。 */
#audiobox{position:fixed;right:14px;top:14px;z-index:28;display:flex;flex-direction:column;
  align-items:flex-end;gap:5px}
#mutebtn{width:46px;height:46px;border-radius:9px;border:3px solid var(--ink);
  background:var(--yel);color:var(--ink);display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:4px 4px 0 rgba(10,10,18,.6);transition:background .15s,color .15s,transform .07s}
#mutebtn svg{width:25px;height:25px;display:block}
#mutebtn .ic-off{display:none}
#mutebtn:hover{background:#ffef4d}
#mutebtn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(10,10,18,.6)}
#mutebtn.muted{background:#2b2740;color:#8f8ba8;border-color:#8f8ba8}
#mutebtn.muted:hover{background:#37324f;color:#c9c5dd}
#mutebtn.muted .ic-on{display:none}
#mutebtn.muted .ic-off{display:block}
#volbtn{font-family:var(--ui);font-weight:800;font-size:10px;letter-spacing:.14em;
  padding:3px 9px;background:var(--ink);color:var(--paper);border:2px solid var(--paper);
  border-radius:4px;cursor:pointer;box-shadow:3px 3px 0 rgba(10,10,18,.55)}
#volbtn:hover{border-color:var(--yel);color:var(--yel)}
#volpanel{position:absolute;right:56px;top:0;width:206px;background:rgba(10,10,18,.97);
  border:3px solid var(--paper);border-radius:6px;padding:12px 13px;display:flex;
  flex-direction:column;gap:11px;box-shadow:7px 7px 0 rgba(10,10,18,.55)}
#volpanel.hide{display:none}
.vrow{display:flex;align-items:center;gap:8px;font-family:var(--ui);font-size:11px;
  font-weight:800;color:var(--paper)}
.vrow span{flex:0 0 26px}
.vrow b{flex:0 0 24px;text-align:right;color:var(--yel);font-family:var(--disp);font-size:12px}
.vrow input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:18px;
  background:transparent;outline:none;cursor:pointer;min-width:0}
.vrow input[type=range]::-webkit-slider-runnable-track{height:6px;background:#302b46;border-radius:3px}
.vrow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;
  border-radius:50%;background:var(--yel);border:3px solid var(--ink);cursor:pointer;margin-top:-7px}
.vrow input[type=range]::-moz-range-track{height:6px;background:#302b46;border-radius:3px}
.vrow input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;
  background:var(--yel);border:3px solid var(--ink);cursor:pointer}

/* ═══════════════════════════════════════════════════════════
   矮屏适配（手机横屏 / 平板横屏）

   为什么单独加这一段：之前所有断点都是 max-width，但这是个横屏游戏，
   真正的约束是「高度」。844x390 的手机和 844x760 的桌面窄窗口
   宽度完全一样，用宽度判断等于把两种设备混为一谈。
   结果就是手机上按桌面布局压扁，角色卡名字都被裁没了。

   这一段只做一件事：纵向空间不够时，把信息量减掉，而不是缩小。
   ═══════════════════════════════════════════════════════════ */
@media (max-height: 520px){

  /* ── 音频控件：矮屏只留静音图标，音量面板收进暂停菜单 ── */
  #audiobox{left:auto; right:10px; top:8px; flex-direction:row; gap:5px}
  #mutebtn{width:32px; height:32px; border-width:2px; border-radius:7px;
    box-shadow:3px 3px 0 rgba(10,10,18,.6)}
  #mutebtn svg{width:18px; height:18px}
  #volbtn{display:none}
  #volpanel{display:none !important}

  /* ── HUD：压缩所有控件，并把上半区让开音频图标 ── */
  .hud-top{padding:6px 10px; gap:8px}
  /* 左列 = 血条 + 等级（同一行）。等级从右上挪过来之后，
     右上只剩击杀数，不再需要 38px 的让位空间，顶部整块矮了一截。 */
  .hud-left{width:min(250px,42vw);gap:6px}
  .hpwrap{padding:3px 5px; border-width:3px; box-shadow:3px 3px 0 rgba(10,10,18,.4)}
  .hpwrap .row{margin-bottom:2px}
  .hpwrap .row b{font-size:11px}
  .hpwrap .row span{font-size:10px}
  .hpbar{height:9px; border-width:2px}

  .timerbox{padding:2px 12px; border-width:3px; box-shadow:3px 3px 0 rgba(10,10,18,.5)}
  .timerbox b{font-size:18px}
  .timerbox s{font-size:8px; letter-spacing:.06em; margin-top:1px}
  .hud-mid{gap:3px}
  .wavebar{width:min(190px,40vw)}
  .wavebar .track{height:5px; border-width:2px}
  /* 手机上「本波剩余 Ns」已经并进计时器下面那行，标签整行去掉，
     否则它和三秒后弹出的提示条会叠在同一个位置。 */
  .wavebar .lbl{display:none}

  /* 右上只剩击杀数，避开静音图标即可 */
  .hud-right{padding-top:40px; gap:0}
  .lvbadge{font-size:12px; padding:1px 8px; border-width:3px; box-shadow:3px 3px 0 rgba(10,10,18,.45)}
  .kills{font-size:9px; letter-spacing:.1em}

  /* 底部：背包居中、武器槽在右下排成一排、超武按钮压在它们上面。
     超武按钮从「左下角」挪到「右下角」——
     手机的主流握法是左手划屏移动、右手点技能，放左下等于让右手横穿整个屏幕。 */
  #ultbox{width:78px;height:78px;left:auto;right:12px;bottom:54px}
  /* 78px 的环里放不下四个汉字，手机上只留百分比 / 点我 */
  #ultbox .ucore b{display:none}
  #ultbox .ucore s{font-size:12px; letter-spacing:.02em}
  #bagbtn{font-size:11px; padding:3px 12px; bottom:16px}
  #slots{gap:5px; right:100px; bottom:14px}
  .slot{width:32px; height:32px; border-width:2px; font-size:10px}
  .slot .pips u{width:4px; height:2px}
  .xpwrap{padding:0 8px}
  .xpbar{height:8px; border-width:2px}
  .xpbar span{font-size:8px; letter-spacing:.12em}
}

/* 矮屏补充：升级页与经验条 */
@media (max-height: 520px){

  /* 升级三选一：卡片纵向压扁，否则「重掷」按钮会被挤出屏幕 */
  #scr-level{gap:6px; padding:6px 10px}
  .lvlhead{font-size:24px; -webkit-text-stroke:4px var(--ink); text-shadow:4px 4px 0 var(--ink)}
  .lvlhead s{font-size:10px; margin-top:2px}
  #cards{gap:8px}
  .card{padding:7px 9px}
  .card .ic{font-size:17px; padding:5px 0}
  .card .kd{font-size:8px; margin-top:2px}
  .card .nm{font-size:14px; margin-top:1px}
  .card .gain{font-size:16px; margin-top:3px}
  .card .ds{font-size:10px; margin-top:3px; min-height:0; line-height:1.35}
  #rerollbtn{font-size:11px; letter-spacing:.1em; padding:4px 16px; border-width:3px;
    box-shadow:3px 3px 0 rgba(10,10,18,.7)}

  /* 经验条：16px 高 + 文字会在 390 高里被底边裁掉，压薄 */
  .xpwrap{padding:0}
  .xpbar{height:8px; border-top-width:2px}
  .xpbar span{font-size:8px; letter-spacing:.1em}
}

/* ══════════ 图鉴 ══════════ */
#scr-codex{
  background: rgba(8,10,24,.9);
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
  z-index: 34;
}
.codex-panel{
  width: min(1120px, 96vw);
  max-height: 94vh;
  display: flex; flex-direction: column; gap: 11px;
  background: var(--paper);
  border: 5px solid var(--ink);
  border-radius: 16px;
  padding: clamp(13px,1.8vh,20px) clamp(14px,1.8vw,22px);
  box-shadow: 12px 12px 0 rgba(10,10,18,.62);
  color: var(--ink);
}
.codex-head{
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  flex: 0 0 auto;
}
.codex-title{ flex: 1 1 auto; min-width: 0 }
.codex-title h2{
  font-family: var(--disp); font-size: clamp(22px,2.4vw,30px); letter-spacing: .22em;
  line-height: 1; margin: 0;
}
.codex-title s{
  display: block; text-decoration: none; margin-top: 5px;
  font-family: var(--ui); font-size: 11px; letter-spacing: .08em; color: #6b6b7a;
}
.codex-tabs{
  display: flex; gap: 0; background: #e8e4dc; border: 3px solid var(--ink);
  border-radius: 9px; padding: 3px;
}
.codex-tabs button{
  border: none; background: transparent; border-radius: 6px; cursor: pointer;
  padding: 8px 16px; font-family: var(--ui); font-weight: 800; font-size: 13px;
  letter-spacing: .1em; color: #5a5a68; transition: background .12s, color .12s;
}
.codex-tabs button.on{ background: var(--ink); color: var(--yel) }
.codex-tabs button:hover:not(.on){ background: #d8d3c8; color: var(--ink) }

.codex-body{
  flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
  gap: 12px; padding: 3px 5px 3px 2px;
}
.codex-body::-webkit-scrollbar{ width: 8px }
.codex-body::-webkit-scrollbar-thumb{ background: #b9b4a8; border-radius: 4px }

.cx-card{
  background: #fff; border: 3px solid var(--ink); border-radius: 11px;
  padding: 12px 13px; box-shadow: 4px 4px 0 rgba(10,10,18,.5);
  display: flex; flex-direction: column; gap: 8px;
}
.cx-head{ display: flex; align-items: center; gap: 10px }
.cx-blob{
  width: 46px; height: 46px; border-radius: 50%;
  border: 3px solid var(--ink); flex: 0 0 46px;
  position: relative; overflow: hidden;
  box-shadow: 2px 2px 0 rgba(10,10,18,.4);
}
/* 用三个色块拼一个抽象剪影，对应目标的三主色 */
.cx-blob i{ position: absolute; display: block; border-radius: 50% }
.cx-name{
  font-family: var(--disp); font-size: 17px; letter-spacing: .06em; line-height: 1.1;
}
.cx-tag{
  display: inline-block; margin-top: 3px; padding: 1px 7px;
  background: var(--ink); color: var(--yel); border-radius: 4px;
  font-family: var(--ui); font-size: 10px; font-weight: 800; letter-spacing: .08em;
}
.cx-look{
  font-size: 12px; line-height: 1.55; color: #3d3d4a;
}
.cx-look b{ color: var(--ink) }
.cx-stats{
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 10px;
  border-top: 2px dotted #d8d3c8; padding-top: 8px;
}
.cx-stat{ display: flex; justify-content: space-between; font-size: 11px; color: #5a5a68 }
.cx-stat b{ color: var(--ink); font-family: var(--disp); font-size: 12px }
.cx-lv{
  display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px;
}
.cx-lv span{
  font-size: 10px; padding: 1px 6px; border-radius: 3px;
  background: #eef2f7; color: #47506b; border: 1px solid #d6dce8;
}
.cx-lv span.hot{ background: var(--ink); color: var(--yel); border-color: var(--ink) }
.cx-note{
  font-size: 11px; line-height: 1.5; color: #7b2ff7; font-weight: 700;
}
.cx-evo{
  font-size: 11px; color: #0a8f55; font-weight: 800;
  border-top: 2px dotted #d8d3c8; padding-top: 7px;
}

/* 矮屏（手机横屏）：图鉴压成两列，卡片内容精简 */
@media (max-height: 520px){
  .codex-panel{ padding: 8px 10px; gap: 7px; border-width: 4px; border-radius: 11px }
  .codex-title h2{ font-size: 18px; letter-spacing: .16em }
  .codex-title s{ display: none }
  .codex-tabs button{ padding: 5px 11px; font-size: 11px }
  .codex-body{ grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px }
  .cx-card{ padding: 8px 9px; gap: 5px; border-width: 2px }
  .cx-blob{ width: 32px; height: 32px; flex-basis: 32px; border-width: 2px }
  .cx-name{ font-size: 14px }
  .cx-look{ font-size: 10.5px; line-height: 1.4 }
  .cx-stats{ padding-top: 5px; gap: 2px 8px }
  .cx-stat{ font-size: 10px }
  .t-actions{ margin-top: 6px }
  .codexbtn{ min-width: 86px; font-size: 12px }
}
</style>
</head>
<body class="is-title">
<canvas id="gl"></canvas>
<div id="poster"></div>
<div id="speedlines"></div>
<div id="damagetint"></div>
<div id="ultwash"></div>
<div id="fx"></div>
<div id="flash"></div>

<!-- 摇杆已移除：触屏直接全屏滑动，不需要视觉层 -->
<div id="audiobox">
  <button id="mutebtn" title="点击关闭声音" aria-label="静音开关">
    <svg class="ic-on" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9.5v5a1 1 0 0 0 1 1h3l4.2 3.4a1 1 0 0 0 1.6-.8V5.9a1 1 0 0 0-1.6-.8L8 8.5H5a1 1 0 0 0-1 1z" fill="currentColor"/>
      <path d="M16.2 8.6a4.6 4.6 0 0 1 0 6.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M18.8 6.2a7.8 7.8 0 0 1 0 11.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <svg class="ic-off" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9.5v5a1 1 0 0 0 1 1h3l4.2 3.4a1 1 0 0 0 1.6-.8V5.9a1 1 0 0 0-1.6-.8L8 8.5H5a1 1 0 0 0-1 1z" fill="currentColor"/>
      <path d="M16.6 9.4l4.8 4.8M21.4 9.4l-4.8 4.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
  </button>
  <button id="volbtn">音量</button>
  <div id="volpanel" class="hide">
    <div class="vrow"><span>音乐</span><input type="range" id="volbgm" min="0" max="100" value="21"><b id="volbgmv">21</b></div>
    <div class="vrow"><span>音效</span><input type="range" id="volsfx" min="0" max="100" value="55"><b id="volsfxv">55</b></div>
  </div>
</div>

<!-- ══ HUD ══ -->
<div id="hud" class="hide">
  <div class="hud-top">
    <div class="hud-left">
      <div class="hpwrap">
        <div class="row"><b>HP</b><span id="hptxt">100 / 100</span></div>
        <div class="hpbar"><i id="hpfill"></i></div>
      </div>
      <!-- 等级和血量都是「我现在什么状态」，放一起看最顺。
           原来在右上角，被静音按钮往下挤了 38px，正好和波次条撞在同一水平带。 -->
      <div class="lvbadge">LV.<span id="lvtxt">1</span></div>
    </div>
    <div class="hud-mid">
      <div class="timerbox"><b id="clock">0:00</b><s id="wavetxt">WAVE 1 / 10</s></div>
      <div class="wavebar">
        <div class="track"><div class="fill" id="wavefill"></div></div>
        <div class="lbl" id="wavelbl">本波进度</div>
      </div>
    </div>
    <div class="hud-right">
      <div class="kills">KILLS <span id="killtxt">0</span></div>
    </div>
  </div>
  <div class="slots" id="slots"></div>
  <button id="bagbtn">背包 / TAB</button>

  <!-- 超武蓄力环：桌面按空格释放，手机点它也能放 -->
  <div id="ultbox" class="off">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle class="ubg" cx="50" cy="50" r="41"></circle>
      <circle class="ufg" id="ultring" cx="50" cy="50" r="41"></circle>
    </svg>
    <div class="ucore">
      <b id="ulticon">超武</b>
      <s id="ultkey">空格</s>
    </div>
  </div>
  <div class="xpwrap">
    <div class="xpbar"><i id="xpfill"></i><span id="xptxt">XP</span></div>
  </div>
</div>

<!-- ══ 开始界面：一刀破开 ══ -->
<div id="scr-title" class="screen">
  <!-- 切分背景：纸面 / 墨面 / 光带。纯装饰，不接任何交互 -->
  <div class="tt-split" aria-hidden="true">
    <i class="sp-paper"></i>
    <i class="sp-ink"></i>
    <i class="sp-echo"></i>
    <i class="sp-slash"></i>
  </div>

  <div class="tt-grid">
    <header class="tt-head">
      <h1 class="tt-logo"><s>POW!&nbsp;ARCHER</s><b>爆裂弓箭手</b></h1>
    </header>

    <section class="tt-hero">
      <h2 class="tt-lab"><i>01</i>选择职业</h2>
      <div class="pickrow" id="heroes"></div>
      <div class="herodesc" id="herodesc"></div>
    </section>

    <section class="tt-rate">
      <h2 class="tt-lab"><i>02</i>刷怪密度</h2>
      <div class="rate" id="rates"></div>
    </section>

    <footer class="tt-foot">
      <button class="btn codexbtn" id="codexbtn">图 鉴</button>
      <button class="btn startbig" id="startbtn">
        <span class="sbt">开 始 对 战</span>
      </button>
    </footer>

    <div class="tt-ticker">
      <span>WASD 移动</span><span>自动射击</span><span>TAB 背包</span><span>ESC 暂停</span>
    </div>
  </div>
</div>

<!-- ══ 升级三选一 ══ -->
<div id="scr-level" class="screen hide">
  <div class="lvlhead">LEVEL UP!</div>
  <div class="cards" id="cards"></div>
  <button id="rerollbtn">重掷</button>
</div>

<!-- ══ 背包 ══ -->
<div id="scr-bag" class="screen hide">
  <div class="panel">
    <div class="baghead"><h2>背 包</h2><span id="bagcount">武器 0/4 · 被动 0/6</span></div>
    <div class="bagstat" id="bagstat"></div>
    <div class="bagcols">
      <div>
        <div class="sechead">武器</div>
        <div class="bgrid" id="bagweapons"></div>
      </div>
      <div>
        <div class="sechead">被动</div>
        <div class="bgrid" id="bagpassives"></div>
      </div>
    </div>
    <div style="display:flex;justify-content:center;margin-top:18px;gap:10px">
      <button class="btn sm alt" id="bagclose">继 续 战 斗</button>
    </div>
  </div>
</div>

<!-- ══ 暂停 ══ -->
<div id="scr-pause" class="screen hide">
  <div class="panel" style="max-width:min(520px,94vw)">
    <div class="baghead"><h2>暂 停</h2><span>PAUSED</span></div>
    <div class="sechead">怪物刷新频率</div>
    <div class="rate" id="rates2"></div>
    <div style="display:flex;justify-content:center;margin-top:20px;gap:10px;flex-wrap:wrap">
      <button class="btn sm" id="resume">继 续</button>
      <button class="btn sm alt" id="quitbtn">放弃本局</button>
    </div>

(function(){

/* ─────────── 工具 ─────────── */

/* 配色体系（v0.8 重做）
   ─────────────────────────────────────────────
   问题：经验球是青色 #00E5FF，地面是浅蓝 #E4F2FD。
   两者明度只差 17（85 vs 78），而且同属蓝青色系，
   灰阶下几乎叠在一起 ——「看不清」不是色相问题，是明度没拉开。

   三条原则（来自游戏配色研究）：
   1. 明度对比最重要。转灰阶还能分清，才算合格；
      只靠色相对比，在运动中和小尺寸下会失效。
   2. 职能色分层。金 = 战利品、红 = 危险、冷色 = 环境。
      同一含义永远用同一颜色，玩家不用思考就能反应。
   3. 环境去饱和。背景的饱和度和细节要比前景低一档，
      否则前景会被「视觉噪声」淹没。

   具体做法：
   · 地面从 #E4F2FD 压到 #C9DFEF（明度 95 → 82），并把放射线、
     同心圆、网点的透明度全部降一半，减少噪声
   · 经验球从青改为金 #FFC233（明度 82 → 84，但色相与蓝互补、

var COS = {

  coral:0xff4d6d,    /* BOSS 警示：千手墨神的手臂与能量环 */
  teal:0x12a6c4,     /* 尖刺兽：压暗的青蓝，与浅蓝地面拉开明度 */
  warmwhite:0xfff8ee  /* 玩家光环内圈：中性亮色，不与任何敌人撞色 */
};

var ARENA_R = 40;          // 竞技场半径
var MAX_ENEMY = 170;

/* ─────────── 渲染 ─────────── */
var canvas = $('gl');

renderer.setPixelRatio(Math.min(devicePixelRatio||1, 1.6));

/* 超武推镜：释放瞬间镜头往后拉一点，把整片战场收进画面。

var ultPunch = 0;

var hemi = new THREE.HemisphereLight(0xffffff, 0x9fc4e8, 0.95);
scene.add(hemi);
var dir = new THREE.DirectionalLight(0xfffaf0, 1.18);
dir.position.set(-18, 34, 14);

/* 三阶色阶贴图 —— 美漫的关键：明暗只有三档，不要渐变 */
function makeGradientMap(){
  var data = new Uint8Array([70, 140, 205, 255]);
  var tex = new THREE.DataTexture(data, 4, 1, THREE.RedFormat);
  tex.minFilter = THREE.NearestFilter;
  tex.magFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  tex.unpackAlignment = 1;
  tex.needsUpdate = true;
  return tex;
}
var GRAD = makeGradientMap();

function toon(color, opts){
  opts = opts || {};
  var m = new THREE.MeshToonMaterial({color:color, gradientMap:GRAD});
  if(opts.emissive){ m.emissive = new THREE.Color(opts.emissive); m.emissiveIntensity = opts.ei||1; }
  return m;
}
var OUTLINE_MAT = new THREE.MeshBasicMaterial({color:0x0a0a12, side:THREE.BackSide});

/* 给单体模型加描边（背面外扩） */
function withOutline(mesh, k){
  k = k || 1.13;
  var o = new THREE.Mesh(mesh.geometry, OUTLINE_MAT);
  o.scale.setScalar(k);
  mesh.add(o);
  return mesh;
}
function part(geo, color, k){
  var m = new THREE.Mesh(geo, toon(color));
  return withOutline(m, k || 1.16);
}

/* ─────────── 程序化贴图 ─────────── */
function hvCanvas(w,h){ var c=document.createElement('canvas'); c.width=w; c.height=h; return c; }

/* 漫画地板：放射线 + 同心圆 + 网点 */
function makeFloorTex(){
  var S=768, cv=hvCanvas(S,S), g=cv.getContext('2d'), c=S/2;
  /* 底色从 #e4f2fd 压到 #c9dfef：明度 95 → 82。
     地面是 60% 的画面面积，它越亮，上面的东西越难看清。 */
  g.fillStyle='#c9dfef'; g.fillRect(0,0,S,S);
  // 放射线
  g.save(); g.translate(c,c);
  for(var i=0;i<48;i++){
    g.rotate(TAU/48);
    g.beginPath(); g.moveTo(0,0); g.lineTo(0, S*0.62);
    /* 放射线原来开到 .42/.85，在亮底上是一层白噪声。降到 .16/.30，
       保留美漫的放射构图，但不再和地面的物件抢注意力。 */
    g.strokeStyle = i%2 ? 'rgba(120,180,225,.10)' : 'rgba(176,210,240,.20)';
    g.lineWidth = i%2 ? 10 : 22; g.stroke();
  }
  g.restore();
  // 同心圆
  for(var r=40;r<c;r+=42){
    g.beginPath(); g.arc(c,c,r,0,TAU);
    g.strokeStyle='rgba(255,255,255,.26)'; g.lineWidth=3; g.stroke();
  }
  // 网点
  g.fillStyle='rgba(96,150,196,.10)';
  for(var y=0;y<S;y+=7){ for(var x=(y/7%2)*7;x<S;x+=14){ g.fillRect(x,y,2.4,2.4); } }
  // 中央标志
  g.save(); g.translate(c,c);
  g.beginPath(); g.arc(0,0,16,0,TAU); g.fillStyle='rgba(255,46,136,.16)'; g.fill();
  g.beginPath(); g.arc(0,0,16,0,TAU); g.strokeStyle='rgba(255,46,136,.38)'; g.lineWidth=4; g.stroke();
  g.restore();
  var t=new THREE.CanvasTexture(cv);
  t.anisotropy=4;
  return t;
}

/* 径向渐变光斑贴图（粒子 / 冲击波） */
function makeGlowTex(){
  var S=128, cv=hvCanvas(S,S), g=cv.getContext('2d'), c=S/2;
  var grd=g.createRadialGradient(c,c,0,c,c,c);
  grd.addColorStop(0,'rgba(255,255,255,1)');
  grd.addColorStop(.35,'rgba(255,255,255,.75)');
  grd.addColorStop(.7,'rgba(255,255,255,.18)');
  grd.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=grd; g.fillRect(0,0,S,S);
  return new THREE.CanvasTexture(cv);
}
var GLOW = makeGlowTex();

/* ─────────── 场景搭建 ─────────── */
var world = new THREE.Group();
scene.add(world);

function buildArena(){
  // 地板
  var ftex = makeFloorTex();
  var floor = new THREE.Mesh(
    new THREE.CircleGeometry(ARENA_R+3, 96),
    new THREE.MeshBasicMaterial({map:ftex})
  );
  floor.rotation.x = -Math.PI/2;
  floor.position.y = -0.02;
  world.add(floor);

  // 外圈围墙：一圈墨块
  var n = 46;
  var rockGeo = new THREE.IcosahedronGeometry(1, 0);
  for(var i=0;i<n;i++){
    var a = i/n*TAU;
    var r = ARENA_R + rnd(1.2, 2.6);
    var s = rnd(1.4, 2.6);
    var col = [COS.pur, COS.mag, COS.blue, COS.cyan][i%4] || COS.pur;
    var ROCKC = [0x7ac74f, 0xffa53d, 0x4fb3e8, 0xff7ab8, 0xf5d13e, 0x9b7bea];
    var m = new THREE.Mesh(rockGeo, toon(ROCKC[i % ROCKC.length]));
    m.position.set(Math.cos(a)*r, rnd(-0.3,0.5), Math.sin(a)*r);
    m.scale.set(s, s*rnd(.9,1.6), s);
    m.rotation.set(rnd(0,3), rnd(0,3), rnd(0,3));
    world.add(m);
  }

  // 地面装饰：几个大色块圆盘
  for(var k=0;k<7;k++){
    var a2 = k/7*TAU + 0.4;
    var rr = rnd(10, 30);
    var disc = new THREE.Mesh(
      new THREE.CircleGeometry(rnd(2.5,5), 24),
      new THREE.MeshBasicMaterial({color: k%2?0xc8e6fb:0xb6dcf7, transparent:true, opacity:.5})
    );
    disc.rotation.x = -Math.PI/2;
    disc.position.set(Math.cos(a2)*rr, 0.01, Math.sin(a2)*rr);
    world.add(disc);
  }
}
buildArena();

/* ─────────── 相机 ───────────
   规则一：相机只跟随玩家位置，不掺任何输入状态。
   规则二：硬跟随，不做插值。插值会在玩家加速/减速时产生滞后，
          画面相对玩家滑动，体感就是抽搐。
   硬跟随下玩家在屏幕上的位置绝对固定，只有世界在滚动。 */
function updateCamera(dt, px, pz){
  /* 矮屏（手机横屏）视野窄，用同样的机位角色会小得看不清。
     按可用高度把相机拉近：390 高的手机大概拉到 19/13。 */
  var camH = 24, camZ = 16.5;
  if(innerHeight < 520){
    var k = Math.max(0.72, Math.min(1, innerHeight / 760));
    camH = 24 * (0.78 + 0.22*k);
    camZ = 16.5 * (0.78 + 0.22*k);
  }
  /* 超武推镜：0→1 拉远 14%，1.1 秒内回落。推远才有「看得见整片战场」的感觉，
     箭雨、空袭这类全屏超武尤其需要。 */
  if(ultPunch > 0.001){
    var zp = 1 + ultPunch * 0.14;
    camH *= zp; camZ *= zp;
    ultPunch = Math.max(0, ultPunch - dt * 0.9);
  }

  /* ── 震屏：trauma 模型（GDC《Juicing Your Cameras With Math》）──
     trauma 是 0~1 的「震动总量」，事件往上加、封顶 1，然后线性衰减；
     实际位移 = trauma²（平方让小震动更轻、大震动更猛，手感才有层次）。
     为什么不能像原来那样用 max：4 颗炸弹错时爆炸，每次都会把震动顶回满值，
     于是 4 次独立抽动 —— 玩家描述成「屏幕被拉扯」。累加后 4 颗炸弹合成
     一次持续约 0.7 秒的强震，包络是连续的。 */
  var sx = 0, sy = 0, sz = 0;
  if(camShake > 0.001){
    camShakeT += dt*34;
    var k = camShake * camShake;
    sx = Math.cos(camShakeT*1.7) * k * 1.25;
    sy = Math.sin(camShakeT*2.3) * k * 0.55;
    sz = Math.cos(camShakeT*2.9) * k * 1.0;
    camShake -= 1.50 * dt;          // 线性衰减：满值约 0.67 秒回到 0
    if(camShake < 0) camShake = 0;
  }

  camera.position.set(px + sx, camH + sy, pz + camZ + sz);
  camera.lookAt(px + sx*0.5, 0.6, pz - 4);
}
/* 累加而不是取最大值：连炸才会合成一次长震，而不是反复抽动。
   1.0 封顶，防止十几个事件叠成癫痫。 */
/* ── 但「纯线性累加」在后期会失控 ──
   炸弹 Lv5 一次四颗，每颗都调 shake(0.22)；每杀一只怪还要 shake(0.055)，
   炸弹清屏一次能死十几只。这些事件加起来每轮超过 1.4，而衰减只有 1.35/秒，
   于是 trauma 长期贴顶，屏幕从「炸一下」变成「一直在抖」，而且越后期越狠。
   玩家原话：「丢炸弹丢得越多，屏幕越来越晃」。
   现在改成「同一批事件边际递减」：
     · 0.12 秒内发生的事件算同一批
     · 批内第 2、3、4 次的有效量按 0.55 的幂衰减（0.55 / 0.30 / 0.17）
     · 再乘一个软饱和，越接近满值越推不动
   单颗炸弹的手感完全不变（第一发永远是全额），四颗一起炸只是「更闷一点」。 */
var shakeWinT = -9, shakeWinAmt = 0;
function shake(amt){
  var t = S.t || 0;
  if(t - shakeWinT > 0.12){ shakeWinT = t; shakeWinAmt = 0; }
  var scale = Math.pow(0.75, shakeWinAmt / 0.30);
  var use = amt * scale;
  shakeWinAmt += amt;
  camShake = Math.min(1, camShake + use * (1 - camShake * 0.25));
}

/* ─────────── 屏幕特效 ─────────── */

/* ─────────── 音效（Web Audio 合成，零素材） ─────────── */
var AC = null, masterGain = null, muted = false;
function audioInit(){
  if(AC) return;
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    masterGain = AC.createGain();
    masterGain.gain.value = 0.55;
    masterGain.connect(AC.destination);
  }catch(e){ AC = null; }
}
function tone(freq, dur, type, vol, slideTo){
  if(!AC || muted) return;
  var t = AC.currentTime;
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), t+dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol==null?0.35:vol, t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0008, t+dur);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t+dur+0.02);
}
function noise(dur, vol, hp){
  if(!AC || muted) return;
  var t = AC.currentTime;
  var len = Math.max(1, Math.floor(AC.sampleRate*dur));
  var buf = AC.createBuffer(1, len, AC.sampleRate);
  var d = buf.getChannelData(0);
  for(var i=0;i<len;i++){ d[i] = (Math.random()*2-1) * (1 - i/len); }
  var src = AC.createBufferSource(); src.buffer = buf;
  var g = AC.createGain(); g.gain.value = vol==null?0.3:vol;
  var f = AC.createBiquadFilter(); f.type='highpass'; f.frequency.value = hp||600;
  src.connect(f); f.connect(g); g.connect(masterGain);
  src.start(t);
}
var SFX = {
  shoot: function(){ tone(rnd(680,760), 0.07, 'square', 0.10, 320); },

  function snare(t, v){
    var src = AC.createBufferSource(); src.buffer = noiseBufGet();
    var f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1900; f.Q.value = 0.9;
    var gn = AC.createGain();
    gn.gain.setValueAtTime(v, t);
    gn.gain.exponentialRampToValueAtTime(0.0008, t + 0.125);
    src.connect(f); f.connect(gn); gn.connect(g);
    src.start(t); src.stop(t + 0.15);
    /* 叠一条短促的实体音，让军鼓有厚度 */
    var o = AC.createOscillator(), og = AC.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(210, t);
    o.frequency.exponentialRampToValueAtTime(150, t + 0.08);
    og.gain.setValueAtTime(v*0.55, t);
    og.gain.exponentialRampToValueAtTime(0.0008, t + 0.09);
    o.connect(og); og.connect(g);
    o.start(t); o.stop(t + 0.11);
  }

  function hat(t, v, open){
    var src = AC.createBufferSource(); src.buffer = noiseBufGet();
    var f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7600;
    var gn = AC.createGain();
    var dur = open ? 0.14 : 0.035;
    gn.gain.setValueAtTime(v, t);
    gn.gain.exponentialRampToValueAtTime(0.0006, t + dur);
    src.connect(f); f.connect(gn); gn.connect(g);
    src.start(t); src.stop(t + dur + 0.02);
  }

  function crash(t, v){
    var src = AC.createBufferSource(); src.buffer = noiseBufGet();
    var f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 4200;
    var gn = AC.createGain();
    gn.gain.setValueAtTime(v, t);
    gn.gain.exponentialRampToValueAtTime(0.0006, t + 0.85);
    src.connect(f); f.connect(gn); gn.connect(g);
    src.start(t); src.stop(t + 0.9);
  }

  /* 提前 120 毫秒把未来要响的音排进队列，用系统时间驱动而不是帧时间。
     这样即使掉帧，节奏也不会飘。 */
  /* 把「某一步该响什么」单独抽出来。
     游戏内播放和离线导出（renderOffline）共用这一份 ——
     否则导出的试听和游戏里听到的会是两首不同的曲子。 */
  function emitStep(song, step, t, stepDur){
      var bar   = Math.floor(step / 16);
      var s     = step % 16;
      var barIn = bar % 4;
      var sec   = SEC[song.sec[bar % song.bars]];
      var ch    = song.chords[barIn];

      /* 铺底：每小节一次 */
      /* 高潮段 pad 让一档：铺底太厚，旋律再响也会被糊掉 */
      if(sec.pad && s === 0) pad(t, ch, stepDur * 16.4, sec.lead === 2 || sec.lead === 3 ? 0.072 : 0.095);

      /* 低音 */
      if(sec.bass === 1 && s % 4 === 0) bassNote(t, ch[0] - 12, stepDur * 4.0, 0.30);
      else if(sec.bass === 2 && s % 2 === 0) bassNote(t, ch[0] - 12, stepDur * 1.92, 0.27);

      /* 分解和弦。arp 表示「一小节发几次声」。
         用槽位表映射到具体步位，而不是 s % (16/arp)——
         后者只支持能整除 16 的密度（8、16），写 6 会得到 2.67 步，
         取模判断直接失效，整段分解和弦消失。 */
      if(sec.arp){
        var slot = ARP_SLOTS[sec.arp];
        if(slot && slot[s]){
          var ai = slot[s].idx % ch.length;
          var oct = slot[s].oct;
          arpNote(t, ch[ai] + oct, stepDur * 1.1, 0.075);
        }
      }

      /* 旋律 */
      if(sec.lead === 1 && s % 2 === 0){
        var n1 = LEAD_MID[barIn][s / 2];
        if(n1) leadNote(t, n1, stepDur * 1.9, 0.085);
      } else if(sec.lead === 2 || sec.lead === 3){
        /* lead 3 = 高潮第二波（c2）：旋律升八度，音量略压 ——
           高音区本身更抓耳，不压会盖过音效。 */
        var octU = sec.lead === 3 ? 12 : 0;
        /* 原来 0.072 / 0.062，实测高潮段整体 RMS 和主歌几乎一样（0.121 对 0.122）——
           旋律被 bass(0.30) 和 pad 压住了，「抬起来」这件事只写在谱面上，耳朵听不到。
           现在抬到 0.105 / 0.092，让高潮真的比主歌亮一截。 */
        var lvU = sec.lead === 3 ? 0.092 : 0.105;
        if(song.kit === 'heavy'){
          var rb = RIFF_BOSS[barIn][s];
          if(rb) leadNote(t, rb + octU, stepDur * 0.9, lvU * 0.9, true);
        } else if(s % 2 === 0){
          var n2 = LEAD_TOP[barIn][s / 2];
          if(n2) leadNote(t, n2 + octU, stepDur * 1.7, lvU);
        }
      }

      /* 鼓组 */
      if(song.kit === 'heavy'){
        if(sec.kick === 2 && (s % 4 === 0 || s === 6 || s === 14)) kick(t, s % 4 === 0 ? 0.95 : 0.55);
        if(sec.kick === 1 && (s === 0 || s === 8)) kick(t, 0.85);
        if(sec.snare === 2 && (s === 4 || s === 12)) snare(t, 0.34);
        if(sec.snare === 1 && (s === 4 || s === 12)) snare(t, 0.30);
        if(sec.hat === 1 && s % 2 === 0) hat(t, s % 4 === 0 ? 0.085 : 0.05);
        if(sec.hat === 2 && s % 4 === 0) hat(t, 0.055);
      } else {
        if(sec.kick === 1 && (s === 0 || s === 8)) kick(t, 0.85);
        if(sec.kick === 2 && (s === 0 || s === 4 || s === 8 || s === 12)) kick(t, 0.85);
        if(sec.snare === 1 && (s === 4 || s === 12)) snare(t, 0.26);
        if(sec.snare === 2 && (s === 2 || s === 6 || s === 10 || s === 14)) snare(t, 0.22);
        if(sec.hat === 1 && s % 2 === 0) hat(t, 0.07);
        if(sec.hat === 2 && s % 4 === 0) hat(t, 0.05);
      }
      if(sec.crash && s === 0 && bar % 4 === 0) crash(t, 0.16);

  }

  /* 提前 120 毫秒把未来要响的音排进队列，用系统时间驱动而不是帧时间。
     这样即使掉帧，节奏也不会飘。 */
  function schedule(){
    if(!playing || paused || !AC || !g) return;
    var song = SONG[mode];
    var stepDur = (60 / song.bpm) / 4;   // 十六分音符时长
    var guard = 0;
    while(nextTime < AC.currentTime + 0.12 && guard < 48){
      guard++;
      emitStep(song, step, nextTime, stepDur);
      nextTime += stepDur;
      step = (step + 1) % (song.bars * 16);
    }
  }

  return {
    /* ── 离线导出（只给试听用，游戏内不走这条路）──
       OfflineAudioContext 的 currentTime 永远不动，schedule() 的
       「提前 120ms 排队」在离线环境下推进不了，所以这里改成
       一次性把整首排完。排程调用的 emitStep 与游戏内是同一份。 */
    durationOf: function(modeName, loops){
      var s2 = SONG[modeName];
      return s2.bars * 4 * (60 / s2.bpm) * (loops || 1);
    },
    renderOffline: function(ctx, modeName, loops){
      var song2 = SONG[modeName];
      var savedAC = AC, savedG = g, savedNoise = noiseBuf;
      AC = ctx;
      g = ctx.createGain();
      g.gain.value = 0.75;          // 与游戏内 vol(0.21) × 主增益大致等效
      g.connect(ctx.destination);
      noiseBuf = null;              // 噪声 buffer 必须属于新 ctx
      var sd = (60 / song2.bpm) / 4;
      var total = song2.bars * 16 * (loops || 1);
      for(var i=0;i<total;i++){
        emitStep(song2, i % (song2.bars * 16), i * sd, sd);
      }
      AC = savedAC; g = savedG; noiseBuf = savedNoise;
      return ctx.startRendering();
    },
    init: function(){
      if(!AC || g) return;
      g = AC.createGain();
      g.gain.value = 0.0001;
      g.connect(AC.destination);
    },
    /* 把当前应有的音量平滑应用到输出节点 */
    _apply: function(sec){
      if(!g || !AC) return;
      var target = (muted || paused || !playing) ? 0.0001 : vol;
      g.gain.cancelScheduledValues(AC.currentTime);
      g.gain.setValueAtTime(Math.max(g.gain.value, 0.0001), AC.currentTime);
      g.gain.exponentialRampToValueAtTime(Math.max(target, 0.0001), AC.currentTime + (sec || 0.2));
    },
    start: function(m){
      if(!AC) return;
      if(!g) this.init();
      if(!g) return;
      if(playing){ this.setMode(m || mode); return; }
      mode = m || 'menu';
      playing = true;
      startedAt = AC.currentTime;
      paused = false;
      step = 0;
      /* 预排 60ms 就够，原来是 100ms —— 这 0.1 秒是实打实的静音 */
      nextTime = AC.currentTime + 0.06;
      if(timer) clearInterval(timer);
      timer = setInterval(schedule, 25);
      /* 起播增益：直接抬到 62%，再 0.2 秒补满。
         原来这里调 _apply(1.4) 做 1.4 秒指数淡入 —— 从 0.0001 指数爬到 0.21，
         前半段等于静音。实测首秒音量只有峰值的 1.4%，玩家听到的就是「没声」。
         起播时没有「上一段」需要淡出，这个淡入是自己在制造沉默。 */
      if(g && AC){
        var t0 = AC.currentTime;
        var target = (muted || paused) ? 0.0001 : vol;
        g.gain.cancelScheduledValues(t0);
        g.gain.setValueAtTime(Math.max(target * 0.62, 0.0001), t0 + 0.012);
        g.gain.linearRampToValueAtTime(Math.max(target, 0.0001), t0 + 0.22);
      }
    },
    /* 换曲：先压到静音再抬起来，用时 0.6 秒。
       和外部播的「咻」叠在一起，听起来是转场而不是断掉。
       注意这里直接操作 gain，不要走 _apply，否则抬起来会被覆盖。 */
    setMode: function(m){
      if(mode === m) return;
      mode = m;
      step = 0;
      /* 必须先判 AC 再碰它。
         原来这行写在判空之前：如果玩家从没触发过音频初始化
         （浏览器拦截自动播放、或自动化测试里），结算时调用 setMode
         就会抛 "Cannot read properties of null (reading 'currentTime')"，
         直接把 gameOver 打断，结算界面出不来。 */
      if(!AC || !playing || !g) return;
      nextTime = AC.currentTime + 0.1;
      var target = (muted || paused) ? 0.0001 : vol;
      /* 起播后 0.35 秒内就换曲，说明压根没有「上一首」可淡出。
         这时候做 0.09 秒压下 + 0.62 秒抬起，只是把刚出来的声音又抹掉。
         典型场景：玩家第一次交互就是点「开始对战」——菜单曲刚起就被切走。
         这种情况直接接上，0.25 秒补到目标音量。 */
      var fresh = (AC.currentTime - startedAt) < 0.35;
      g.gain.cancelScheduledValues(AC.currentTime);
      if(fresh){
        g.gain.setValueAtTime(Math.max(target * 0.62, 0.0001), AC.currentTime + 0.01);
        g.gain.linearRampToValueAtTime(Math.max(target, 0.0001), AC.currentTime + 0.25);
      } else {
        g.gain.setValueAtTime(Math.max(g.gain.value, 0.0001), AC.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + 0.09);
        g.gain.exponentialRampToValueAtTime(Math.max(target, 0.0001), AC.currentTime + 0.62);
      }
    },
    stop: function(){
      if(!playing) return;
      playing = false;
      if(timer){ clearInterval(timer); timer = null; }
      this._apply(0.35);
    },
    /* 暂停：停掉调度器并淡出。恢复时从当前位置续播，不重头播 */
    pause: function(){
      if(!playing || paused) return;
      paused = true;
      if(timer){ clearInterval(timer); timer = null; }
      this._apply(0.22);
    },
    resume: function(){
      if(!playing || !paused) return;
      paused = false;
      nextTime = AC.currentTime + 0.06;
      if(timer) clearInterval(timer);
      timer = setInterval(schedule, 25);
      this._apply(0.35);
    },
    setVolume: function(v){
      vol = clamp(v, 0, 1);
      this._apply(0.15);
    },
    getVolume: function(){ return vol; },
    setMuted: function(b){
      muted = !!b;
      this._apply(0.18);
    },
    isMuted: function(){ return muted; },
    getMode: function(){ return mode; },
    _tap: function(){ return g; },
    isPlaying: function(){ return playing; },
    isPaused: function(){ return paused; }
  };
})();
function unlockAudio(){
  audioInit();
  if(AC && AC.state === 'suspended') AC.resume();
  /* 浏览器要求用户手势之后才能出声，所以音乐在第一次点击/按键时启动 */
  if(AC && !BGM.isPlaying()) BGM.start('menu');
}
addEventListener('pointerdown', unlockAudio, {once:false});
addEventListener('keydown', unlockAudio, {once:false});

/* ═══════════ 粒子 ═══════════ */
var MAXP = 460;
var pPool = instPool(new THREE.BoxGeometry(0.2, 0.2, 0.2),
  new THREE.MeshBasicMaterial({color:0xffffff}), MAXP);
var pColorOK = true;
var parts = [];
for(var pi=0; pi<MAXP; pi++){ parts.push({on:false,x:0,y:0,z:0,vx:0,vy:0,vz:0,life:0,max:1,size:1,rot:0,vr:0}); }

function burst(x, y, z, color, n, power, size){
  var c = new THREE.Color(color);
  for(var i=0;i<n;i++){
    var p = null;
    for(var j=0;j<MAXP;j++){ if(!parts[j].on){ p = parts[j]; break; } }
    if(!p) return;
    var a = Math.random()*TAU, sp = rnd(power*0.35, power);
    p.on = true; p.x = x; p.y = y; p.z = z;
    p.vx = Math.cos(a)*sp; p.vz = Math.sin(a)*sp; p.vy = rnd(power*0.4, power*1.1);
    p.life = p.max = rnd(0.35, 0.75);
    p.size = (size||1)*rnd(0.6,1.5);
    p.rot = Math.random()*TAU; p.vr = rnd(-9,9);
    p.color = c;
  }
}
function updateParticles(dt){
  var n = 0;
  for(var i=0;i<MAXP;i++){
    var p = parts[i];
    if(!p.on) continue;
    p.life -= dt;
    if(p.life <= 0){ p.on = false; continue; }
    p.vy -= 22*dt;
    p.x += p.vx*dt; p.y += p.vy*dt; p.z += p.vz*dt;
    if(p.y < 0.08){ p.y = 0.08; p.vy *= -0.35; p.vx *= 0.7; p.vz *= 0.7; }
    p.rot += p.vr*dt;
    var k = p.life/p.max;
    _dm.position.set(p.x, p.y, p.z);
    _dm.rotation.set(p.rot, p.rot*0.7, 0);
    _dm.scale.setScalar(p.size * (0.4 + k*0.9));
    _dm.updateMatrix();
    pPool.setMatrixAt(n, _dm.matrix);
    if(pColorOK){
      try{ pPool.setColorAt(n, p.color); }catch(e){ pColorOK = false; }
    }
    n++;
  }
  pPool.count = n;
  pPool.instanceMatrix.needsUpdate = true;
  if(pColorOK && pPool.instanceColor) pPool.instanceColor.needsUpdate = true;
}

  sm.visible = false; sm.frustumCulled = false;

}
function shock(x, z, color, r1, dur){
  for(var i=0;i<shocks.length;i++){
    var s = shocks[i];
    if(s.on) continue;
    s.on = true; s.life = s.max = dur||0.42;
    s.r0 = 0.4; s.r1 = r1||4;
    s.mesh.visible = true;
    s.mesh.position.set(x, 0.08, z);
    s.mesh.material.color.set(color);
    s.mesh.material.opacity = 1;
    return;
  }
}
function updateShocks(dt){
  for(var i=0;i<shocks.length;i++){
    var s = shocks[i];
    if(!s.on) continue;
    s.life -= dt;
    if(s.life <= 0){ s.on = false; s.mesh.visible = false; continue; }
    var k = 1 - s.life/s.max;
    var r = lerp(s.r0, s.r1, Math.pow(k, 0.55));
    s.mesh.scale.setScalar(r);
    s.mesh.material.opacity = (1-k)*0.9;
  }
}

/* ═══════════ 角色建模（六职业） ═══════════
   六个职业共用同一套美术语言（圆头 + 两个黑点眼 + 黑脚 + 卡通描边），
   区别全在躯干轮廓、头饰和随身武器上 —— 剪影一眼能分出谁是谁。
   零件仍然合并成一份几何，只在外轮廓描边（描边用缩放的旧写法会把小部件包黑）。 */
function buildHero(cid){
  var C = heroClass(cid);
  var P = [];
  var body = C.body, acc = C.accent;

  /* 躯干：火药用圆桶身材，其余收腰圆柱 */
  if(C.id === 'bomber'){
    P.push({geo:G_sphere(0.60, 14, 12), color:body, y:0.76, sy:1.02});
    P.push({geo:G_cyl(0.30, 0.38, 0.20, 10), color:acc, y:1.16});
  } else {
    P.push({geo:G_cyl(0.34, 0.52, 0.86, 10), color:body, y:0.55});
  }
  /* 头 / 眼 / 脚：六个职业共用 */
  P.push({geo:G_sphere(0.40, 14, 12), color:0xfff0d0, y:1.26});
  P.push({geo:G_sphere(0.075, 8, 8), color:INK, x:-0.14, y:1.32, z:0.36});
  P.push({geo:G_sphere(0.075, 8, 8), color:INK, x:0.14, y:1.32, z:0.36});
  P.push({geo:G_sphere(0.16, 8, 6), color:INK, x:-0.20, y:0.12});
  P.push({geo:G_sphere(0.16, 8, 6), color:INK, x:0.20, y:0.12});

  if(C.id === 'scatter'){
    /* 散射：头巾 + 双肩甲 + 三段弓（弓身凸向 +Z，弦在后） */
    P.push({geo:G_cone(0.42, 0.34, 8), color:acc, y:1.58, ry:0.4});
    P.push({geo:G_ico(0.20), color:acc, x:-0.42, y:0.86});
    P.push({geo:G_ico(0.20), color:acc, x:0.42, y:0.86});
    P.push({geo:G_box(0.10, 0.64, 0.14), color:0x4a2c6b, x:0.66, y:1.26, z:0.16, rx:-0.50, rz:-0.34});
    P.push({geo:G_box(0.10, 0.64, 0.14), color:0x4a2c6b, x:0.66, y:0.76, z:0.16, rx:0.50, rz:0.34});
    P.push({geo:G_box(0.03, 0.98, 0.03), color:0xfff6e9, x:0.55, y:1.01, z:0.02});
  } else if(C.id === 'blade'){
    /* 连刃：半球盔 + 盔檐 + 方肩 + 背后交叉双刃 */
    P.push({geo:G_sphere(0.42, 14, 10), color:acc, y:1.30, sy:0.74});
    P.push({geo:G_cyl(0.50, 0.46, 0.09, 12), color:acc, y:1.12});
    P.push({geo:G_box(0.28, 0.12, 0.28), color:0x0f2c1e, x:-0.50, y:0.92});
    P.push({geo:G_box(0.28, 0.12, 0.28), color:0x0f2c1e, x:0.50, y:0.92});
    P.push({geo:G_box(0.08, 1.10, 0.08), color:0x4a2c6b, x:-0.46, y:1.30, z:-0.30, rz:0.34});

/* 换职业要换模型：旧几何显式 dispose，否则选六次就漏六份顶点缓冲。 */
function rebuildHeroModel(cid){
  if(hero.obj){
    scene.remove(hero.obj);
    hero.obj.traverse(function(o){ if(o.geometry) o.geometry.dispose(); });
  }
  hero.obj = buildHero(cid);
  hero.obj.position.set(hero.x || 0, 0, hero.z || 0);
  hero.obj.visible = true;
}

/* ═══════════ 难度曲线 ═══════════
   设计原则：单调递增，每波增幅稳定，不做回落。
   · 血量每波 ×1.13（等比）。后期玩家 DPS 涨得快，血量必须跟上，否则一刀秒。
   · 伤害每波 ×1.10（等比）。前期涨得慢玩家没感觉，攒到第 10 波是 2.36 倍，
     配合血量被动收窄（+18/级，满级 190 血），后期容错从 10 下缩到 4 下。
   · 刷怪率每波 +0.10~0.11（等差）。压力主要来自数量，不是单体。
   · BOSS 波（5、10）不靠小怪曲线加难度，BOSS 本身的强度单独算。
   每波内再加 +6% 血 / +5% 伤，避免一波 30 秒内强度完全一样。 */
/* ═══════════ 难度曲线（指数） ═══════════
   依据 TTK 对齐法：先定「打死一只怪要几秒」，再反推血量。
   玩家 DPS 是乘法叠加（武器数 × 等级 × 攻击 × 攻速 × 暴击），
   第 1 波到第 10 波涨约 200 倍，所以敌人血量必须指数追赶。
   原来用线性 ×3，第 4 波就被玩家彻底甩开，之后全是纸。
   R=1.75 是按「小怪 TTK 稳定在 0.2-0.6 秒」反推的，改这个值要重跑数值表。 */
/* 每波血量成长率。1.75 用了很久，问题是它和玩家伤害的成长速度脱钩：
   第 1 波到第 10 波血量涨 154 倍，同一段里玩家单发伤害只涨 6.9 倍。
   于是第 5 波前「一发一只」，第 7 波后突然变成「26 发一只」——
   中间没有过渡，两头都不好玩：前面伤害没用，后面伤害也不够。
   1.40 让第 10 波是 20.7 倍，和伤害成长大致平行，杂兵全程 1-3 发。
   压力改由密度（WAVE_RATE_STEP）和高血量单位（肥球 / 精英）承担。 */
var WAVE_HP_R = 1.40;        // 每波血量成长率
var WAVE_DMG_STEP = 0.10;    // 每波伤害 +10%（等差，伤害涨太快会直接要命）
/* 每波刷怪率。原来 +9%/波，第 10 波是 1.81 倍；
   但实测清怪速率在第 5 波之后就饱和在 4-5 只/秒（受「怪走过来的速度」和
   「一次攻击能碰到几只」限制，不是受伤害限制），刷怪却还在往上冲，
   于是第 8 波之后场上堆到八九十只，玩家只能逃。现在压到 +5%。 */
var WAVE_RATE_STEP = 0.05;   // 每波刷怪率 +5%

function waveCurve(wave, prog){
  var w = clamp(wave, 1, 10);
  var p = clamp(prog || 0, 0, 1);
  return {
    hp:   Math.pow(WAVE_HP_R, w - 1) * (1 + 0.06*p),
    dmg:  (1 + WAVE_DMG_STEP*(w - 1)) * (1 + 0.05*p),
    rate: 1 + WAVE_RATE_STEP*(w - 1)
  };
}

/* ═══════════ 几何拼装 ═══════════
   把多个基础几何按位置/旋转/缩放拼成一个带顶点色的几何。
   好处：造型复杂了，但一个小怪仍然只有 1 个 draw call（本体）+ 1 个（描边）。
   顶点色让一个材质能画出身体、眼睛、牙齿等不同颜色的部件。 */
function mergeParts(parts){
  var pos = [], nor = [], col = [];
  var v = new THREE.Vector3(), q = new THREE.Quaternion(),
      e = new THREE.Euler(), s = new THREE.Vector3(), m = new THREE.Matrix4();
  var c = new THREE.Color();
  for(var i=0;i<parts.length;i++){
    var p = parts[i];
    var g = p.geo.index ? p.geo.toNonIndexed() : p.geo.clone();
    v.set(p.x||0, p.y||0, p.z||0);
    e.set(p.rx||0, p.ry||0, p.rz||0);
    q.setFromEuler(e);
    s.set(p.sx==null?1:p.sx, p.sy==null?1:p.sy, p.sz==null?1:p.sz);
    m.compose(v, q, s);
    g.applyMatrix4(m);
    var pa = g.attributes.position.array;
    var na = g.attributes.normal ? g.attributes.normal.array : null;
    c.set(p.color);
    for(var j=0;j<pa.length;j+=3){
      pos.push(pa[j], pa[j+1], pa[j+2]);
      if(na) nor.push(na[j], na[j+1], na[j+2]);
      else nor.push(0, 1, 0);
      col.push(c.r, c.g, c.b);
    }
    g.dispose();
  }
  var out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  out.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  return out;
}
function toonVC(){
  return new THREE.MeshToonMaterial({color:0xffffff, gradientMap:GRAD, vertexColors:true});
}
/* 沿法线外扩固定距离生成描边几何。
   比整体缩放好在：粗细均匀，小部件不会被过度膨胀。 */
function outlineGeo(geo, dist){
  var g = geo.clone();
  var p = g.attributes.position, nr = g.attributes.normal;
  if(!nr) return g;
  for(var i=0;i<p.count;i++){
    p.setXYZ(i,
      p.getX(i) + nr.getX(i)*dist,
      p.getY(i) + nr.getY(i)*dist,
      p.getZ(i) + nr.getZ(i)*dist);
  }
  p.needsUpdate = true;
  return g;
}

function makeChunk(){

     球自己把脸挡住了，画面上就是一个纯黄色圆盘，玩家认不出是怪。

  // 裂口：中心 z=0.80，深 0.36 → 前表面 0.98，凸出球面 0.13

  // 短腿：放到球体底部两侧外面（原来 y=0.20 埋在球里，只露一点像耳朵）
  P.push({geo:G_sphere(0.19), color:COS.pur, x:-0.42, y:0.10, z:0.04});

function spawnEnemy(type, x, z, opts){
  opts = opts || {};
  var d = ETYPES[type];
  var list = E[type];
  if(list.length >= 90) return null;
  var c = waveCurve(S.wave, S.waveLen ? S.waveT/S.waveLen : 0);
  var elite = !!opts.elite;
  /* 精英按 8 倍血。原来 5.5 倍在后期失效——玩家 DPS 翻倍后
     精英只多撑半秒，就不再是「值得绕开」的目标了。 */
  var hpMul = c.hp * (opts.hpMul || 1) * (elite ? 8.0 : 1);
  var dmgMul = c.dmg * (elite ? 1.7 : 1);
  var e = {
    t:type, x:x, z:z, y:d.y,
    hp:d.hp*hpMul, maxhp:d.hp*hpMul,
    spd:d.spd*(1 + (S.wave-1)*0.028)*(elite?0.86:1),
    r:d.r*(elite?1.32:1), dmg:d.dmg*dmgMul, xp:d.xp*(elite?6:1),
    ang:0, hit:0, cd:rnd(0.6,2.4), phase:Math.random()*TAU, wind:0, windMax:0.45,
    dead:false, boss:false, elite:elite, offs:rnd(-0.55,0.55)
  };
  list.push(e);
  return e;
}
