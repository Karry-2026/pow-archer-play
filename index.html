var eliteRingIdx = 0;
function renderEnemies(){
  eliteRingIdx = 0;
  warnIdx = 0;
  for(var k=0;k<4;k++){
    var key = EKEYS[k], list = E[key], m = eMesh[key], d = ETYPES[key];
    var n = 0;
    for(var i=0;i<list.length;i++){
      var e = list[i];
      if(e.dead) continue;
      var hs = (1 + e.hit*0.34) * (d.s || 1);
      var bob = Math.sin(S.t*4 + e.phase)*0.08;
      if(e.elite && eliteRingIdx < 24){
        _dm.position.set(e.x, 0.09, e.z);
        _dm.rotation.set(0, S.t*1.9 + e.phase, 0);
        _dm.scale.setScalar(e.r * 2.7);
        _dm.updateMatrix();
        eliteRing.setMatrixAt(eliteRingIdx++, _dm.matrix);
      }
      /* 投掷手蓄力：地面圈从 2.8 收到 1.1，越接近开火越小 */
      if(e.wind > 0 && warnIdx < 40){
        var wp = 1 - e.wind / (e.windMax || 0.45);
        _dm.position.set(e.x, 0.08, e.z);
        _dm.rotation.set(0, 0, 0);
        _dm.scale.setScalar(2.8 - wp * 1.7);
        _dm.updateMatrix();
        warnPool.setMatrixAt(warnIdx++, _dm.matrix);
      }
      _dm.position.set(e.x, e.y + bob, e.z);
      _dm.rotation.set(0, e.ang, 0);
      /* 坑：原来这里是 _dm.rotation.x = e.phase，而 phase 是 0~2π 的随机角。
         转到 90° 就横躺、180° 就完全倒立，整个模型沉到地板以下，
         俯视只能看到地面上那个独立的贴地阴影——就是「怪隐形了，只剩阴影」。
         改成小幅摆动：保留一点翻滚的动感，但幅度锁在 ±8°，永远不会翻倒。 */
      if(key === 'spiker') _dm.rotation.x = Math.sin(S.t*6 + e.phase) * 0.14;
      _dm.scale.setScalar(hs);
      _dm.updateMatrix();
      m.body.setMatrixAt(n, _dm.matrix);
      _dm.scale.setScalar(hs * d.out);
      _dm.updateMatrix();
      m.out.setMatrixAt(n, _dm.matrix);
      n++;
      pushShadow(e.x, e.z, e.r*1.05, 0.3);
    }
    m.body.count = n; m.out.count = n;
    m.body.instanceMatrix.needsUpdate = true;
    m.out.instanceMatrix.needsUpdate = true;
  }
  eliteRing.count = eliteRingIdx;
  eliteRing.instanceMatrix.needsUpdate = true;
  warnPool.count = warnIdx;
  warnPool.instanceMatrix.needsUpdate = true;
}

/* ═══════════ BOSS ═══════════ */
var boss = null;
/* ═══════════ 两个 BOSS ═══════════
   第 5 波：裂口巨兽 —— 四足爬行，靠冲锋和震地压人，近身威胁大
   第 10 波：千手墨神 —— 人形浮空，八臂展开，远程弹幕为主，会瞬移

   两个从外形到行为都不同：一个贴地、一个悬浮；一个追你、一个躲你；
   一个靠身体撞、一个靠弹幕封走位。玩家换打法，不是换血条数字。
*/
function buildBoss(x, z, hp, kind){
  var g = new THREE.Group();
  var baseY;

  /* 两个模型都按「俯视构图」重排过一次。
     第一版是按正面视角搭的：嘴朝前、手臂往后，结果相机在正上方往下看，
     嘴埋在身体里、八条手臂全被躯干挡住，看上去只是一个紫色团块。
     现在所有辨识特征都摊在水平面上：巨兽的嘴是俯视可见的 V 形开口，
     墨神的八条手臂是放射状平铺。 */

  if(kind === 'hands'){
    /* ══ 千手墨神 ══
       俯视看是一朵八瓣放射的花：中心躯干，八条青色手臂平铺向外，
       末端是黄色爪。这样从任何角度都能立刻认出「千手」两个字。 */
    /* 手臂原来用青色，和浅蓝地面同色系，八条「千手」几乎看不见。
       珊瑚红在冷色背景上是最跳的暖色，也正是「危险」的职能色。 */
    var BODY = 0x3b2a72, ARM = COS.coral, EYE = 0xffe600;
    baseY = 3.0;

    /* 躯干：上细下粗的柱，俯视是一个圆 */
    var torso = part(new THREE.CylinderGeometry(0.66, 0.98, 2.1, 12), BODY, 1.05);
    torso.position.y = 0.1; g.add(torso);

    /* 肩盘：把八条手臂的根部收在一个明显的圆盘上 */
    var shoulder = part(new THREE.CylinderGeometry(0.86, 0.78, 0.34, 12), 0x241a4a, 1.04);
    shoulder.position.y = 1.18; g.add(shoulder);

    /* 头 + 一只竖着的黄眼 */
    var head = part(new THREE.SphereGeometry(0.6, 14, 12), BODY, 1.05);
    head.position.y = 1.62; g.add(head);
    var eye = new THREE.Mesh(new THREE.SphereGeometry(0.33, 12, 10),
      new THREE.MeshBasicMaterial({color: EYE}));
    eye.scale.set(0.72, 1.3, 0.8);
    eye.position.set(0, 1.66, 0.42); g.add(eye);
    var pupil = new THREE.Mesh(new THREE.SphereGeometry(0.125, 10, 8),
      new THREE.MeshBasicMaterial({color: 0x0a0a12}));
    pupil.position.set(0, 1.66, 0.66); g.add(pupil);
    g.userData.pupil = pupil;

    /* 裙摆：开口锥体，营造「飘浮」的感觉 */
    var skirt = part(new THREE.ConeGeometry(1.05, 2.1, 12, 1, true), BODY, 1.04);
    skirt.position.y = -1.15; skirt.rotation.x = Math.PI;
    g.add(skirt);

    /* 八条手臂：以 45° 间隔平铺，本地 +z 指向外。
       每只手两段 + 一个爪，长短错开形成层次。 */
    g.userData.arms = [];
    for(var i2=0;i2<8;i2++){
      var ang = i2 / 8 * TAU;
      var arm = new THREE.Group();
      arm.position.set(Math.sin(ang) * 0.78, 1.14 + (i2 % 2) * 0.16, Math.cos(ang) * 0.78);
      arm.rotation.y = ang;

      var lower = part(new THREE.BoxGeometry(0.19, 0.19, 1.5), ARM, 1.0);
      lower.position.z = 0.75; arm.add(lower);

      var elbow = part(new THREE.SphereGeometry(0.14, 8, 6), EYE, 1.0);
      elbow.position.z = 1.5; arm.add(elbow);

      /* 第二段向外再折一下，末端张开更宽 */
      var upper = part(new THREE.BoxGeometry(0.15, 0.15, 1.0), ARM, 1.0);
      upper.position.set(0, 0, 1.98);
      upper.rotation.y = 0.42 * (i2 % 2 ? 1 : -1);
      arm.add(upper);

      var claw = part(new THREE.ConeGeometry(0.21, 0.72, 5), EYE, 1.0);
      claw.position.set(0.18 * (i2 % 2 ? 1 : -1), 0, 2.5);
      claw.rotation.x = Math.PI / 2;
      arm.add(claw);

      /* 记下基准角和摆动相位。
         坑：v2 的模型没写 userData.rz，而 updateHandsBoss 里算的是
         arm.rotation.z = userData.rz + 摆动值 → undefined + 数字 = NaN，
         矩阵直接失效，八条手臂一个都不渲染。 */
      arm.userData.baseAng = ang;
      arm.userData.phase = i2 * 0.8;
      g.add(arm);
      g.userData.arms.push(arm);
    }

    /* 两圈反向旋转的能量环 */
    var h1 = new THREE.Mesh(new THREE.TorusGeometry(2.55, 0.07, 6, 40),
      new THREE.MeshBasicMaterial({color: COS.coral, transparent:true, opacity:0.8}));
    h1.rotation.x = Math.PI/2; h1.position.y = -1.95; g.add(h1);
    var h2 = new THREE.Mesh(new THREE.TorusGeometry(1.85, 0.055, 6, 36),
      new THREE.MeshBasicMaterial({color: COS.mag, transparent:true, opacity:0.75}));
    h2.rotation.x = Math.PI/2; h2.position.y = -2.3; g.add(h2);
    g.userData.ring1 = h1; g.userData.ring2 = h2;

  } else {
    /* ══ 裂口巨兽 ══
       俯视构图：一张巨大的紫色圆饼，正前方挖开一个红色大嘴，
       嘴沿排一圈白牙，两只黄眼在嘴后方。
       前两版失败的原因都是「嘴朝向相机看不到的方向」——
       相机在正上方偏后，向前伸的嘴被自己的身体挡住。
       现在嘴开在水平面上，占身体三分之一的面积，俯视就是一张脸。 */
    var BODY2 = 0x3d1a5e, GUM = 0xc0164e, TOOTH = 0xfff6e9, EYE2 = 0xffe600;
    baseY = 2.0;

    /* 躯干：厚圆饼，边缘用略深的颜色压一圈，形成轮廓层次 */
    var body = part(new THREE.CylinderGeometry(1.75, 1.6, 0.85, 16), BODY2, 1.03);
    body.position.set(0, 0, -0.55);
    g.add(body);

    /* 头部平台：向前伸出一段，承载嘴巴 */
    var snout = part(new THREE.CylinderGeometry(1.28, 1.45, 0.62, 14), 0x2c1145, 1.03);
    snout.position.set(0, 0.06, 1.45);
    g.add(snout);

    /* 口腔：圆形深红坑，是俯视的第一视觉焦点 */
    var gum = new THREE.Mesh(new THREE.CylinderGeometry(1.02, 0.9, 0.34, 18),
      new THREE.MeshBasicMaterial({color: GUM}));
    gum.position.set(0, 0.44, 1.6);
    g.add(gum);
    /* 口腔内圈再压一层更深的色，看起来有纵深 */
    var throat = new THREE.Mesh(new THREE.CylinderGeometry(0.56, 0.34, 0.26, 14),
      new THREE.MeshBasicMaterial({color: 0x3a0417}));
    throat.position.set(0, 0.52, 1.6);
    g.add(throat);
    g.userData.jawD = gum;

    /* 牙齿：沿口腔圆周均匀排 10 颗，全部朝圆心咬 */
    for(var t3=0;t3<10;t3++){
      var ta = t3 / 10 * TAU;
      var tooth = part(new THREE.ConeGeometry(0.15, 0.52, 4), TOOTH, 1.0);
      tooth.position.set(
        Math.sin(ta) * 1.06,
        0.5,
        1.6 + Math.cos(ta) * 1.06
      );
      /* 锥体默认朝 +Y，往前倒 90° 让它横着指向圆心 */
      tooth.rotation.set(Math.PI/2, 0, 0);
      tooth.rotation.y = ta;
      g.add(tooth);
    }

    /* 两只大眼，在嘴后方两侧，俯视清晰可见 */
    [[-1.32, 0.62, 0.5], [1.32, 0.62, 0.5]].forEach(function(p5){
      var ey = new THREE.Mesh(new THREE.SphereGeometry(0.26, 12, 10),
        new THREE.MeshBasicMaterial({color: EYE2}));
      ey.position.set(p5[0], p5[1], p5[2]);
      g.add(ey);
      var pu = new THREE.Mesh(new THREE.SphereGeometry(0.11, 8, 6),
        new THREE.MeshBasicMaterial({color: 0x0a0a12}));
      pu.position.set(p5[0], p5[1] + 0.02, p5[2] + 0.2);
      g.add(pu);
    });

    /* 背脊：五根洋红尖刺沿中线往后，俯视是几颗亮点 */
    for(var sp3=0;sp3<5;sp3++){
      var spike2 = part(new THREE.ConeGeometry(0.19, 0.9 - sp3*0.1, 5), COS.mag, 1.0);
      spike2.position.set(0, 0.58, -0.2 - sp3 * 0.5);
      g.add(spike2);
    }

    /* 四条腿：从饼的边缘向外伸，落地 */
    [[-1.55, 0.15], [1.55, 0.15], [-1.45, -1.35], [1.45, -1.35]].forEach(function(p6){
      var leg = part(new THREE.BoxGeometry(0.36, 1.5, 0.36), 0x22103a, 1.03);
      leg.position.set(p6[0], -0.72, p6[1]);
      leg.rotation.z = p6[0] > 0 ? -0.26 : 0.26;
      g.add(leg);
      var foot = part(new THREE.BoxGeometry(0.46, 0.24, 0.62), 0x22103a, 1.03);
      foot.position.set(p6[0] * 1.2, -1.44, p6[1] + 0.06);
      g.add(foot);
    });

    /* 贴地暗环 */
    var ring = new THREE.Mesh(new THREE.RingGeometry(2.15, 2.85, 32),
      new THREE.MeshBasicMaterial({color: COS.mag, transparent:true, opacity:0.32,
        side:THREE.DoubleSide, depthWrite:false}));
    ring.rotation.x = -Math.PI/2; ring.position.set(0, -1.5, -0.3);
    g.add(ring);
    g.userData.ring1 = ring;
  }

  g.scale.setScalar(1.15);
  g.position.set(x, baseY - 6, z);

  /* 阶段护盾挂在 BOSS 身上，默认隐藏；无敌期间才亮 */
  var shield = makeBossShield(kind === 'hands' ? 3.0 : 3.4,
                              kind === 'hands' ? 0x00e5ff : 0xff2e88);
  shield.position.y = 0.4;
  g.add(shield);

  scene.add(g);

  return {
    obj: g, x: x, z: z, hp: hp, maxhp: hp,
    kind: kind,
    r: kind === 'hands' ? 2.1 : 2.3,
    dmg: kind === 'hands' ? 24 : 30,
    baseY: baseY,
    ang: 0, t: 0, dead: false, boss: true,
    rise: 1.5, riseMax: 1.5,
    state: 'idle', stateT: 0,
    cd: 2.2, dashCd: 3.4, slamCd: 5.5, tpCd: 5.0, orbCd: 3.6,
    dashDir: {x:0, z:1},
    rage: false, phase2: false, phase3: false, invulnT: 0, shield: shield,
    dmgTaken: 0, calibT: 0, calibrated: false, dmgWindow: 25
  };
}

/* 阶段护盾：线框球，只在无敌期间出现。
   没有它的话「打不动」会被读成 bug；有了它就是明确的「先破壳」信号。 */
function makeBossShield(r, col){
  var m = new THREE.Mesh(
    new THREE.SphereGeometry(r, 14, 10),
    new THREE.MeshBasicMaterial({color: col, wireframe:true, transparent:true,
                                 opacity:0.3, depthWrite:false})
  );
  m.visible = false;
  m.renderOrder = 5;
  return m;
}

function killBoss(){
  if(!boss) return;
  burst(boss.x, 2.2, boss.z, COS.mag, 40, 15, 1.6);
  shock(boss.x, boss.z, COS.yel, 12, 0.7);
  scene.remove(boss.obj);
  shock(boss.x, boss.z, COS.cyn, 18, 1.0);
  flash(0.55);
  shake(0.8);
  SFX.boss();
  BGM.setMode('battle');
  bossBar.style.display = 'none';
  boss = null;
}

/* ═══════════ 子弹 ═══════════ */
var bulA = instPool(new THREE.BoxGeometry(0.17, 0.17, 1),
  new THREE.MeshBasicMaterial({color:0x9ff6ff}), 300);
/* 玩家弹走冷色，把洋红整条让给「敌方威胁」。
   这样一眼就能判断「这一片是我打的还是冲我来的」。
   ⚠️ 但冷色只有一个色相就会出问题：箭（青白）、炸弹、飞镖原本挤在同一个池子里，
   全是青绿，玩家根本分不清自己在放什么 —— 所以每种投掷物单独一个池、单独一个色。 */
var bulB = instPool(new THREE.OctahedronGeometry(0.24, 0),
  new THREE.MeshBasicMaterial({color:0xff3b30}), 240);   // 炸弹：橙红
/* 激光单独一个池。
   原来激光和箭都走 bulA（青白），玩家反馈「激光和箭雨一个色系」——
   根因不是配色表，是它们真的共用同一份材质。

   颜色取自围墙石头的蓝 0x4fb3e8，压暗降饱和到 #4a7fb8：
   正红（上一版）明度太高，在一片粉蓝地面里太扎眼；石蓝既在场景色系里，
   又比青白的箭矢暗两档，同屏一眼能分开。 */
var bulD = instPool(new THREE.BoxGeometry(0.17, 0.17, 1),
  new THREE.MeshBasicMaterial({color:0x4a7fb8}), 240);   // 激光：石蓝

/* ── 飞镖 ──
   三条线里它最需要「看得见」：飞行路线是弧线、还会折回来，
   玩家必须在余光里就能跟住它。所以做了三件事：
     ① 形状换成四刃十字星（箭是细长条，形状上先分开）
     ② 颜色换成亮橙（蓝色地面上的互补色，色相离箭的青色最远）
     ③ 三层描边：黑边保证任何背景都有轮廓，白心保证有亮点、橙体保证有颜色 */
function makeShurikenGeo(R, r){
  /* 手写顶点，不用 ShapeGeometry。
     Shape 三角化在 r150 下会把这种交替长短半径的星形判成退化多边形，
     结果是「池子 count 正常、画面上什么都没有」——排查起来极费时间，
     不如直接给 8 个外点 + 1 个中心点做三角扇。
     顶点直接铺在 XZ 平面（y=0），从俯视角看就是一枚躺平的星。 */
  var pts = [];
  for(var i=0;i<8;i++){
    var a = i/8*TAU + Math.PI/8;
    var rad = (i % 2 === 0) ? R : r;
    pts.push(Math.cos(a)*rad, 0, Math.sin(a)*rad);
  }
  pts.push(0, 0, 0);                       // 中心点，索引 8
  var idx = [];
  for(var j=0;j<8;j++) idx.push(8, j, (j+1)%8);
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  g.computeBoundingSphere();
  return g;
}
var SHU_COL = 0xff8a1f;
var shuOutlinePool = instPool(makeShurikenGeo(0.73, 0.235),
  new THREE.MeshBasicMaterial({color:0x0a0a12, side:THREE.DoubleSide}), 120);
var shuBodyPool = instPool(makeShurikenGeo(0.66, 0.212),
  new THREE.MeshBasicMaterial({color:SHU_COL, side:THREE.DoubleSide}), 120);
var shuCorePool = instPool(makeShurikenGeo(0.26, 0.085),
  new THREE.MeshBasicMaterial({color:0xfff3e0, side:THREE.DoubleSide}), 120);
var shuTrailPool = instPool(new THREE.OctahedronGeometry(0.17, 0),
  new THREE.MeshBasicMaterial({color:SHU_COL, transparent:true, opacity:0.30,
                               depthWrite:false}), 260);
/* 轨迹不靠「记录经过的点」来画 —— 那套依赖帧率，低帧下会断成一地碎屑。
   改成每次渲染直接按参数方程反算整条弧上的位置，永远是一条连续的线。 */
var shuPathPool = instPool(new THREE.OctahedronGeometry(0.19, 0),
  new THREE.MeshBasicMaterial({color:0xffd28a, transparent:true, opacity:0.72,
                               depthWrite:false}), 320);
var bulletsC = [];   // 飞镖单独一条队列
var bulletsD = [];   // 激光单独一条队列
/* ── 敌方弹幕：四层结构，专门为「看得见」设计 ──
   ① 黑壳（BackSide，放大 1.5）：任何亮背景上都有墨线轮廓，灰阶也成立
   ② 洋红本体：危险色独占色相，不再和金色经验球、金色爆炸撞车
   ③ 粉白内核：命中前一瞬间最亮的参照点
   ④ 两段拖尾：能看出「从哪来、往哪去」
   全部关掉 depthTest 并提高 renderOrder —— 弹幕永远画在粒子、爆炸、角色之上，
   这是弹幕游戏的通则（Boghog《Bullet Hell Shmup 101》）。 */
var eBulShell = instPool(new THREE.OctahedronGeometry(0.30, 0),
  new THREE.MeshBasicMaterial({color:0x0a0a12, side:THREE.BackSide, depthTest:false, depthWrite:false}), 200);
var eBulBody = instPool(new THREE.OctahedronGeometry(0.30, 0),
  new THREE.MeshBasicMaterial({color:0xff2e88, depthTest:false, depthWrite:false}), 200);
var eBulCore = instPool(new THREE.OctahedronGeometry(0.12, 0),
  new THREE.MeshBasicMaterial({color:0xffe0ec, depthTest:false, depthWrite:false}), 200);
var eBulTrail = instPool(new THREE.OctahedronGeometry(0.21, 0),
  new THREE.MeshBasicMaterial({color:0xff2e88, transparent:true, opacity:0.34,
                               depthTest:false, depthWrite:false}), 400);
[eBulShell, eBulBody, eBulCore, eBulTrail].forEach(function(m){ m.renderOrder = 8; });
var bullets = [], bulletsB = [], eBullets = [];

function spawnBullet(o){
  var b = {
    x:o.x, y:o.y==null?1.0:o.y, z:o.z, vx:o.vx||0, vz:o.vz||0, vy:o.vy||0,
    dmg:o.dmg, life:o.life||1.6, r:o.r||0.34, pierce:o.pierce||0,
    kind:o.kind||'arrow', spin:o.spin||0, ang:0, hitList:null, homing:o.homing||0,
    wob:o.wob||0, phase:Math.random()*TAU, grow:o.grow||0
  };
  if(b.pierce>0) b.hitList = [];
  var arr = o.pool === 'B' ? bulletsB : (o.pool === 'C' ? bulletsC : (o.pool === 'D' ? bulletsD : bullets));
  arr.push(b);
  return b;
}
function spawnEBullet(x, z, vx, vz, dmg){
  eBullets.push({x:x, y:1.0, z:z, vx:vx, vz:vz, dmg:dmg, life:3.4, r:0.4,
                 phase:Math.random()*TAU, born:0,
                 sp: Math.hypot(vx, vz) || 1});
}

/* ═══════════ 经验宝石 ═══════════ */
/* 经验球：金色八面体 + 白色内核。
   金色和蓝灰地面是色相环上的互补对（蓝 vs 橙），
   同时明度比地面高、饱和度比地面高，三个维度同时拉开。
   白色内核让它在任何背景上都有一个「亮心」，不依赖色相也能认出来。 */
/* 三层结构：黑壳 + 金体 + 白核。
   为什么非要加黑壳：灰阶测试里，金色（明度 84）和地面（82）只差 2，
   转成灰度后经验球直接消失。只有黑边能在任何背景上保证轮廓，
   这也是美漫的通用解法——所有东西都有墨线。 */
var gemOutPool = instPool(new THREE.OctahedronGeometry(0.30, 0),
  new THREE.MeshBasicMaterial({color:0x0a0a12, side:THREE.BackSide}), 260);

/* ═══════════ 天降落箭（弓箭超武「暴雨模式」） ═══════════
   常态射击是「一条弹道打出去」，超武要做的是「整块地面同时被插满」——
   覆盖方式变了，玩家才看得出这是在放必杀，而不是攻速快了一点。 */
var skyArrows = [];
/* 落箭必须做成「深杆 + 亮头」而不是一根白棒子。
   背景本来就是浅蓝灰，超武染色之后整屏更亮 —— 白色物体会直接消失。
   这是美漫那套「所有东西都有墨线」的同一个道理，只是换成深色杆身。 */
var skyArrowPool = instPool(new THREE.BoxGeometry(0.13, 1.7, 0.13),
  new THREE.MeshBasicMaterial({color:0x0b2f45}), 170);
var skyArrowTipPool = instPool(new THREE.ConeGeometry(0.30, 0.62, 6),
  new THREE.MeshBasicMaterial({color:0xffe600}), 170);
var skyArrowGlow = instPool(new THREE.OctahedronGeometry(0.34, 0),
  new THREE.MeshBasicMaterial({color:0x00e5ff, transparent:true, opacity:0.6,
                               depthWrite:false}), 170);

function dropSkyArrow(dmg){
  if(skyArrows.length > 140) return;
  var ang = Math.random()*TAU;
  var rr = 1.4 + Math.sqrt(Math.random())*11.2;
  skyArrows.push({
    x: hero.x + Math.cos(ang)*rr,
    z: hero.z + Math.sin(ang)*rr,
    y: 0, h0: 9.5 + Math.random()*3.2,
    t: 0, land: 0.22 + rr*0.010, k: 0,
    dmg: dmg, r: 1.25
  });
}

function updateSkyArrows(dt){
  for(var i=skyArrows.length-1;i>=0;i--){
    var a = skyArrows[i];
    a.t += dt;
    a.k = Math.min(1, a.t / a.land);
    /* 二次曲线下落：起手慢、触地快，比匀速更像被重力拽下来 */
    a.y = a.h0 * (1 - a.k*a.k);
    if(a.t < a.land) continue;

    skyArrows.splice(i, 1);
    forEachEnemy(function(e){
      if(dist2(a.x, a.z, e.x, e.z) < (a.r + e.r)*(a.r + e.r)) hurtEnemy(e, a.dmg, false);
    });
    if(boss && !boss.dead && dist2(a.x, a.z, boss.x, boss.z) < (a.r + boss.r)*(a.r + boss.r)){
      hurtEnemy(boss, a.dmg, false);
    }
    shock(a.x, a.z, 0xffe600, 1.5, 0.16);
    burst(a.x, 0.45, a.z, 0xffe600, 4, 6.5, 0.5);
  }
}

function renderSkyArrows(){
  var n = 0;
  for(var i=0;i<skyArrows.length && n < 170;i++){
    var a = skyArrows[i];
    var yy = Math.max(0.75, a.y);
    _dm.rotation.set(0, 0, 0);

    /* 箭杆：高空时拉长，像一道落下来的光 */
    _dm.position.set(a.x, yy, a.z);
    _dm.scale.set(1, 1 + (1 - a.k) * 1.5, 1);
    _dm.updateMatrix();
    skyArrowPool.setMatrixAt(n, _dm.matrix);

    /* 箭头：接在杆子下方，锥尖朝下 */
    _dm.position.set(a.x, Math.max(0.45, yy - 0.9 - (1 - a.k) * 0.9), a.z);
    _dm.rotation.set(Math.PI, 0, 0);
    _dm.scale.setScalar(1);
    _dm.updateMatrix();
    skyArrowTipPool.setMatrixAt(n, _dm.matrix);

    _dm.position.set(a.x, yy + 0.5, a.z);
    _dm.rotation.set(0, 0, 0);
    _dm.scale.setScalar(0.8);
    _dm.updateMatrix();
    skyArrowGlow.setMatrixAt(n, _dm.matrix);
    n++;
  }
  skyArrowPool.count = n; skyArrowPool.instanceMatrix.needsUpdate = true;
  skyArrowTipPool.count = n; skyArrowTipPool.instanceMatrix.needsUpdate = true;
  skyArrowGlow.count = n; skyArrowGlow.instanceMatrix.needsUpdate = true;
}

var ultWashEl = $('ultwash');
var _ultWashTimers = [];
function ultWash(col, peak, hold, total){
  for(var i=0;i<_ultWashTimers.length;i++) clearTimeout(_ultWashTimers[i]);

  ultWashEl.style.opacity = peak;
  _ultWashTimers.push(setTimeout(function(){ ultWashEl.style.opacity = hold; }, 150));
  _ultWashTimers.push(setTimeout(function(){ ultWashEl.style.opacity = 0; }, total));
}

var _ultUiLast = -1, _ultUiReady = null;
function updateUltUI(force){
  var box = $('ultbox');
  if(!box) return;
  if(!hero.evoId){ box.classList.add('off'); return; }
  box.classList.remove('off');
  var u = ULT[hero.evoId];
  /* 只在变化超过 2% 或「满/未满」切换时写 DOM。
     每帧无脑写 style/textContent 会强制样式重算，软渲染下能掉一半帧。 */
  var ready = hero.ult.charge >= 1;
  if(!force && Math.abs(hero.ult.charge - _ultUiLast) < 0.02 && ready === _ultUiReady) return;
  _ultUiLast = hero.ult.charge; _ultUiReady = ready;
  var ring = $('ultring');
  var C = 257.6;
  ring.style.strokeDashoffset = (C * (1 - clamp(hero.ult.charge, 0, 1))).toFixed(1);
  ring.style.stroke = u.col;
  $('ulticon').textContent = u.name;
  $('ultkey').textContent = hero.ult.charge >= 1
    ? (isTouchDevice() ? '点我' : '空格 释放')
    : Math.round(hero.ult.charge*100) + '%';
  box.classList.toggle('ready', hero.ult.charge >= 1);
}

/* 沿一条射线结算：宽度 halfW，射程 60 */
function damageBeam(x, z, ang, halfW, dmg){
  var dx = Math.sin(ang), dz = Math.cos(ang);
  function hit(e){
    var rx = e.x - x, rz = e.z - z;
    var along = rx*dx + rz*dz;
    if(along < 0 || along > 60) return;
    var perp = Math.abs(rx*dz - rz*dx);
    if(perp <= halfW + e.r) hurtEnemy(e, dmg, false);
  }
  forEachEnemy(hit);
  if(boss && !boss.dead) hit(boss);
}

/* 手机点蓄力环释放。
   原来这里只有空格键，触屏上那个圆环只是画着好看，点它没有任何反应。 */
function bindUltTap(){
  var el = $('ultbox');
  if(!el) return;
  el.addEventListener('pointerdown', function(e){
    e.preventDefault();
    e.stopPropagation();
    triggerUlt();
  });
}

function triggerUlt(){
  if(S.mode !== 'play') return;
  if(!hero.evoId){ toast('先拿到超武才能蓄力', '#ff2e88'); return; }
  if(hero.ult.charge < 1){
    toast('蓄力 ' + Math.round(hero.ult.charge*100) + '%', '#cfd6e4');
    return;
  }
  var id = hero.evoId, u = ULT[id];
  hero.ult.charge = 0;
  hero.ult.active = u.dur;
  var a = hero.ang || 0;
  var tgt = nearestEnemy(hero.x, hero.z, 30);
  if(tgt) a = Math.atan2(tgt.x - hero.x, tgt.z - hero.z);

  var base = WDEF[id].dmg[4] * hero.stat.arch[WDEF[id].arch];

  ultOpening(id, u);

  if(id === 'laser'){
    /* 过载贯穿：一条 4 倍宽的贯穿光柱，0.55 秒内每 0.1 秒结算一次 */
    hero.ult.ang = a;
    hero.ult.beamTick = 0;
    ultBeam.visible = true; ultBeamCore.visible = true;
    ultBeam.material.color.set(u.col);
    speedLines(0.95, 620);
    shake(0.4);
    SFX.laser(); SFX.boss();

  } else if(id === 'bow'){
    /* 暴雨模式：1.8 秒内，玩家周围整片战场持续落箭。
       原来是「攻速 ×1.8」，玩家看到的还是同一条弹道，只是快了点 ——
       后期 DPS 本来就高，这点提速根本看不出来。现在改成真正的天降落箭：
       屏幕内每一片区域都有箭插下来，形态和常态射击完全不同。 */
    hero.ult.rainT = 0;
    hero.ult.rainDmg = base * 0.32;
    SFX.whooshUp ? SFX.whooshUp() : SFX.chest();

  } else if(id === 'bomb'){
    /* 空袭：12 颗小炸弹预告 0.45 秒后落下，命中 8 次追加一颗大的 */
    for(var i=0;i<12;i++){
      var aa = Math.random()*TAU, rr = Math.sqrt(Math.random())*7;
      ultQueue.push({type:'air', x: hero.x + Math.cos(aa)*rr, z: hero.z + Math.sin(aa)*rr,
                     t: 0.45 + Math.random()*0.12, dmg: base*0.8, r: 1.9, big: false,
                     mark: 0, col: u.col});
    }
    ultQueue.push({type:'air', x: hero.x, z: hero.z, t: 0.72, dmg: base*5.0, r: 4.4,
                   big: true, mark: 0, col: u.col});
    SFX.boss();

  } else if(id === 'blade'){
    /* 血月：先把 6 单位内敌人往自己这边拽 0.35 秒，再一刀 4 倍伤害 + 回血。
       连刃本身是「贴脸才有收益」，必杀给它一次强制拉近的机会。 */
    ultRingFx.visible = true;
    ultRingFx.material.color.set(u.col);
    hero.ult.pullT = 0.35;
    ultQueue.push({type:'slash', x: hero.x, z: hero.z, t: 0.38, dmg: base*4.0, r: 5.4, col: u.col});
    shake(0.34); SFX.boss();
  }
  toast('超武 · ' + u.name, u.col);
  updateUltUI();
}

function updateUlt(dt){
  if(!hero.ult) return;
  if(hero.evoId && hero.ult.charge < 1){
    hero.ult.charge = Math.min(1, hero.ult.charge + dt / ULT[hero.evoId].cd);
  }
  if(hero.ult.active > 0) hero.ult.active = Math.max(0, hero.ult.active - dt);

  /* 贯穿光柱：持续期间每 0.1 秒结算一次，并在渲染里拉长 */
  if(hero.ult.beamTick !== undefined && ultBeam.visible){
    hero.ult.beamTick -= dt;
    if(hero.ult.beamTick <= 0){
      hero.ult.beamTick = 0.1;
      var bd = WDEF[hero.evoId].dmg[4] * hero.stat.arch[WDEF[hero.evoId].arch] * 0.6;
      damageBeam(hero.x, hero.z, hero.ult.ang, 2.2, bd);
      burst(hero.x + Math.sin(hero.ult.ang)*3, 1.0, hero.z + Math.cos(hero.ult.ang)*3,
            COS.warmwhite || 0xfff6e9, 3, 9, 0.7);
    }
    if(hero.ult.active <= 0){
      ultBeam.visible = false; ultBeamCore.visible = false;
      hero.ult.beamTick = undefined;
    }
  }

  /* 暴雨模式：持续期间每 0.1 秒往整片战场投 3 支落箭。
     1.8 秒 ≈ 54 支，覆盖半径 12 —— 屏幕上看得见「雨」，不是藏在弹道里。 */
  if(hero.evoId === 'bow' && hero.ult.active > 0 && hero.ult.rainT !== undefined){
    hero.ult.rainT -= dt;
    var guard = 0;
    while(hero.ult.rainT <= 0 && guard++ < 8){
      hero.ult.rainT += 0.08;
      for(var sa=0;sa<4;sa++) dropSkyArrow(hero.ult.rainDmg || 8);
      shake(0.04);
    }
  }

  /* 血月：把敌人往中心拽 */
  if(hero.ult.pullT > 0){
    hero.ult.pullT -= dt;
    forEachEnemy(function(e){
      var dx = hero.x - e.x, dz = hero.z - e.z;
      var d = Math.hypot(dx, dz) || 1;
      if(d < 9){ e.x += dx/d * 7.5 * dt; e.z += dz/d * 7.5 * dt; }
    });
    var pk = 1 - Math.max(0, hero.ult.pullT) / 0.35;
    ultRingFx.position.set(hero.x, 0.06, hero.z);
    ultRingFx.scale.setScalar(1.2 + pk * 8.2);
    ultRingFx.material.opacity = 0.75 * (1 - pk * 0.55);
    if(hero.ult.pullT <= 0) ultRingFx.visible = false;
  }

  /* 延时结算队列 */
  for(var i=ultQueue.length-1;i>=0;i--){
    var q = ultQueue[i];
    q.t -= dt;
    if(q.type === 'air' && q.mark < 1){
      /* 落点预告圈：0.45 秒里从外向内收，玩家能提前离开 */
      q.mark += dt;
    }
    if(q.t > 0) continue;
    ultQueue.splice(i, 1);
    if(q.type === 'air'){
      explode(q.x, q.z, q.dmg, q.r, q.big ? 7 : 3);
      if(q.big){ flash(0.26); shake(0.5); }
    } else if(q.type === 'slash'){
      if(boss && !boss.dead && dist2(q.x,q.z,boss.x,boss.z) < (q.r+boss.r)*(q.r+boss.r))
        hurtEnemy(boss, q.dmg, false);
      forEachEnemy(function(e){
        if(dist2(q.x,q.z,e.x,e.z) < (q.r+e.r)*(q.r+e.r)) hurtEnemy(e, q.dmg, false);
      });
      hero.hp = Math.min(hero.maxhp, hero.hp + 12);
      shock(q.x, q.z, q.col, 10, 0.6);
      burst(q.x, 0.9, q.z, q.col, 22, 13, 1.3);
      SFX.crit();
    } else if(q.type === 'spike'){
      addSpike(q.x, q.z, q.dmg, 5, true, hero.stat.range);
    }
  }

  updateUltUI();
}

/* ═══════════ 属性 ═══════════ */
hero.weapons = [{id:'bow', lv:1, cd:0, tick:0}];
hero.passives = {};
hero.stat = {atk:1, as:1, spd:9.2, pick:4.6, crit:0.06, range:1,
  arch:{melee:1, ranged:1}, archN:{melee:0, ranged:0}};

function hasWeapon(id){
  for(var i=0;i<hero.weapons.length;i++) if(hero.weapons[i].id===id) return hero.weapons[i];
  return null;
}
/* 流派乘区的唯一计算点。
   伤害 = 武器基础 × 流派倍率（1 + 精通等级×20%）× 套装（同流派 2 把 ×1.30）× 极限突破
   副属性：贴身给范围、投掷给暴击、射击给攻速 —— 三条线的手感从这里开始分岔。 */
function refreshStats(){
  var p = hero.passives;
  ARCH_KEYS.forEach(function(a){
    var cnt = 0;
    for(var i=0;i<hero.weapons.length;i++){
      if(WDEF[hero.weapons[i].id].arch === a) cnt++;
    }
    var mul = 1 + (p[a]||0)*ARCH_DMG;
    if(cnt >= 2) mul *= SET_BONUS;
    hero.stat.arch[a] = mul;
    hero.stat.archN[a] = cnt;
  });
  /* 攻速是唯一的「多打一轮」通道，也是后期清怪速率的全部来源。
     v0.18 把流派从三条收到两条时，这里读的还是已经不存在的 p.shot ——
     「远程精通 攻速 +5%/级」写在卡面上，实际恒等于 1.0，一次都没生效过。 */
  hero.stat.as    = 1 + (p.haste||0)*HASTE_STEP;
  /* 暴击目前没有成长通道，固定 6%。原来读 p.throw，同样是不存在的键。 */
  hero.stat.crit  = 0.06;
  hero.stat.range = 1 + (p.melee||0)*0.06;
  hero.stat.spd   = hero.speed * (1 + (p.move||0)*0.06);
  hero.stat.pick  = 4.6 * (1 + (p.magnet||0)*0.30);
  var newMax = 100 + (p.hp||0)*18;
  if(newMax !== hero.maxhp){
    var add = newMax - hero.maxhp;
    hero.maxhp = newMax;
    if(add > 0) hero.hp = Math.min(hero.maxhp, hero.hp + add);
    else hero.hp = Math.min(hero.hp, hero.maxhp);
  }
}

/* ═══════════ 索敌 ═══════════ */
function nearestEnemy(x, z, maxR){
  var best = null, bd = maxR*maxR;
  for(var k=0;k<4;k++){
    var list = E[EKEYS[k]];
    for(var i=0;i<list.length;i++){
      var e = list[i];
      if(e.dead) continue;
      var d = dist2(x, z, e.x, e.z);
      if(d < bd){ bd = d; best = e; }
    }
  }
  if(boss && !boss.dead){
    var db = dist2(x, z, boss.x, boss.z);
    if(db < bd){ bd = db; best = boss; }
  }
  return best;
}

/* ═══════════ 开火 ═══════════ */
function fireWeapon(w, st, ang, dist, tgt){
  var lv = w.lv, def = WDEF[w.id], evo = !!w.evo;
  /* 只有本流派的精通卡加成这把武器。混着点 = 每把都只吃到一半。 */
  var dmg = def.dmg[lv-1] * st.arch[def.arch] * (1 + 0.08*(w.plus||0));
  var isCrit = Math.random() < st.crit;
  if(isCrit) dmg *= 2.0;
  var sx = Math.sin(ang), cz = Math.cos(ang);
  if(w.id !== 'blade'){
    burst(hero.x + sx*0.78, 1.05, hero.z + cz*0.78, 0xfff6e9, 2, 4.6, 0.5);
  }

  /* 超武必杀的形态变化（只在 active 期间生效） */
  var ultOn = hero.ult && hero.ult.active > 0;
  var ultBow = ultOn && hero.evoId === 'bow';

  if(w.id === 'bow'){
    var n = evo ? 12 : [1,2,3,3,5][lv-1];
    if(ultBow) n += 2;
    var pierce = evo ? 99 : (lv >= 4 ? 2 : 0);
    var bspd = evo ? 36 : 32;
    var bdm = evo ? dmg*1.45 : dmg;
    for(var i=0;i<n;i++){
      var a = ang + (i-(n-1)/2)*(evo?0.15:0.17);
      spawnBullet({pool:'A', x:hero.x+Math.sin(a)*0.7, y:1.0, z:hero.z+Math.cos(a)*0.7,
        vx:Math.sin(a)*bspd, vz:Math.cos(a)*bspd, dmg:bdm, pierce:pierce, life:1.12, r:0.4, kind:'arrow'});
    }
    SFX.shoot();

  } else if(w.id === 'laser'){
    var nb = evo ? 4 : (lv>=5 ? 3 : (lv>=3 ? 2 : 1));
    var ldmg = evo ? dmg*1.9 : dmg;
    var llife = evo ? 1.35 : 0.52;
    for(var j=0;j<nb;j++){
      var a2 = ang + (j-(nb-1)/2)*0.13;
      spawnBullet({pool:'D', x:hero.x, y:1.05, z:hero.z,
        vx:Math.sin(a2)*58, vz:Math.cos(a2)*58, dmg:ldmg, pierce:99, life:llife,
        r:evo?0.44:0.3, kind:'laser', grow:1});
    }
    SFX.laser();

  } else if(w.id === 'bomb'){
    var nm = evo ? 6 : [1,2,2,3,4][lv-1];
    for(var b2=0;b2<nm;b2++){
      var a3 = ang + (b2-(nm-1)/2)*(evo?0.34:0.28) + rnd(-0.06,0.06);
      var sp = rnd(evo?16:13, evo?21:17);
      spawnBullet({pool:'B', x:hero.x, y:1.2, z:hero.z,
        vx:Math.sin(a3)*sp, vz:Math.cos(a3)*sp, dmg:evo?dmg*1.7:dmg, pierce:0,
        life:rnd(0.42,0.62), r:0.5, kind:'bomb', grow:evo?7:lv});
    }
    SFX.shoot();

  }
}

/* ═══════════ 连刃：呼吸式环绕 ═══════════
   不是「每隔 cd 打一次范围」，而是刀刃在内外圈之间往复：
   半个周期到一次极端就结算一次 —— 外扩打远处、回收打近处。
   一个呼吸周期两段伤害，玩家能看见刀在哪，也能感觉到「张开 / 收回」。

   为什么不用「每 cd 一次全范围 AoE」：那样刀刃只是个装饰，
   伤害和画面各走各的；玩家躲不躲、贴不贴脸，输出都一样。 */
function bladeRange(w, st){
  var evo = !!w.evo;
  return {
    min: 1.15 * st.range,
    max: (2.35 + w.lv * 0.34) * st.range * (evo ? 1.45 : 1)
  };
}
function bladeHit(w, st){
  var d = WDEF[w.id], evo = !!w.evo;
  var rg = bladeRange(w, st);
  /* 向外那张打外圈，收回那张打内圈 */
  var reach = w.bdir === 1 ? rg.max : rg.min;
  var dmg = d.dmg[w.lv-1] * st.arch[d.arch] * (1 + 0.08*(w.plus||0));
  var isCrit = Math.random() < st.crit;
  if(isCrit) dmg *= 2.0;
  var hit = 0;
  forEachEnemy(function(e){
    if(dist2(hero.x, hero.z, e.x, e.z) < (reach + e.r) * (reach + e.r)){ hurtEnemy(e, dmg, isCrit); hit++; }
  });
  if(boss && !boss.dead && dist2(hero.x, hero.z, boss.x, boss.z) < (reach + boss.r) * (reach + boss.r)){
    hurtEnemy(boss, dmg, isCrit); hit++;
  }
  if(evo) hero.hp = Math.min(hero.maxhp, hero.hp + 0.9);
  if(hit){ SFX.hit(); burst(hero.x, 0.9, hero.z, 0xb6ff3c, 3, 5.5, 0.45); }
}
function updateBlades(dt){
  var st = hero.stat;
  for(var i=0;i<hero.weapons.length;i++){
    var w = hero.weapons[i], d = WDEF[w.id];
    if(d.arch !== 'melee') continue;
    if(w.bt === undefined){ w.bt = 0; w.bdir = 1; }
    var half = d.cd[w.lv-1] / st.as / 2;
    w.bt += dt;
    var guard = 0;
    /* 一帧跨过多个半周期时补结算（切后台回来 / 卡顿时不会丢伤害） */
    while(w.bt >= half && guard++ < 4){
      w.bt -= half;
      bladeHit(w, st);
      w.bdir = -w.bdir;
    }
  }
}

function updateWeapons(dt){
  var st = hero.stat;
  updateBlades(dt);
  for(var i=0;i<hero.weapons.length;i++){
    var w = hero.weapons[i];
    /* 近战不按「冷却开一枪」走，由 updateBlades 按呼吸相位结算 */
    if(WDEF[w.id].arch === 'melee') continue;
    w.cd -= dt;
    if(w.cd > 0) continue;
    var def = WDEF[w.id];
    var tgt = nearestEnemy(hero.x, hero.z, 24);
    if(!tgt){ w.cd = 0.1; continue; }
    var dx = tgt.x - hero.x, dz = tgt.z - hero.z;
    var d = Math.sqrt(dx*dx+dz*dz) || 1;
    var ang = Math.atan2(dx, dz);
    fireWeapon(w, st, ang, d, tgt);
    /* 暴雨模式期间弓箭攻速 ×2.6（只作用于弓，不作用于其它武器） */
    var rush = (hero.ult && hero.ult.active > 0 && hero.evoId === 'bow' && w.id === 'bow') ? 1.8 : 1;
    w.cd = def.cd[w.lv-1] / st.as / rush;
  }
}

/* ═══════════ 地刺 ═══════════ */
var spikeGeo = new THREE.ConeGeometry(0.34, 1.1, 4);
var spikePool = instPool(spikeGeo, toon(COS.pur), 90);
var spikes = [];
function addSpike(x, z, dmg, lv, evo, rng){
  if(spikes.length > 85) return;
  spikes.push({x:x, z:z, dmg:dmg, life:evo?4.2:3.2, max:evo?4.2:3.2,
               tick:0, lv:lv, evo:!!evo, born:0, rng:rng||1});
}

/* ═══════════ 伤害与死亡 ═══════════ */
function hurtEnemy(e, dmg, isCrit){
  if(e.dead) return;
  if(e.boss) e.dmgTaken = (e.dmgTaken || 0) + (e.invulnT > 0 ? 0 : dmg);
  /* BOSS 转阶段/狂暴期间无敌：伤害进不来，但要给玩家一个明确反馈，
     否则会以为「打不动是数值出问题了」。 */
  if(e.boss && e.invulnT > 0){
    if(Math.random() < 0.12){
      var ip = toScreen(e.x, 2.2, e.z);
      popDmg('免疫', ip.x, ip.y, '#9fb3c8');
    }
    return;
  }
  e.hp -= dmg;
  e.hit = 1;
  if(isCrit){
    var sp = toScreen(e.x, 1.4, e.z);
    popDmg(Math.round(dmg) + '!', sp.x, sp.y, '#ffe600');
    burst(e.x, e.y+0.2, e.z, 0xffe600, 3, 7, 0.7);
    SFX.crit();
  } else {
    SFX.hit();
  }
  if(e.hp <= 0) killEnemy(e);
}

function killEnemy(e){
  if(e.dead) return;
  e.dead = true;
  S.kills++;
  var col = ETYPES[e.t] ? 0xff2e88 : COS.mag;
  burst(e.x, (e.y||0) + 0.62, e.z, e.elite ? COS.yel : COS.mag, e.boss? 26 : 8, 8, e.boss? 1.6 : 0.95);
  SFX.kill();

  if(e.boss){
    killBoss();
    shock(e.x, e.z, COS.yel, 14, 0.8);
    flash(0.4); shake(0.7);
    popWord('K.O.!', innerWidth/2, innerHeight*0.4, '#ffe600', 76);
    for(var g=0;g<14;g++) spawnGem(e.x + rnd(-3,3), e.z + rnd(-3,3), 6);
    buildChest(e.x, e.z);
    if(S.wave >= S.waveTotal) setTimeout(function(){ if(S.mode === 'play') victory(); }, 1500);
    return;
  }

  var sp2 = toScreen(e.x, 1.4, e.z);
  if(Math.random() < 0.22) popWord(pick(WORDS), sp2.x, sp2.y, '#ffe600', rnd(26,40));
  shake(0.055);

  spawnGem(e.x, e.z, e.xp);
  if(Math.random() < 0.055) buildChest(e.x, e.z);

  var list = E[e.t];
  var idx = list.indexOf(e);
  if(idx >= 0) list.splice(idx, 1);
}

/* ═══════════ 爆炸 ═══════════ */
function explode(x, z, dmg, radius, lv){
  shock(x, z, COS.yel, radius*1.5, 0.45);
  burst(x, 1.0, z, COS.yel, 14, 10, 1.2);
  burst(x, 1.0, z, COS.mag, 8, 8, 1.0);
  S.hitstop = 0.05;
  shake(0.22); flash(0.14);
  SFX.kill();
  forEachEnemy(function(e){
    if(dist2(x,z,e.x,e.z) < (radius+e.r)*(radius+e.r)) hurtEnemy(e, dmg, false);
  });
  if(boss && !boss.dead && dist2(x,z,boss.x,boss.z) < (radius+boss.r)*(radius+boss.r)) hurtEnemy(boss, dmg, false);
  // 五级连锁
  if(lv >= 5){
    forEachEnemy(function(e){
      var dd = dist2(x,z,e.x,e.z);
      if(dd < (radius*2.1)*(radius*2.1) && dd > radius*radius) hurtEnemy(e, dmg*0.4, false);
    });
  }
}

/* ═══════════ 升级 ═══════════ */
var pendingLevels = 0;

function gainXP(v){
  hero.xp += v;
  while(hero.xp >= hero.xpNext){
    hero.xp -= hero.xpNext;
    hero.lv++;
    hero.xpNext = Math.round(11 + hero.lv*7.5);
    pendingLevels++;
  }
  if(pendingLevels > 0 && S.mode === 'play') openLevelUp();
}

function buildChoices(){
  var pool = [];
  function add(c, w){ pool.push({c:c, w:w}); }

  /* 1. 超武进化：高权重 + 保底，每级最多一张。
     原来是「必出」—— 达标之后每一级都有一张超武卡抢走一个格子。开局武器是弓，
     它最先满级，所以「箭雨」几乎每级都刷；三把武器都能进化时三张卡全是超武，
     想拿别的卡根本没有位置。实测达标后抽样：超武槽 1.00~3.00/次，出现率 100%。
     那不是概率问题，是必出。
     现在：进池参与竞争（权重 1.4，武器升级 2.0），每级最多一张，
     连续三级没刷到则第四级必出。实测：常态单级 28%，算上保底后平均 38%
     （原来是 100%），平均 2.5 级见到第一次，最长等 4 级。
     判据在 tests/cardpool.test.mjs —— 改权重或阈值先跑它。 */
  var out = [];
  var evoCand = [];
  if(!hero.evoId){
    hero.weapons.forEach(function(w){
      var ev = EVO[w.id];
      if(ev && w.lv >= 5 && !w.evo && (hero.passives[ev.req] || 0) >= 2) evoCand.push({t:'evo', id:w.id});
    });
  }
  var evoForced = false;
  if(evoCand.length){
    if((hero.evoDry || 0) >= 4) evoForced = true;   /* 连续三级没刷到 → 第四级必出 */
    else evoCand.forEach(function(c){ add(c, EVO_W); });
  } else {
    hero.evoDry = 0;                                 /* 没达标不累计，从达标那级开始算 */
  }

  // 2. 武器升级
  hero.weapons.forEach(function(w){
    if(w.lv < WDEF[w.id].max) add({t:'wup', id:w.id}, 2.0);
  });

  // 3. 新武器：已经有同流派武器 → 加权，让卡池把你往一条线上推
  var wLimit = S.wave >= 8 ? 4 : 3;
  if(hero.weapons.length < wLimit){
    WKEYS.forEach(function(id){
      if(hasWeapon(id)) return;
      var a = WDEF[id].arch;
      var w = 1.0;
      if(hero.stat.archN[a] >= 1) w = 1.5;
      if((hero.passives[a] || 0) >= 2) w = 1.9;
      add({t:'wnew', id:id}, w);
    });
  }

  // 4. 被动。流派卡：已带该流派武器才值得点（1.8），否则基本不给（0.45）
  PKEYS.forEach(function(id){
    if((hero.passives[id] || 0) >= PDEF[id].max) return;
    var w = 1.0;
    var a = PDEF[id].arch;
    if(a) w = (hero.stat.archN[a] >= 1) ? 1.8 : 0.45;
    add({t:'pas', id:id}, w);
  });

  // 5. 极限突破
  hero.weapons.forEach(function(w){
    if(w.lv >= WDEF[w.id].max) add({t:'limit', id:w.id}, 0.9);
  });

  // 加权无放回抽，直到 3 张。超武卡最多一张：同一次升级里抽到第二张直接作废重抽
  var evoCount = 0;
  if(evoForced){ out.push(pick(evoCand)); evoCount = 1; }
  while(out.length < 3 && pool.length){
    var total = 0, i;
    for(i=0;i<pool.length;i++) total += pool[i].w;
    var r = Math.random() * total, k = pool.length - 1;
    for(i=0;i<pool.length;i++){
      r -= pool[i].w;
      if(r <= 0){ k = i; break; }
    }
    var cand = pool[k].c;
    pool.splice(k, 1);
    if(cand.t === 'evo'){
      if(evoCount >= 1) continue;
      evoCount++;
    }
    out.push(cand);
  }
  if(evoCount) hero.evoDry = 0;

  /* 保底：三张里至少一张是「已持有武器的升级」。
     玩家抱怨的「我玩射击它让我选炸弹」不是随机的错 —— 是池子允许
     三张全是无关卡。补一条：只要还有武器没满级，第一张一定是升级。
     这条规则不制造强度，只保证「每次升级都有一次兑现已有投入的机会」。 */
  if(out.length && out[0].t !== 'evo'){
    var upIdx = -1;
    for(var ui=0; ui<out.length; ui++){
      if(out[ui].t === 'wup' || out[ui].t === 'evo'){ upIdx = ui; break; }
    }
    if(upIdx < 0){
      var cand2 = null;
      for(var wi=0; wi<hero.weapons.length; wi++){
        if(hero.weapons[wi].lv < WDEF[hero.weapons[wi].id].max){ cand2 = hero.weapons[wi].id; break; }
      }
      if(cand2) out[0] = {t:'wup', id:cand2};
    }
  }

  /* 低血补治疗：不能顶掉超武卡 —— 那是攒了半局才有的一次进化机会。
     原来固定写 out[2]，超武占满三格时会被无声吞掉。 */
  if(hero.hp < hero.maxhp*0.45 && out.length >= 2){
    var hi = -1;
    for(var hh=out.length-1; hh>=0; hh--){ if(out[hh].t !== 'evo'){ hi = hh; break; } }
    if(hi >= 0) out[hi] = {t:'heal'};
  }
  while(out.length < 3){
    out.push({t:'limit', id: hero.weapons[0] ? hero.weapons[0].id : 'bow'});
  }
  return out;
}

function openLevelUp(refresh){
  if(!refresh && S.mode !== 'play') return;
  S.mode = 'level';
  if(!refresh){
    hero.evoDry = (hero.evoDry || 0) + 1;   /* 每升一级记一次「没见到超武卡」，重掷不重复计 */
    SFX.level(); flash(0.22);
    /* 升级是玩家看不见摸不着的事（经验球自己飞过来），
       所以在角色脚下补一圈金色扩散，把「升级」这个事件钉在画面上。 */
    shock(hero.x, hero.z, COS.yel, 6.5, 0.7);
    burst(hero.x, 1.1, hero.z, COS.yel, 14, 9, 1.1);
    var lsp = toScreen(hero.x, 2.2, hero.z);
    popWord('LEVEL UP', lsp.x, lsp.y - 20, '#ffe600', 34);
  }
  var cs = buildChoices();
  var box = $('cards');
  box.innerHTML = '';
  cs.forEach(function(c){
    var el = document.createElement('div');
    el.className = 'card';
    var nm = '', kd = '', gain = '', ds = '', ic = '', col = '#ffe600';
    if(c.t === 'wup'){
      var w = hasWeapon(c.id), d = WDEF[c.id];
      nm = d.name; ic = d.short; col = d.col;
      kd = '武器强化';
      gain = 'Lv.' + w.lv + ' → Lv.' + (w.lv + 1);
      ds = d.lv[w.lv];
    } else if(c.t === 'wnew'){
      /* 新武器卡必须说清「会多一把、占一个槽、属于哪条线」，
         否则玩家点完发现背包里多了东西，会以为是自己没选就自动装上了。 */
      var d2 = WDEF[c.id], aNew = ARCH[d2.arch];
      nm = d2.name; ic = d2.short; col = d2.col;
      var nNow = hero.stat.archN[d2.arch] || 0;
      kd = aNew.name + '线 · 会占一个槽位';
      gain = '武器 ' + hero.weapons.length + ' 把 → ' + (hero.weapons.length + 1) + ' 把';
      ds = d2.lv[0] + (nNow === 1 ? '　（与已有同线武器凑成套装 +30%）' : '');
      el.classList.add('newc');
    } else if(c.t === 'pas'){
      var p = PDEF[c.id], lvp = (hero.passives[c.id]||0);
      nm = p.name; ic = p.short; col = p.col;
      kd = p.arch ? ('流派精通 · ' + ARCH[p.arch].name + '线') : '通用被动';
      gain = 'Lv.' + lvp + ' → Lv.' + (lvp + 1);
      ds = p.txt(lvp + 1);
      if(p.arch) el.classList.add('archc');
    } else if(c.t === 'evo'){
      var ev = EVO[c.id], de = WDEF[c.id];
      nm = ev.name; ic = de.short; col = ev.col;
      kd = '超武进化';
      gain = ev.gain;
      ds = ev.desc;
      el.className = 'card evoc';
    } else if(c.t === 'limit'){
      var wl2 = hasWeapon(c.id), dl = WDEF[c.id];
      var cur = (wl2 && wl2.plus) || 0;
      nm = dl.name; ic = dl.short; col = dl.col;
      kd = '极限突破';
      gain = '+' + Math.round((cur + 1) * 8) + '% 伤害';
      ds = '已叠 ' + cur + ' 层，可无限叠加';
      el.classList.add('limitc');
    } else {
      nm = '紧急治疗'; ic = 'HP'; col = '#ff3b30';
      kd = '回复';
      gain = '+35% 生命';
      ds = '回一口血，下一波继续';
    }
    el.innerHTML =
      '<div class="ic" style="background:'+col+';color:'+inkOn(col)+'"><b>'+ic+'</b></div>'+
      '<div class="kd">'+kd+'</div>'+
      '<div class="nm">'+nm+'</div>'+
      '<div class="gain">'+gain+'</div>'+
      '<div class="ds">'+ds+'</div>';
    el.style.animationDelay = (box.children.length * 55) + 'ms';
    el.onclick = function(){ takeChoice(c); };
    box.appendChild(el);
  });
  var rb = $('rerollbtn');
  rb.textContent = S.rerolls > 0 ? ('重掷 · 剩 ' + S.rerolls + ' 次') : '没有重掷次数了';
  rb.disabled = S.rerolls <= 0;
  rb.onclick = function(){
    if(S.rerolls <= 0) return;
    S.rerolls--;
    SFX.chest();
    openLevelUp(true);
  };
  $('scr-level').classList.remove('hide');
}

function takeChoice(c){
  if(c.t === 'wup'){
    hasWeapon(c.id).lv++;
  } else if(c.t === 'wnew'){
    hero.weapons.push({id:c.id, lv:1, cd:0, tick:0});
  } else if(c.t === 'pas'){
    hero.passives[c.id] = (hero.passives[c.id]||0) + 1;
    refreshStats();
  } else if(c.t === 'evo'){
    var we = hasWeapon(c.id);
    if(we) we.evo = true;
    hero.evoId = c.id;
    hero.ult.charge = 1;      /* 进化当场满蓄力，立刻能试一次 */
    updateUltUI();
    toast('超武进化　' + EVO[c.id].name, '#ffe600');
    flash(0.3); shake(0.4);
  } else if(c.t === 'limit'){
    var wl = hasWeapon(c.id);
    if(wl) wl.plus = (wl.plus||0) + 1;
  } else {
    hero.hp = Math.min(hero.maxhp, hero.hp + hero.maxhp*0.35);
  }
  pendingLevels--;
  $('scr-level').classList.add('hide');
  SFX.chest();
  refreshStats();
  updateHUD();
  S.mode = 'play';
  if(pendingLevels > 0) setTimeout(openLevelUp, 150);
}

/* ═══════════ 宝箱 ═══════════ */
function toast(msg, col, top){
  var d = document.createElement('div');
  d.className = 'word';
  d.style.left = '50%';
  /* 18% 在 390 高的手机上正好压在波次条上，三层字叠成一团。
     矮屏把默认位置挪到 32%，落在计时器下方的空档里。 */
  d.style.top = top || (innerHeight < 520 ? '32%' : '18%');
  d.style.fontSize = '26px';
  d.style.color = col || '#ffe600';
  d.style.setProperty('--rot', '0deg');
  d.textContent = msg;
  fxEl.appendChild(d);
  setTimeout(function(){ d.remove(); }, 760);
}

function openChest(c){
  SFX.chest();
  shock(c.x, c.z, COS.yel, 7, 0.6);
  burst(c.x, 0.9, c.z, COS.yel, 18, 11, 1.3);
  burst(c.x, 0.9, c.z, COS.cyn, 10, 8, 1.0);
  flash(0.2); shake(0.2);
  clearChest(c);

  /* 1) 武器：只升级「已有」武器，绝不新增。
     参考 Arrow.io（全部内容只从升级三选一来）与 Vampire Survivors
     （官方 Wiki：chest 只升级 player currently has 的武器）。
     原来这里有一段 hero.weapons.push()，会在开箱时直接塞一把新武器，
     玩家没有选择权也不暂停——这就是「我没选过怎么多了一把」的来源。
     新武器只能从升级三选一的 wnew 卡进入。 */
  var upgradable = hero.weapons.filter(function(w){ return w.lv < WDEF[w.id].max; });
  if(upgradable.length > 0){
    var w2 = pick(upgradable);
    w2.lv++;
    toast('武器强化 · ' + WDEF[w2.id].name + ' Lv.' + w2.lv, '#ffe600');
  } else if(hero.weapons.length > 0){
    /* 全部满级：转成极限突破，避免宝箱白开 */
    var w3 = pick(hero.weapons);
    w3.plus = (w3.plus || 0) + 1;
    toast('极限突破 · ' + WDEF[w3.id].name + ' +' + w3.plus, '#7b2ff7');
  }

  // 2) 被动
  setTimeout(function(){
    var pool = PKEYS.filter(function(id){ return (hero.passives[id]||0) < PDEF[id].max; });
    if(pool.length){
      var pid = pick(pool);
      hero.passives[pid] = (hero.passives[pid]||0) + 1;
      refreshStats();
      toast('被动 · ' + PDEF[pid].name + ' Lv.' + hero.passives[pid], PDEF[pid].col, '27%');
    }
    // 3) 治疗
    hero.hp = Math.min(hero.maxhp, hero.hp + hero.maxhp*0.18);
    updateHUD();
  }, 420);
}

/* ═══════════ 背包 ═══════════ */
function estimateDPS(single){
  /* 弹数和清怪系数统一从 WDEF 取，不再按武器逐个手写。
     原来弓 Lv5 按 3 发算（实际射 5 发）、回旋镖按固定 2 倍算（实际 4 枚），
     背包里显示的数字比真实值低一截，等于在误导玩家。
     清怪系数 = 命中率与范围收益的等效折算，定义见数值配置表「武器-流派与超武」。

     single=true 时不算清怪系数：那个系数是「一发能清几只怪」的折算，
     拿来算单个 BOSS 会把镰刀（2.6）、地刺（4.6）这种 AOE 武器高估两到四倍。
     血月斩对着一只 BOSS，并不会因为它是范围伤害就打出四倍输出。 */
  var total = 0, st = hero.stat;
  hero.weapons.forEach(function(w){
    var d = WDEF[w.id];
    var dmg = d.dmg[w.lv-1] * st.arch[d.arch] * (1 + 0.08*(w.plus||0));
    var cd = d.cd[w.lv-1] / st.as;
    var cnt = w.evo ? d.cntEvo : d.cnt[w.lv-1];
    /* 单目标口径：不再假设「每一发都打中同一个目标」。
       扇形散射的 12 支箭，对着一只 BOSS 实际只有一半左右能命中 ——
       实测（tests/dps-probe）弓箭超武理论 1023、实际 527，正好两倍。
       每把武器一个 sHit 系数，就是从实测反推的命中率。 */
    var sh = w.evo ? (d.sHitEvo == null ? (d.sHit == null ? 1 : d.sHit) : d.sHitEvo)
                   : (d.sHit == null ? 1 : d.sHit);
    var coef = single ? sh : (w.evo ? d.coefEvo : d.coef);
    /* 飞镖一趟出去回来打两段（回程 55%，见 fireWeapon 的 backMul），cnt 只是「几枚」，
       所以这里要乘上单枚的等效段数，否则背包会把它的输出低估掉一半。 */
    var hitMul = d.hitMul || 1;
    total += dmg * cnt / cd * coef * hitMul;
  });
  return Math.round(total);
}

/* 当前配装对单个目标的期望 DPS：在 estimateDPS(true) 基础上补暴击期望。
   暴击是独立乘区，平时算「清怪 DPS」时不体现，但打 BOSS 时它是实打实的输出。 */
function currentBossDPS(){
  var critMul = 1 + hero.stat.crit * (2.0 - 1);
  return Math.max(1, Math.round(estimateDPS(true) * critMul));
}

            (ok ? '★ 下次升级可以进化' :
              ('进化需要「' + PDEF[ev.req].name + '」达到 ' + need + ' 级，现在 ' + have + ' 级' +
               (w.lv >= 5 ? '' : '，武器还要先满级'))) +

  for(var k = hero.weapons.length; k < 4; k++){

      '<div style="flex:1"><div class="t"><span>空槽</span><i>—</i></div></div></div>' +
      '<div class="d">开宝箱补满</div>';

/* ═══════════ 连刃视觉 ═══════════
   一把刀由五件拼成：刀身（平直段）+ 刀尖（四棱收锋）+ 护手 + 握柄 + 柄头。
   之前整把刀就是一个 Box —— 俯视看是一截绿板子，转起来像在旁边抽动。

   两个关键点：
   1. 刀身与刀尖分开给色，刀尖更亮。收锋那一段在俯视里能看出「锋」，不是一根棍。
   2. 刀身沿**切线**摆（不是沿半径朝外戳）。沿半径朝外是「太阳光芒」，沿切线才是「转起来的刀」。
   另加两道同心细环标出内圈 / 外圈，让「呼吸」的边界看得见 —— 也顺带说明了判定范围。 */
var bladeParts = [], bladeRings = [];
(function(){
  var geo = mergeParts([
    {geo:G_box(0.15, 0.052, 0.60), color:0xb6ff3c, z:0.00},      // 刀身
    {geo:G_cone(0.086, 0.36, 4), color:0xe6ffa2, z:0.47, rx:Math.PI/2, sz:0.34}, // 刀尖（压扁成刃）
    {geo:G_box(0.30, 0.052, 0.062), color:0x1d3610, z:-0.33},   // 护手
    {geo:G_cyl(0.044, 0.040, 0.24, 6), color:INK, z:-0.47, rx:Math.PI/2},        // 握柄
    {geo:G_sphere(0.056, 6, 6), color:0x1d3610, z:-0.61}        // 柄头
  ]);
  var edge = outlineGeo(geo, 0.018);
  for(var i=0;i<6;i++){
    var m = new THREE.Mesh(geo, toonVC());
    m.add(new THREE.Mesh(edge, OUTLINE_MAT));
    m.visible = false;
    m.frustumCulled = false;
    scene.add(m);
    bladeParts.push(m);
  }
  /* 呼吸边界：两个细环，用同一个单位几何缩放，避免每帧重建几何 */
  var ringGeo = new THREE.RingGeometry(0.975, 1.0, 44);
  for(var r=0;r<2;r++){
    var rm = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
      color:0xb6ff3c, transparent:true, opacity:0, side:THREE.DoubleSide, depthWrite:false
    }));
    rm.rotation.x = -Math.PI/2;
    rm.position.y = 0.06;
    rm.visible = false;
    scene.add(rm);
    bladeRings.push(rm);
  }
})();

var keys = {};
addEventListener('keydown', function(e){
  var k = (e.key||'').toLowerCase();
  keys[k] = true;
  if(k === 'tab'){ e.preventDefault(); toggleBag(); }
  if(k === 'escape'){ e.preventDefault(); togglePause(); }
  if(k === 'm'){
    AUDIO.muted = !AUDIO.muted;
    AUDIO.apply();
    refreshMuteUI();
  }
  if(k === ' '){
    e.preventDefault();
    if(S.mode === 'over') startGame();
    else if(S.mode === 'play') triggerUlt();
  }
});
addEventListener('keyup', function(e){
  keys[(e.key||'').toLowerCase()] = false;
});
addEventListener('blur', function(){ keys = {}; });

/* ═══════════ 触屏操作 ═══════════
   浮动摇杆：以按下点为原点，手指相对它移动多少，角色就走多快。
   STICK_R 是「推到底」需要的距离（约 1.5cm），推得越远越快，推到就满速。
   没有任何视觉元素 —— 全屏滑动本来就够直观，画个圆盘反而挡视线。
   判定走 canvas 的 pointer 事件，不用 touch 事件：
   pointer 在 PC 上也能用（鼠标拖拽），而且有 setPointerCapture，
   手指滑到 HUD 上面也不会丢事件。 */
var stick = {on:false, id:null, ox:0, oy:0, nx:0, nz:0};
var STICK_R = 58;

canvas.addEventListener('pointerdown', function(e){
  if(e.pointerType !== 'touch') return;
  if(S.mode !== 'play') return;
  if(stick.id !== null) return;
  stick.id = e.pointerId; stick.on = true;
  stick.ox = e.clientX; stick.oy = e.clientY;
  stick.nx = 0; stick.nz = 0;
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
});
canvas.addEventListener('pointermove', function(e){
  if(!stick.on || e.pointerId !== stick.id) return;
  var dx = e.clientX - stick.ox, dy = e.clientY - stick.oy;
  var len = Math.hypot(dx, dy);
  if(len > STICK_R){ dx = dx/len*STICK_R; dy = dy/len*STICK_R; }
  stick.nx = dx/STICK_R;
  stick.nz = dy/STICK_R;
});
function endStick(e){
  if(!stick.on) return;
  stick.on = false; stick.id = null;
  stick.nx = 0; stick.nz = 0;
}
canvas.addEventListener('pointerup', endStick);
canvas.addEventListener('pointercancel', endStick);

/* ═══════════ HUD ═══════════ */

bossBar.style.cssText = 'position:absolute;left:50%;top:132px;transform:translateX(-50%);' +
  'width:min(420px,74vw);display:none;pointer-events:none';
/* 初始只留空壳，名字和配色由 setBossBar() 按 BOSS 类型填 */

$('hud').appendChild(bossBar);

function fmtTime(t){

}

     那一行在手机上正好和弹出的提示条撞在一起。 */
  var leftS = Math.max(0, Math.ceil(S.waveLen - S.waveT));
  $('wavetxt').textContent = '第 ' + S.wave + ' 波 / ' + S.waveTotal +
    (S.wave >= S.waveTotal ? ' · 最后一波' : ' · ' + leftS + 's');
  var wp = clamp(S.waveT/S.waveLen, 0, 1);
  $('wavefill').style.width = (wp*100)+'%';
  $('wavelbl').textContent = S.wave === 10 ? '最后一波 · 击败 BOSS' : '本波剩余 ' + Math.ceil(S.waveLen - S.waveT) + 's';
  $('lvtxt').textContent = hero.lv;
  $('killtxt').textContent = S.kills;
  $('xpfill').style.width = clamp(hero.xp/hero.xpNext,0,1)*100 + '%';
  $('xptxt').textContent = '等级 ' + hero.lv + '　经验 ' + Math.round(clamp(hero.xp/hero.xpNext,0,1)*100) + '%';
  renderSlots();
  if(boss && !boss.dead){
    bossBar.style.display = 'block';
    var bh = $('bosshp');
    if(bh) bh.style.width = clamp(boss.hp/boss.maxhp,0,1)*100 + '%';
